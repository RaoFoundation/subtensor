[package]
name = "py-sp-core"
version = "0.1.1"
edition = "2021"
publish = false
description = "Python bindings for Substrate sp-core key primitives, built against the workspace's sp-core so wallet crypto always matches the chain"
license = "MIT"

[lib]
name = "py_sp_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
ansible-vault = "0.2.1"
base64 = "0.22.1"
bip39 = { version = "2.0", default-features = false, features = ["std", "rand"] }
fernet = "=0.2.1"
hex = "0.4.3"
pbkdf2 = "0.12.2"
pyo3 = { version = "0.23", features = ["abi3-py310"] }
scrypt = "0.11.0"
schnorrkel = "0.11.5"
serde = { version = "1.0.132", features = ["derive"] }
serde_json = "1.0.132"
sha2 = "0.10.8"
sodiumoxide = { version = "0.2", default-features = false, features = ["std"] }
sp-core = { workspace = true, features = ["std", "full_crypto"] }

[features]
default = []
extension-module = ["pyo3/extension-module"]
