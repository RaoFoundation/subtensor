[package]
name = "subtensor-hashed"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
codec = { workspace = true, features = ["derive"] }
scale-info = { workspace = true, features = ["derive"] }
sp-core.workspace = true
sp-io = { workspace = true, optional = true }
fips204 = { path = "../../vendor/fips204", default-features = false, features = ["ml-dsa-65"] }
sha3 = { version = "0.10.8", default-features = false }

[dev-dependencies]
hex = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true

[features]
default = ["std", "verify"]
std = ["hex/std", "serde_json/std", "codec/std", "scale-info/std", "sha3/std", "sp-core/std", "sp-io?/std"]
verify = ["dep:sp-io"]
