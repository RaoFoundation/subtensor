[package]
name = "subtensor-hashed"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
codec = { workspace = true, features = ["derive"] }
scale-info = { workspace = true, features = ["derive"] }
sp-core.workspace = true
sp-io = { workspace = true, optional = true }

[lints]
workspace = true

[features]
default = ["std", "verify"]
std = ["codec/std", "scale-info/std", "sp-core/std", "sp-io?/std"]
verify = ["dep:sp-io"]
