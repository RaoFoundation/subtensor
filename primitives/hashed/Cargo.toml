[package]
name = "subtensor-hashed"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
codec = { workspace = true, features = ["derive"] }
curve25519-dalek = { version = "=4.1.3", default-features = false }
scale-info = { workspace = true, features = ["derive"] }
sp-core.workspace = true
sp-io = { workspace = true, optional = true }
fips204 = { path = "../../vendor/fips204", default-features = false, features = ["ml-dsa-65"] }
sha3 = { version = "0.10.8", default-features = false }
# Freeze the original Falcon padded format and deterministic key generation.
# The 0.4 series is an incompatible, pre-standard FN-DSA format.
fn-dsa-comm = { version = "=0.3.0", default-features = false, features = ["no_avx2"] }
fn-dsa-vrfy = { version = "=0.3.0", default-features = false, features = ["no_avx2"] }
fn-dsa-kgen = { version = "=0.3.0", default-features = false, features = ["no_avx2"], optional = true }
fn-dsa-sign = { version = "=0.3.0", default-features = false, features = ["no_avx2"], optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
hex = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true

[features]
default = ["std", "verify"]
std = ["hex/std", "serde_json/std", "codec/std", "scale-info/std", "sha3/std", "sp-core/std", "sp-io?/std", "signing", "zeroize?/std"]
verify = ["dep:sp-io"]
signing = ["dep:fn-dsa-kgen", "dep:fn-dsa-sign", "dep:zeroize"]
