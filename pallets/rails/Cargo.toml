[package]
name = "pallet-rails"
version = "0.1.0"
description = "The hub of the canonical rails: settles orders that bridges relay between other chains and Bittensor."
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
codec = { workspace = true, features = ["derive"] }
frame-benchmarking = { workspace = true, optional = true }
frame-support.workspace = true
frame-system.workspace = true
pallet-canonical-pool.workspace = true
pallet-tusd.workspace = true
scale-info = { workspace = true, features = ["derive"] }
sp-api.workspace = true
sp-arithmetic.workspace = true
sp-core.workspace = true
sp-runtime.workspace = true
subtensor-macros.workspace = true
subtensor-runtime-common.workspace = true

[dev-dependencies]
pallet-balances = { workspace = true, features = ["std"] }
pallet-timestamp = { workspace = true, features = ["std"] }
sp-io.workspace = true

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-balances/std",
	"pallet-canonical-pool/std",
	"pallet-timestamp/std",
	"pallet-tusd/std",
	"scale-info/std",
	"sp-api/std",
	"sp-arithmetic/std",
	"sp-core/std",
	"sp-io/std",
	"sp-runtime/std",
	"subtensor-runtime-common/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-canonical-pool/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"pallet-tusd/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"subtensor-runtime-common/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-canonical-pool/try-runtime",
	"pallet-timestamp/try-runtime",
	"pallet-tusd/try-runtime",
	"sp-runtime/try-runtime",
]
