[package]
edition = "2021"
name = "libp2p-dns"
version = "0.42.0"
description = "DNS transport for libp2p (OS resolver; no hickory)"
license = "MIT"
repository = "https://github.com/libp2p/rust-libp2p"

[dependencies]
async-trait = "0.1.80"
futures = "0.3.30"
libp2p-core = "0.42.0"
libp2p-identity = "0.2.9"
parking_lot = "0.12.3"
smallvec = "1.13.2"
tracing = "0.1.37"
tokio = { version = "1", features = ["net"] }

[features]
default = []
async-std = []
tokio = []
