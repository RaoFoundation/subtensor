# The RaoFoundation/frontier fork still pins polkadot-sdk to the
# github.com/opentensor/polkadot-sdk remote at the same rev this workspace
# consumes from github.com/RaoFoundation/polkadot-sdk. Cargo treats the two
# git URLs as distinct sources, producing duplicate frame-system / frame-support
# / sp-* crates. That duplication makes T::AccountId ambiguous across two
# identical-but-distinct frame_system copies in any pallet that depends on both
# (e.g. pallet-admin-utils via pallet-evm-chain-id), breaking the benchmark
# build. Redirect the frontier-side polkadot-sdk crates to the RaoFoundation
# remote at the same rev so the whole graph resolves to a single copy.
