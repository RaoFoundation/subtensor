[package]
name = "subtensor-macros"
publish = false
version = "0.1.0"
edition.workspace = true
license = "MIT"

description = "support macros for Subtensor"
repository = "https://github.com/RaoFoundation/subtensor"
homepage = "https://bittensor.com/"

[lib]
proc-macro = true

[dependencies]
# Pin exact syn/ahash: freeze_struct hashes the syn AST via ahash, so a floating
# minor bump (eco-tests is outside the workspace lock) retargets every hash and
# breaks SafeFloat et al. Keep these aligned with Cargo.lock / workspace pins.
syn = { version = "=2.0.106", default-features = false, features = [
    "full",
    "visit-mut",
    "visit",
    "clone-impls",
    "extra-traits",
    "parsing",
    "printing",
    "proc-macro",
] }
proc-macro2.workspace = true
quote.workspace = true
ahash = { version = "=0.8.12", default-features = false }

[lints]
workspace = true
