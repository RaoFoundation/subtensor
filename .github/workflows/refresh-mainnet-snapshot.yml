name: Refresh Mainnet Snapshot

# Nightly producer of the state snapshots that keep PR runs of runtime-checks
# off the live RPC endpoints:
#
#   - `mainnet-snapshot`: patched chainspec + genesis-inited local database
#     for the clone-upgrade shards, which otherwise each spend 15-20 min
#     re-scraping identical state from the finney RPC.
#   - `try-runtime-snap-{devnet,testnet,mainnet}`: try-runtime-cli state
#     snapshots consumed by the try-runtime jobs via `on-runtime-upgrade
#     snap`, replacing each job's own 30-40 min `live --uri` scrape.
#
# Security: PR jobs only consume snapshots produced by runs of this workflow
# on the default branch, so a PR can never feed a poisoned snapshot to another
# PR. Day-old network state
# is just as representative for an upgrade test as live state — and a pinned
# snapshot is more reproducible than a fresh scrape. A PR that changes the
# spec-patching logic itself (node/src/clone_spec.rs) can apply the
# `fresh-mainnet-clone` label to bypass the clone snapshot and scrape live.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Trusted branch to refresh"
        required: true
        default: main
        type: choice
        options:
          - main
      try_runtime_only:
        description: "Generate only try-runtime snapshots (targeted recovery)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Serialize every ref globally: diagnostic dispatches must not cancel a
  # running production refresh or consume a second RPC/runner slot alongside it.
  group: refresh-mainnet-snapshot
  cancel-in-progress: false

env:
  TRY_RUNTIME_VERSION: "0.10.1"
  # v0.10.1 exposes parallelism only through the number of URI values.
  SNAPSHOT_RPC_CLIENTS: "4"

jobs:
  snapshot:
    name: scrape mainnet and publish snapshot
    if: >-
      (github.event_name != 'workflow_dispatch' || !inputs.try_runtime_only) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: sccache-writer
      deployment: false
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-setup
        with:
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}

      - name: Add wasm target and rust-src
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src

      - name: Build node-subtensor (release)
        run: cargo build --release -p node-subtensor

      - name: Scrape mainnet and build patched chainspec
        run: ./clones/scripts/clone-mainnet.sh

      - name: Genesis-init the local clone database
        run: |
          # Genesis init from the ~2 GB chainspec takes several minutes before
          # the RPC server comes up. Preserve the node's default consensus mode
          # and only require RPC health before packaging.
          ./clones/scripts/start-local-clone-and-wait.sh node-default
          ./clones/scripts/stop-local-clone.sh

      - name: Package snapshot
        run: |
          tar -czf mainnet-snapshot.tar.gz \
            clones/mainnet-clone-chainspec.json \
            clones/mainnet-clone
          ls -lh mainnet-snapshot.tar.gz

      - name: Upload snapshot artifact
        id: upload-snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-snapshot
          path: mainnet-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 7
          # The tarball is already gzipped.
          compression-level: 0

      - name: Ensure verified AWS CLI for R2 mirror
        env:
          AWS_CLI_VERSION: "2.37.8"
          AWS_CLI_KEY_FINGERPRINT: "FB5DB77FD5C118B80511ADA8A6310ACC4672475C"
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            archive="$RUNNER_TEMP/awscliv2-${AWS_CLI_VERSION}.zip"
            signature="$archive.sig"
            install_dir="$RUNNER_TEMP/aws-cli-${AWS_CLI_VERSION}"
            bin_dir="$RUNNER_TEMP/aws-bin"
            key_file="$RUNNER_TEMP/aws-cli-public-key.asc"
            status_file="$RUNNER_TEMP/aws-cli-gpg-status"
            mkdir -p "$bin_dir" "$RUNNER_TEMP/aws-gnupg"
            chmod 700 "$RUNNER_TEMP/aws-gnupg"
            curl --fail --silent --show-error --location \
              "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip" \
              --output "$archive"
            curl --fail --silent --show-error --location \
              "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip.sig" \
              --output "$signature"
            cat > "$key_file" <<'KEY'
          -----BEGIN PGP PUBLIC KEY BLOCK-----
          mQINBF2Cr7UBEADJZHcgusOJl7ENSyumXh85z0TRV0xJorM2B/JL0kHOyigQluUG
          ZMLhENaG0bYatdrKP+3H91lvK050pXwnO/R7fB/FSTouki4ciIx5OuLlnJZIxSzx
          PqGl0mkxImLNbGWoi6Lto0LYxqHN2iQtzlwTVmq9733zd3XfcXrZ3+LblHAgEt5G
          TfNxEKJ8soPLyWmwDH6HWCnjZ/aIQRBTIQ05uVeEoYxSh6wOai7ss/KveoSNBbYz
          gbdzoqI2Y8cgH2nbfgp3DSasaLZEdCSsIsK1u05CinE7k2qZ7KgKAUIcT/cR/grk
          C6VwsnDU0OUCideXcQ8WeHutqvgZH1JgKDbznoIzeQHJD238GEu+eKhRHcz8/jeG
          94zkcgJOz3KbZGYMiTh277Fvj9zzvZsbMBCedV1BTg3TqgvdX4bdkhf5cH+7NtWO
          lrFj6UwAsGukBTAOxC0l/dnSmZhJ7Z1KmEWilro/gOrjtOxqRQutlIqG22TaqoPG
          fYVN+en3Zwbt97kcgZDwqbuykNt64oZWc4XKCa3mprEGC3IbJTBFqglXmZ7l9ywG
          EEUJYOlb2XrSuPWml39beWdKM8kzr1OjnlOm6+lpTRCBfo0wa9F8YZRhHPAkwKkX
          XDeOGpWRj4ohOx0d2GWkyV5xyN14p2tQOCdOODmz80yUTgRpPVQUtOEhXQARAQAB
          tCFBV1MgQ0xJIFRlYW0gPGF3cy1jbGlAYW1hem9uLmNvbT6JAlQEEwEIAD4CGwMF
