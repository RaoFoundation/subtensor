name: Watch Mainnet Release

# The mainnet upgrade is executed by the triumvirate signing the multisig
# proposal submitted by the release train (release-train.yml). Those
# signatures are the approval: this watcher polls finalized chain state and,
# once an upgrade executes, publishes the release without waiting for anyone.
# The immutable release tag, protected mainnet mirror, and finalized runtime
# hash must all identify the same release-train commit.
#   1. The `mainnet` branch is force-updated to the release commit, so it
#      always contains the code running on mainnet (release-train.yml moves
#      devnet and testnet at deploy time). That push publishes the :mainnet,
#      :v<spec_version>, and :latest node images and the :mainnet and
#      :v<spec_version> localnet images (docker.yml, docker-localnet.yml).
#   2. The release train's pre-release v<spec_version> becomes the final,
#      latest GitHub release, with the verified srtool wasm, digest, and
#      multisig call data attached.
#   3. Stable Python SDK + bittensor-core wheels are published to PyPI.
#   4. The production website/docs are deployed to Vercel.
# Steps 3 and 4 still wait for a `mainnet` environment approval because the
# PyPI trusted publisher and the production Vercel token are bound to that
# environment. They are requested once, by the run that finalizes the
# release, and never block steps 1 and 2. PyPI is the terminal state for
# Python publication; a manual dispatch retries an incomplete upload.
#
# Discord posts use mainnet-release (DISCORD_WEBHOOK_URL). One post runs
# after this workflow finalizes the GitHub release. Another runs after the
# stable PyPI publish. ANNOUNCE_OPENAI_API_KEY on that environment may
# rewrite only the prose section from the committed summary. A rejected or
# failed rewrite posts the human summary. A failed post does not move the
# mainnet mirror back.
# Merging this file does not announce a release that is already final.
# workflow_dispatch input retry_announce posts only when that box is checked
# and the commit status for that event is not already success.
# announce_dry_run only renders previews.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      announce_dry_run:
        description: "Preview Discord messages without finalizing or publishing a release."
        type: boolean
        default: false
      retry_announce:
        description: "Post a live or Python announcement whose commit status is not success. Leave this off for a PyPI retry."
        type: boolean
        default: false

env:
  MAINNET_HTTP: https://entrypoint-finney.opentensor.ai:443

permissions:
  contents: write

jobs:
  check:
    name: Compare chain spec_version with main
    runs-on: [self-hosted, fireactions-turbo-8]
    permissions:
      contents: read
      actions: read # find and download the release-train artifact
    outputs:
      release_needed: ${{ steps.compare.outputs.release_needed }}
      python_needed: ${{ steps.compare.outputs.python_needed }}
      spec_version: ${{ steps.compare.outputs.spec_version }}
      release_tag: ${{ steps.compare.outputs.release_tag }}
      sha: ${{ steps.compare.outputs.sha }}
      artifact_id: ${{ steps.compare.outputs.artifact_id }}
      code_hash: ${{ steps.compare.outputs.code_hash }}
      sdk_version: ${{ steps.compare.outputs.sdk_version }}
      core_version: ${{ steps.compare.outputs.core_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare mainnet with release state
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          local_spec=$(grep -Eo 'spec_version: *[0-9]+' runtime/src/lib.rs | head -n 1 | grep -Eo '[0-9]+')
          : ${local_spec:?could not parse spec_version from runtime/src/lib.rs}

          runtime=$(.github/scripts/mainnet-finalized-runtime.sh)
          finalized_head=$(sed -n 's/^finalized_head=//p' <<<"$runtime")
          chain_spec=$(sed -n 's/^spec_version=//p' <<<"$runtime")
          chain_code_hash=$(sed -n 's/^code_hash=//p' <<<"$runtime")
          [[ "$local_spec" =~ ^[0-9]+$ && "$chain_spec" =~ ^[0-9]+$ ]] \
            || { echo "spec_version values must be integers"; exit 1; }

          echo "main spec_version:     $local_spec"
          echo "on-chain spec_version: $chain_spec"
          echo "finalized block:       $finalized_head"
          echo "runtime code hash:     $chain_code_hash"

          if [ "$chain_spec" -gt "$local_spec" ]; then
            echo "Main does not contain the on-chain runtime yet; refusing to publish."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "python_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "spec_version=$chain_spec" >> "$GITHUB_OUTPUT"
          echo "code_hash=$chain_code_hash" >> "$GITHUB_OUTPUT"

          # Old releases used several tag formats and predate automated stable
          # Python publication. They are terminal historical state, not inputs
          # to the immutable release flow below.
          if [ "$chain_spec" -le 432 ]; then
            release_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 \
              --json tagName,isDraft,isPrerelease \
              | jq -r --arg exact "v${chain_spec}" --arg suffix "-${chain_spec}" \
                '.[] |
                 select(.isDraft == false and .isPrerelease == false) |
                 select(.tagName == $exact or (.tagName | endswith($suffix))) |
                 .tagName' \
              | head -n 1)
            : ${release_tag:?historical runtime v${chain_spec} has no final GitHub release}
            echo "Historical release $release_tag is complete; Python was handled manually."
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "python_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tag="v${chain_spec}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          # The release train reserves this exact lightweight tag before
          # submitting the multisig. Never accept an ambiguously named branch.
          # A runtime deployed outside the train has no tag until
          # publish-deployed-runtime.yml verifies and publishes it.
          if ! tag_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/${release_tag}" 2>/tmp/release-tag.err); then
            if grep -q 'HTTP 404' /tmp/release-tag.err; then
              echo "No ${release_tag} tag: runtime ${chain_spec} was not deployed by the release train."
              echo "Dispatch 'Publish Deployed Runtime' to publish it."
              echo "release_needed=false" >> "$GITHUB_OUTPUT"
              echo "python_needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat /tmp/release-tag.err >&2
            exit 1
          fi
          tag_type=$(jq -er '.object.type' <<<"$tag_json")
          [ "$tag_type" = commit ] \
            || { echo "release tag must be a lightweight Git tag, found $tag_type"; exit 1; }
          release_sha=$(jq -er '.object.sha' <<<"$tag_json")
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "release tag did not resolve to a Git commit"; exit 1; }
          status=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/${release_sha}...main" --jq '.status')
          case "$status" in
            ahead|identical) ;;
            *) echo "tagged commit $release_sha is not an ancestor of main"; exit 1 ;;
          esac
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

          release_needed=true
          release_json=""
          if release_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/${release_tag}" 2>/dev/null); then
            is_draft=$(jq -er \
              '.draft | if type == "boolean" then tostring else error("draft must be boolean") end' \
              <<<"$release_json")
            is_prerelease=$(jq -er \
              '.prerelease | if type == "boolean" then tostring else error("prerelease must be boolean") end' \
              <<<"$release_json")
            if [ "$is_draft" = false ] && [ "$is_prerelease" = false ]; then
              release_needed=false
              target_sha=$(jq -er \
                '.target_commitish | strings | select(test("^[0-9a-f]{40}$"))' \
                <<<"$release_json")
              [ "$target_sha" = "$release_sha" ] \
                || { echo "release target $target_sha does not match tag $release_sha"; exit 1; }
            fi
          fi

          # Once final, the independently protected mainnet branch must point
          # to the tag before any downstream publication is considered.
          if [ "$release_needed" = false ]; then
            mainnet_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/mainnet")
            mainnet_type=$(jq -er '.object.type' <<<"$mainnet_json")
            [ "$mainnet_type" = commit ] \
              || { echo "protected mainnet mirror did not resolve to a commit"; exit 1; }
            mainnet_sha=$(jq -er '.object.sha' <<<"$mainnet_json")
            [ "$release_sha" = "$mainnet_sha" ] \
              || { echo "protected mainnet mirror $mainnet_sha does not match release commit $release_sha"; exit 1; }
          fi

          # Derive the exact stable Python versions from the immutable tag,
          # never from the moving default branch or mutable release metadata.
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/sdk/python/pyproject.toml?ref=${release_sha}" \
            > /tmp/release-sdk-pyproject.toml
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/sdk/bittensor-core-py/pyproject.toml?ref=${release_sha}" \
            > /tmp/release-core-pyproject.toml
          versions=$(python3 .github/scripts/release-python-versions.py \
            /tmp/release-sdk-pyproject.toml /tmp/release-core-pyproject.toml)
          sdk_version=$(jq -er '.sdk' <<<"$versions")
          core_version=$(jq -er '.core' <<<"$versions")
          echo "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"

          if [ "$release_needed" = true ]; then
            # The exact artifact is needed only until its bytes have been
            # verified and attached to the final release.
            artifact_id=$(.github/scripts/resolve-release-artifact.sh \
              "$chain_spec" "$release_sha" "$chain_code_hash")
            : ${artifact_id:?no artifact matches the immutable tag and finalized runtime}
            echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
            python_needed=true
          elif python3 .github/scripts/check-python-release.py \
              --sdk-version "$sdk_version" \
              --core-version "$core_version" \
              --repository "$GITHUB_REPOSITORY"; then
            echo "Stable Python packages are complete on PyPI."
            python_needed=false
          else
            python_status=$?
            if [ "$python_status" -eq 1 ]; then
              echo "Stable Python publication is incomplete; dispatch this workflow to retry it."
              python_needed=true
            else
              echo "PyPI could not provide authoritative release state."
              exit "$python_status"
            fi
          fi

          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"
          echo "python_needed=$python_needed" >> "$GITHUB_OUTPUT"

  release:
    name: Cut GitHub release v${{ needs.check.outputs.spec_version }}
    needs: check
    if: inputs.announce_dry_run != true && needs.check.outputs.release_needed == 'true'
    runs-on: [self-hosted, fireactions-turbo-8]
    # Scheduled runs can overlap, so finalize one at a time. A run that finds
    # the release already final reports finalized=false and leaves the
    # approval-gated jobs below to the run that finalized it.
    concurrency:
      group: watch-mainnet-release-finalize
      cancel-in-progress: false
    # No required reviewers: the executed multisig is the approval. The
    # environment admits only main and holds only MIRROR_DEPLOY_KEY.
    environment: mainnet-release
    permissions:
      contents: write # create the release
      actions: read # download the release-train artifact
    outputs:
      finalized: ${{ steps.promote.outputs.finalized }}
    steps:
      - uses: actions/checkout@v4

      # A queued run can start after a newer runtime won. Fail closed before
      # touching the mirror or release.
      - name: Revalidate finalized runtime
        env:
          EXPECTED_SPEC: ${{ needs.check.outputs.spec_version }}
          EXPECTED_CODE_HASH: ${{ needs.check.outputs.code_hash }}
        run: .github/scripts/mainnet-finalized-runtime.sh

      # The release train uploaded the deterministic srtool build and the
      # multisig call data as the mainnet-upgrade-<spec> workflow artifact
      # (90-day retention). Attach it to the release so the deterministic
      # build evidence outlives the artifact and matches the convention of
      # the pre-train releases (subtensor.wasm + subtensor-digest.json).
      - name: Fetch release-train artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spec="${{ needs.check.outputs.spec_version }}"
          artifact_id="${{ needs.check.outputs.artifact_id }}"
          : ${artifact_id:?check job did not resolve a release artifact}
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${artifact_id}/zip" > artifact.zip
          python3 .github/scripts/verify-release-artifact.py artifact.zip \
            --spec "$spec" \
            --commit "${{ needs.check.outputs.sha }}" \
            --code-hash "${{ needs.check.outputs.code_hash }}"
          mkdir -p wasm
          unzip -o artifact.zip -d wasm
          ls -la wasm

      # The network-branch-mirrors ruleset admits only deploy keys, so the
      # mirror push goes over SSH from a checkout configured with the key.
      - name: Check out released commit with the mirror key
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          ssh-key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          path: release-source

      # Mirror first. If this protected push fails, the proposal stays a
      # pre-release and the next scheduled watcher run can retry safely.
      - name: Point mainnet branch at released commit
        working-directory: release-source
        run: |
          release_sha="${{ needs.check.outputs.sha }}"
          git push --force origin "${release_sha}:refs/heads/mainnet"
          mirrored_sha=$(git ls-remote origin refs/heads/mainnet | awk '{print $1}')
          [ "$mirrored_sha" = "$release_sha" ] \
            || { echo "mainnet mirror is $mirrored_sha, expected $release_sha"; exit 1; }

      - name: Create or promote release with runtime assets
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_VERSION: ${{ needs.check.outputs.spec_version }}
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        run: |
          tag="v${SPEC_VERSION}"
          assets=(
            wasm/subtensor.wasm
            wasm/subtensor-digest.json
            wasm/proxy_proxy_blob.hex
            wasm/pending-release.json
          )
          [ -f wasm/upgrade-manifest.json ] && assets+=(wasm/upgrade-manifest.json)

          tag_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          tag_type=$(jq -er '.object.type' <<<"$tag_json")
          [ "$tag_type" = commit ] \
            || { echo "release tag $tag must be a lightweight Git tag, found $tag_type"; exit 1; }
          tag_sha=$(jq -er '.object.sha' <<<"$tag_json")
          [ "$tag_sha" = "$RELEASE_SHA" ] \
            || { echo "tag $tag points at $tag_sha, expected $RELEASE_SHA"; exit 1; }

          # The release train published the proposal as a pre-release. Assets
          # are re-uploaded from the exact artifact verified against finalized
          # on-chain bytes, then the same release is promoted. A missing
          # pre-release is recoverable. A final release is never rewritten: an
          # overlapping run already finalized it.
          if release_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null); then
            target_sha=$(jq -er \
              '.target_commitish | strings | select(test("^[0-9a-f]{40}$"))' \
              <<<"$release_json")
            [ "$target_sha" = "$RELEASE_SHA" ] \
              || { echo "release target $target_sha does not match $RELEASE_SHA"; exit 1; }
            is_prerelease=$(jq -er \
              '.prerelease | if type == "boolean" then tostring else error("prerelease must be boolean") end' \
              <<<"$release_json")
            if [ "$is_prerelease" = false ]; then
              echo "release $tag is already final"
              echo "finalized=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # Create only a pre-release here. If a later asset upload fails,
            # the next watcher run can safely resume instead of finding an
            # incomplete final release.
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --prerelease \
              --title "Runtime ${SPEC_VERSION} (finalizing)" \
              --notes "Runtime finalized on chain; release assets are being attached."
          fi

          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$RELEASE_SHA" --jq '.body' || true)
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Runtime ${SPEC_VERSION}" \
            ${notes:+--notes "$notes"} \
            --prerelease=false \
            --latest
          echo "finalized=true" >> "$GITHUB_OUTPUT"

  # The notes file is read from the tagged commit. The checker itself is
  # the one on this workflow's checkout, so a release older than the checker
  # still runs. Grandfathered versions pass without a file.
  check-python-notes:
    name: Check Python release notes
    needs: check
    if: inputs.announce_dry_run != true && needs.check.outputs.python_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the release commit
        run: git fetch --no-tags --depth=1 origin ${{ needs.check.outputs.sha }}
      - name: Require notes for the tagged Python versions
        env:
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
          SDK_VERSION: ${{ needs.check.outputs.sdk_version }}
          CORE_VERSION: ${{ needs.check.outputs.core_version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-release-notes.py python \
            --sdk "$SDK_VERSION" \
            --core "$CORE_VERSION" \
            --revision "$RELEASE_SHA"

  # Full platform matrix (manylinux x86_64/aarch64, macOS arm64/x86_64,
  # sdist) at the released commit; the SDK's committed .dev0 is stamped stable.
  # Only the run that finalized the release requests stable Python
  # publication, so an unanswered approval never stacks up across polls. A
  # manual dispatch retries an incomplete PyPI publication.
  build-core:
    name: Build bittensor-core wheels
    needs: [check, release, check-python-notes]
    # A manual retry may intentionally run while the release job is skipped
    # because the GitHub release is already final. `always()` is required for
    # that skipped dependency to remain eligible; release failures never pass
    # the explicit result check below.
    if: >-
      always() &&
      !cancelled() &&
      inputs.announce_dry_run != true &&
      needs.check-python-notes.result == 'success' &&
      needs.check.outputs.python_needed == 'true' &&
      (
        (needs.release.result == 'success' &&
         needs.release.outputs.finalized == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         needs.check.outputs.release_needed == 'false' &&
         needs.release.result == 'skipped')
      )
    uses: ./.github/workflows/build-core-wheels.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  publish-sdk:
    name: Publish Python packages to PyPI
    needs: [check, build-core, check-python-notes]
    if: ${{ !cancelled() && needs.build-core.result == 'success' && needs.check-python-notes.result == 'success' }}
    runs-on: [self-hosted, fireactions-turbo-8]
    # One stable upload at a time, shared with publish-python-stable.yml.
    concurrency:
      group: stable-python-pypi
      cancel-in-progress: false
    # PyPI trusted publishing (OIDC). Publishers for `bittensor` and
    # bittensor-core are registered against this workflow file plus the
    # mainnet environment. publish-python-stable.yml is a second publisher
    # and needs its own PyPI row before it can upload. Completeness accepts
    # an attestation from either workflow file.
    environment: mainnet
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The approval can arrive long after this run read chain state. Never
      # publish packages for a runtime that mainnet has already replaced.
      - name: Revalidate finalized runtime
        env:
          EXPECTED_SPEC: ${{ needs.check.outputs.spec_version }}
          EXPECTED_CODE_HASH: ${{ needs.check.outputs.code_hash }}
        run: .github/scripts/mainnet-finalized-runtime.sh

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download bittensor-core wheels
        uses: actions/download-artifact@v4
        with:
          pattern: core-dist-*
          path: dist
          merge-multiple: true

      - name: Prepare stable SDK distribution
        run: python3 .github/scripts/prepare-sdk-dist.py

      - name: Build SDK wheel and sdist
        working-directory: sdk/python
        run: uv build --out-dir ../../dist

      # Refuse to publish development or release-candidate artifacts from the
      # stable channel. Also require the complete SDK/core platform set.
      - name: Verify stable artifacts
        env:
          EXPECTED_SDK_VERSION: ${{ needs.check.outputs.sdk_version }}
          EXPECTED_CORE_VERSION: ${{ needs.check.outputs.core_version }}
        run: |
          sdk_version=$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/python/pyproject.toml | head -n 1)
          core_version=$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/bittensor-core-py/pyproject.toml | head -n 1)
          : ${sdk_version:?could not parse stable SDK version}
          : ${core_version:?could not parse stable core version}
          [[ "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "SDK version is not stable: $sdk_version"; exit 1; }
          [[ "$core_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "core version is not stable: $core_version"; exit 1; }
          [ "$sdk_version" = "$EXPECTED_SDK_VERSION" ] \
            || { echo "SDK version $sdk_version != expected $EXPECTED_SDK_VERSION"; exit 1; }
          [ "$core_version" = "$EXPECTED_CORE_VERSION" ] \
            || { echo "core version $core_version != expected $EXPECTED_CORE_VERSION"; exit 1; }
          ls -la dist
          test -f "dist/bittensor-${sdk_version}-py3-none-any.whl"
          test -f "dist/bittensor-${sdk_version}.tar.gz"
          compgen -G "dist/bittensor_core-${core_version}-*.whl" >/dev/null
          test -f "dist/bittensor_core-${core_version}.tar.gz"

      # The stable SDK keeps a >= floor, which may name an older published
      # core. Install exactly that floor, and separately upgrade over an older
      # core; both must export every native helper sp_core needs. Releases
      # tagged before the check existed have no script to run.
      - name: Check SDK against its minimum bittensor-core
        run: |
          if [ -f .github/scripts/check-sdk-core-floor.sh ]; then
            .github/scripts/check-sdk-core-floor.sh dist
          else
            echo "release predates check-sdk-core-floor.sh; skipping"
          fi

      # PEP 740 provenance: sign every dist with this job's OIDC identity.
      # Must happen here, not in build-core-wheels.yml — PyPI only accepts
      # attestations whose Sigstore identity matches the trusted publisher
      # doing the upload. uv publish picks up the *.publish.attestation
      # files from dist/ automatically.
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      # --check-url makes a re-run after a partial upload idempotent: files
      # already on the index are skipped instead of failing with a 400
      # duplicate (e.g. the SDK wheel landed but bittensor-core didn't).
      - name: Publish to PyPI
        run: |
          ls -la dist
          uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/ dist/*

      # PyPI is the authoritative terminal state. Its JSON and Integrity APIs
      # can lag an upload briefly, so poll for the complete SDK/core platform
      # set and the trusted-publisher attestation on every file.
      - name: Verify complete publication on PyPI
        env:
          SDK_VERSION: ${{ needs.check.outputs.sdk_version }}
          CORE_VERSION: ${{ needs.check.outputs.core_version }}
        run: |
          for attempt in $(seq 1 12); do
            status=0
            python3 .github/scripts/check-python-release.py \
              --sdk-version "$SDK_VERSION" \
              --core-version "$CORE_VERSION" \
              --repository "$GITHUB_REPOSITORY" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "PyPI state not authoritative yet (attempt $attempt/12); retrying."
              sleep 10
            fi
          done
          echo "PyPI did not expose the complete attested release within two minutes."
          exit 1

  promote-website:
    name: Deploy production website and docs
    needs: [check, release]
    if: needs.release.outputs.finalized == 'true'
    runs-on: [self-hosted, fireactions-turbo-8]
    # The production Vercel credentials live in the mainnet environment.
    # deploy-docs.yml can redeploy production manually if this is missed.
    environment: mainnet
    steps:
      - uses: actions/checkout@v4

      # Never replace the production site with docs for a runtime that
      # mainnet has already replaced.
      - name: Revalidate finalized runtime
        env:
          EXPECTED_SPEC: ${{ needs.check.outputs.spec_version }}
          EXPECTED_CODE_HASH: ${{ needs.check.outputs.code_hash }}
        run: .github/scripts/mainnet-finalized-runtime.sh

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Deploy to Vercel (production)
        # Repo root, not website/: the Vercel root directory is resolved
        # against the cwd (see deploy-docs.yml).
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        run: |
          npx --yes vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel build --prod --token "$VERCEL_TOKEN"
          # --archive=tgz: the prebuilt output exceeds Vercel's 15k-file
          # upload limit (the generated docs tree alone is >30k files).
          npx --yes vercel deploy --prebuilt --prod --archive=tgz --token "$VERCEL_TOKEN"

  announce-runtime:
    name: Announce live runtime upgrade
    needs: [check, release]
    if: >-
      always() &&
      !cancelled() &&
      inputs.announce_dry_run != true &&
      (
        needs.release.outputs.finalized == 'true' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.retry_announce == true &&
          needs.check.outputs.release_needed == 'false' &&
          needs.check.outputs.sha != ''
        )
      )
    runs-on: ubuntu-latest
    environment: mainnet-release
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Require the main branch
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "Discord announcements only run from main"
            exit 1
          }
      - uses: actions/checkout@v4
      - name: Fetch the released commit
        run: git fetch --no-tags --depth=1 origin ${{ needs.check.outputs.sha }}
      - name: Read the wasm digest
        id: facts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC: ${{ needs.check.outputs.spec_version }}
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wasm"
          gh release download "v${SPEC}" --repo "$GITHUB_REPOSITORY" \
            --pattern subtensor-digest.json --dir "$RUNNER_TEMP/wasm"
          sha256=$(jq -er '.sha256' "$RUNNER_TEMP/wasm/subtensor-digest.json" | tr '[:upper:]' '[:lower:]')
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "wasm sha256 is not 64 hex characters"; exit 1; }
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          if git cat-file -e "${RELEASE_SHA}:.github/release-notes/runtime/${SPEC}.json"; then
            echo "notes=.github/release-notes/runtime/${SPEC}.json" >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi
      - name: Post to Discord
        uses: ./.github/actions/announce-release
        with:
          kind: runtime-live
          spec: ${{ needs.check.outputs.spec_version }}
          sdk-version: ${{ needs.check.outputs.sdk_version }}
          core-version: ${{ needs.check.outputs.core_version }}
          sha: ${{ needs.check.outputs.sha }}
          sha256: ${{ steps.facts.outputs.sha256 }}
          revision: ${{ needs.check.outputs.sha }}
          notes-file: ${{ steps.facts.outputs.notes }}
          allow-missing-notes: "true"
          dry-run: "false"
          status-context: announce/runtime-live
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          openai-api-key: ${{ secrets.ANNOUNCE_OPENAI_API_KEY }}

  announce-python:
    name: Announce stable Python release
    needs: [check, publish-sdk]
    if: >-
      always() &&
      !cancelled() &&
      inputs.announce_dry_run != true &&
      (
        needs.publish-sdk.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.retry_announce == true &&
          needs.check.outputs.python_needed == 'false' &&
          needs.check.outputs.sdk_version != ''
        )
      )
    runs-on: ubuntu-latest
    environment: mainnet-release
    timeout-minutes: 10
    concurrency:
      group: stable-python-pypi
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Require the main branch
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "Discord announcements only run from main"
            exit 1
          }
      - uses: actions/checkout@v4
      - name: Fetch the released commit
        run: git fetch --no-tags --depth=1 origin ${{ needs.check.outputs.sha }}
      - name: Find Python release notes
        id: facts
        env:
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
          SDK_VERSION: ${{ needs.check.outputs.sdk_version }}
        run: |
          set -euo pipefail
          if git cat-file -e "${RELEASE_SHA}:.github/release-notes/python/${SDK_VERSION}.json"; then
            echo "notes=.github/release-notes/python/${SDK_VERSION}.json" >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi
      - name: Post to Discord
        uses: ./.github/actions/announce-release
        with:
          kind: python-stable
          sdk-version: ${{ needs.check.outputs.sdk_version }}
          core-version: ${{ needs.check.outputs.core_version }}
          sha: ${{ needs.check.outputs.sha }}
          revision: ${{ needs.check.outputs.sha }}
          notes-file: ${{ steps.facts.outputs.notes }}
          allow-missing-notes: "true"
          dry-run: "false"
          status-context: announce/python-stable
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          openai-api-key: ${{ secrets.ANNOUNCE_OPENAI_API_KEY }}

  preview-announcements:
    name: Preview release announcements
    needs: check
    if: github.ref == 'refs/heads/main' && inputs.announce_dry_run == true && needs.check.outputs.sha != ''
    runs-on: ubuntu-latest
    environment: mainnet-release
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the release facts
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC: ${{ needs.check.outputs.spec_version }}
          SHA: ${{ needs.check.outputs.sha }}
          SDK: ${{ needs.check.outputs.sdk_version }}
          ARTIFACT_ID: ${{ needs.check.outputs.artifact_id }}
          CODE_HASH: ${{ needs.check.outputs.code_hash }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SHA"
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
            sha256=$(python3 .github/scripts/verify-release-artifact.py artifact.zip \
              --spec "$SPEC" --commit "$SHA" --code-hash "$CODE_HASH" | jq -er '.wasm_sha256')
          else
            gh release download "v${SPEC}" --repo "$GITHUB_REPOSITORY" \
              --pattern subtensor-digest.json --dir "$RUNNER_TEMP"
            sha256=$(jq -er '.sha256' "$RUNNER_TEMP/subtensor-digest.json" | tr '[:upper:]' '[:lower:]')
          fi
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "wasm sha256 is not 64 hex characters"; exit 1; }
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          runtime_notes=".github/release-notes/runtime/${SPEC}.json"
          python_notes=".github/release-notes/python/${SDK}.json"
          if git cat-file -e "${SHA}:${runtime_notes}"; then
            echo "runtime_notes=$runtime_notes" >> "$GITHUB_OUTPUT"
          fi
          if git cat-file -e "${SHA}:${python_notes}"; then
            echo "python_notes=$python_notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview the runtime announcement
        uses: ./.github/actions/announce-release
        with:
          kind: runtime-live
          spec: ${{ needs.check.outputs.spec_version }}
          sdk-version: ${{ needs.check.outputs.sdk_version }}
          core-version: ${{ needs.check.outputs.core_version }}
          sha: ${{ needs.check.outputs.sha }}
          sha256: ${{ steps.facts.outputs.sha256 }}
          revision: ${{ needs.check.outputs.sha }}
          notes-file: ${{ steps.facts.outputs.runtime_notes }}
          allow-missing-notes: "true"
          dry-run: "true"
          openai-api-key: ${{ secrets.ANNOUNCE_OPENAI_API_KEY }}

      - name: Preview the Python announcement
        uses: ./.github/actions/announce-release
        with:
          kind: python-stable
          sdk-version: ${{ needs.check.outputs.sdk_version }}
          core-version: ${{ needs.check.outputs.core_version }}
          sha: ${{ needs.check.outputs.sha }}
          revision: ${{ needs.check.outputs.sha }}
          notes-file: ${{ steps.facts.outputs.python_notes }}
          allow-missing-notes: "true"
          dry-run: "true"
          openai-api-key: ${{ secrets.ANNOUNCE_OPENAI_API_KEY }}
