# The workflow definition and privileged tooling must come from trusted code.
name: Apply-Benchmark-Patch

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.label.name == 'apply-benchmark-patch' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # PR tests live in the read-only Validate-Benchmarks workflow. Never execute
    # PR code or restore its caches on this fresh privileged runner.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    concurrency:
      group: apply-benchmark-patch-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out tooling from the trusted workflow commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts

      - name: Require trusted apply tooling
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          if [[ ! -f trusted/scripts/apply_benchmark_patch.py ]]; then
            echo "The benchmark apply helper must be deployed with the trusted workflow before using this label." >&2
            exit 1
          fi

      - name: Check out exact PR commit as patch data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false

      - name: Verify source commit and prepare output directory
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$PR_HEAD_SHA"
          git check-ref-format "refs/heads/$PR_HEAD_BRANCH"
          echo "BENCH_PATCH_DIR=$RUNNER_TEMP/benchmark-patch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Download and stage validated weights with trusted tooling
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Isolated mode excludes PR paths, PYTHONPATH and user site packages.
          python3 -I scripts/apply_benchmark_patch.py \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$PR_HEAD_BRANCH" \
            --sha "$PR_HEAD_SHA" \
            --output-dir "$BENCH_PATCH_DIR" \
            --apply-to "$GITHUB_WORKSPACE/source"
          {
            echo '### Selected benchmark results'
            echo '```text'
            cat "$BENCH_PATCH_DIR/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and publish only to the unchanged PR branch
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.state, .head.repo.full_name, .head.ref, .head.sha] | @tsv')
          expected=$(printf 'open\t%s\t%s\t%s' "$GITHUB_REPOSITORY" "$PR_HEAD_BRANCH" "$PR_HEAD_SHA")
          if [[ "$current" != "$expected" ]]; then
            echo "The PR changed after labeling. Benchmark its current commit and reapply the label." >&2
            exit 1
          fi

          source="$GITHUB_WORKSPACE/source"
          if git -C "$source" diff --cached --quiet; then
            echo "The latest benchmark run found no weight drift; nothing to apply."
            published_sha="$PR_HEAD_SHA"
          else
            git -C "$source" -c core.hooksPath=/dev/null -c core.fsmonitor=false \
              -c commit.gpgsign=false \
              -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -m "auto-update benchmark weights"
            # The explicit lease rejects any ref change, including a rewind.
            # Requiring this sole parent makes our update a fast-forward only.
            test "$(git -C "$source" show -s --format=%P HEAD)" = "$PR_HEAD_SHA"
            git -C "$source" -c core.hooksPath=/dev/null \
              -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push --force-with-lease="refs/heads/$PR_HEAD_BRANCH:$PR_HEAD_SHA" \
              "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$PR_HEAD_BRANCH"
            published_sha=$(git -C "$source" rev-parse HEAD)
          fi

          # Leave the label in place if someone updates the PR after our write.
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.state, .head.repo.full_name, .head.ref, .head.sha] | @tsv')
          expected=$(printf 'open\t%s\t%s\t%s' "$GITHUB_REPOSITORY" "$PR_HEAD_BRANCH" "$published_sha")
          if [[ "$current" == "$expected" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --remove-label "apply-benchmark-patch"
          fi
