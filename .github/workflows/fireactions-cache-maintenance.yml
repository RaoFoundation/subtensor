name: Fireactions host cache maintenance

on:
  workflow_run:
    workflows:
      - "Refresh Mainnet Snapshot"
      - "Warm R2 sccache"
    types: [completed]
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fireactions-host-cache-maintenance
  cancel-in-progress: false

jobs:
  warm-snapshot-artifacts:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.name == 'Refresh Mainnet Snapshot' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, fireactions-benchmarking]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - name: Resolve completed producer run
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-mainnet-snapshot.yml/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "completed" and (.event == "schedule" or .event == "workflow_dispatch"))][0].id')
          fi
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Warm available trusted snapshot artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          PRODUCER_RUN_ID: ${{ steps.producer.outputs.run-id }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/artifacts.json"
          for attempt in 1 2 3 4 5; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100" > "$payload"
            count=$(jq '[.artifacts[] | select(.name == "mainnet-snapshot" or (.name | startswith("try-runtime-snap-v0.10.1-")))] | length' "$payload")
            [[ "$count" -gt 0 ]] && break
            sleep 60
          done
          [[ "$count" -gt 0 ]]
          jq -r '.artifacts[] | select(.expired == false) | select(.name == "mainnet-snapshot" or (.name | startswith("try-runtime-snap-v0.10.1-"))) | [.id,.name,.digest,.size_in_bytes,.created_at] | @tsv' "$payload" |
          while IFS=$'\t' read -r id name digest size created_at; do
            output="$RUNNER_TEMP/output-$id"
            : > "$output"
            .github/scripts/download-artifact.sh \
              "$id" "$name" "$digest" "$size" "$RUNNER_TEMP/warm-$id" "$output"
            source=$(sed -n 's/^source=//p' "$output")
            seconds=$(sed -n 's/^seconds=//p' "$output")
            echo "- $name: artifact $id via $source in ${seconds}s" >> "$GITHUB_STEP_SUMMARY"
            age_seconds=$(( $(date -u +%s) - $(date -u -d "$created_at" +%s) ))
            if (( age_seconds > 36 * 3600 )); then
              echo "::error::$name is older than the 36-hour freshness expectation"
              exit 1
            fi
          done

  refresh-local-sccache:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Warm R2 sccache' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, fireactions-benchmarking]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - name: Configure host-local sccache reader
        uses: ./.github/actions/rust-setup
        with:
          cache-key: fireactions-host-cache-maintenance
          # The benchmark found this tier slower than direct R2, so only the
          # canary maintenance path opts in while we retain it for evaluation.
          sccache-local-tier: auto

      - name: Refresh representative compiler objects
        env:
          SKIP_WASM_BUILD: 1
        run: |
          set -euo pipefail
          [[ "${SCCACHE_LOCAL_TIER:-false}" == true ]]
          sccache --zero-stats
          cargo check --workspace --locked
          sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
