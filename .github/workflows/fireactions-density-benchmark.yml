name: Fireactions Bittensor artifact scaling benchmark

on:
  push:
    branches:
      - codex/fireactions-runner-density-experiment

permissions:
  contents: read

concurrency:
  group: fireactions-density-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.profile.name }} / bittensor-${{ matrix.runtime }} / cold-local
    if: github.ref_name == 'codex/fireactions-runner-density-experiment'
    runs-on: [self-hosted, "${{ matrix.profile.label }}"]
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: full
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: 2x16-control
            label: fireactions-density-16c
          - name: 4x8
            label: fireactions-density-8c
          - name: 8x4
            label: fireactions-density-4c
          - name: 4x16-oversubscribed
            label: fireactions-density-16c-over
        runtime:
          - fast-runtime
          - non-fast-runtime

    steps:
      - name: Check out benchmark source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Reproduce the production Bittensor E2E artifact build path instead of
      # substituting a simpler cargo build. This intentionally includes the
      # workflow's pinned Rust toolchain and cross-compiler setup.
      - name: Install exact Bittensor build environment
        shell: bash
        run: |
          chmod +x ./scripts/install_build_env.sh
          ./scripts/install_build_env.sh
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends time

      - name: Shared R2 compiler cache bootstrap
        uses: ./.github/actions/sccache-setup

      - name: Patch limits for local run
        shell: bash
        run: |
          chmod +x ./scripts/localnet_patch.sh
          ./scripts/localnet_patch.sh

      - name: Record guest allocation
        shell: bash
        run: |
          {
            echo "### Runner allocation"
            echo
            echo "- Profile: \`${{ matrix.profile.name }}\`"
            echo "- Runtime: \`${{ matrix.runtime }}\`"
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- Logical CPUs visible: \`$(nproc)\`"
            echo "- Memory visible: \`$(awk '/MemTotal/ { printf \"%.1f GiB\", $2 / 1024 / 1024 }' /proc/meminfo)\`"
            echo "- Cache mode: \`cold-local\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build exact Bittensor artifacts
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail

          # Disable the MMDS-provided R2 wrapper for a clean CPU-scaling
          # comparison. Each profile runs the same two builds concurrently.
          unset RUSTC_WRAPPER
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu

          if [[ "$RUNTIME" == fast-runtime ]]; then
            command='./scripts/localnet.sh --build-only'
          else
            command='./scripts/localnet.sh False --build-only'
          fi

          started_at=$(date +%s)
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/workload-time.txt" bash -lc "$command"
          status=$?
          set -e
          finished_at=$(date +%s)

          {
            echo
            echo "### Exact Bittensor build result"
            echo
            echo "- Command: \`$command\`"
            echo "- Elapsed wall time: \`$((finished_at - started_at))s\`"
            echo "- Exit status: \`$status\`"
            echo
            echo '<details><summary>/usr/bin/time -v</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/workload-time.txt"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
