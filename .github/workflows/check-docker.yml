name: Docker Build Check

# Path-filtered: `docker build` is not a required merge check, so a
# workflow-level `paths:` filter is safe. If it is ever made required, this
# filter MUST move to job-level `if:` gating (a required check whose workflow
# never triggers is stuck "Expected" and blocks the merge).
on:
  pull_request:
    paths:
      # Anything the Dockerfile's cargo build consumes.
      - "common/**"
      - "node/**"
      - "pallets/**"
      - "precompiles/**"
      - "primitives/**"
      - "runtime/**"
      - "sdk/bittensor-core/**"
      - "sdk/bittensor-core-py/**"
      - "sdk/bittensor-core-wasm/**"
      - "support/**"
      - "chain-extensions/**"
      - "src/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - "Dockerfile.prebuilt"
      - "Cross.toml"
      - ".github/actions/build-production-binary/**"
      - ".github/actions/rust-setup/**"
      - ".github/workflows/check-docker.yml"

concurrency:
  group: check-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  binary:
    name: production binary (${{ matrix.platform.arch }})
    needs: trusted-pr
    runs-on: [self-hosted, fireactions-turbo-16]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-production-binary
        with:
          arch: ${{ matrix.platform.arch }}
          target: ${{ matrix.platform.target }}
          cache-key: docker-production-${{ matrix.platform.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: production-node-${{ matrix.platform.arch }}
          path: build/ci_target/${{ matrix.platform.arch }}/node-subtensor
          if-no-files-found: error

  image:
    name: docker image (${{ matrix.arch }}, no push)
    needs: [trusted-pr, binary]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v5
        with:
          name: production-node-${{ matrix.arch }}
          path: build/ci_target/${{ matrix.arch }}

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          platforms: linux/${{ matrix.arch }}
          tags: subtensor-ci:${{ matrix.arch }}
          load: true
          push: false

      - name: Verify image architecture and executable
        shell: bash
        run: |
          set -euo pipefail
          actual=$(docker image inspect subtensor-ci:${{ matrix.arch }} --format '{{.Architecture}}')
          test "$actual" = "${{ matrix.arch }}"
          docker run --rm --platform linux/${{ matrix.arch }} \
            subtensor-ci:${{ matrix.arch }} --version
