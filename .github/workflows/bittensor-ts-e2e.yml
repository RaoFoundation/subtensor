name: Bittensor TS Checks

on:
  pull_request:

concurrency:
  group: bittensor-ts-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Self-hosted runners may have RUSTC_WRAPPER=sccache available for Rust
  # builds. If the GitHub Actions cache backend has a transient DNS/storage
  # failure, compile locally instead of failing before rustc starts.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

permissions:
  contents: read

jobs:
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  # typescript-formatting is a required merge check, so the workflow must
  # always trigger and that job always runs (it is cheap). The expensive node
  # builds and Moonwall suites skip themselves when the PR touches nothing
  # they exercise; `skipped` satisfies branch protection.
  changes:
    name: Detect Bittensor TS check changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # Plain gh-api file listing instead of a marketplace action: the org's
      # Actions allowlist rejects unlisted third-party actions (startup_failure).
      - name: Filter changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          pattern='^sdk/(bittensor-ts|bittensor-core|bittensor-core-wasm)/|^(ts-tests|common|node|pallets|precompiles|primitives|runtime|support|chain-extensions|src|vendor)/|^(Cargo\.(toml|lock)|build\.rs|rust-toolchain\.toml)$|^\.github/(workflows/bittensor-ts-e2e\.yml|actions/sccache-setup/|scripts/sccache-configure\.sh$)'
          if grep -qE "$pattern" <<< "$files"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "no Bittensor TS check-relevant paths changed"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  typescript-formatting:
    name: TypeScript formatting and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ts-tests/.nvmrc

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang curl git make libssl-dev llvm libudev-dev protobuf-compiler pkg-config

      - name: Install bittensor-ts dependencies
        run: npm --prefix sdk/bittensor-ts ci

      - name: Type-check bittensor-ts
        run: npm --prefix sdk/bittensor-ts run typecheck

      - name: Install e2e dependencies
        working-directory: ts-tests
        run: pnpm install --frozen-lockfile

      - name: Formatting check
        run: |
          cd ts-tests
          pnpm run fmt

  build-bittensor-ts:
    name: Build and test bittensor-ts package
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: sccache-writer
      deployment: false
    needs: [trusted-pr, typescript-formatting, changes]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 60
    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang curl git make libssl-dev llvm libudev-dev protobuf-compiler pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Shared R2 compiler cache
        uses: ./.github/actions/sccache-setup
        with:
          credential-mode: auto
          writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}

      - name: Cache Cargo registry and git data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: bittensor-ts
          cache-on-failure: true
          cache-targets: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ts-tests/.nvmrc

      - name: Install browser for bittensor-ts browser tests
        run: |
          set -euo pipefail

          resolve_chrome() {
            for candidate in "${CHROME_BIN:-}" "${CHROMIUM_BIN:-}" chromium chromium-browser google-chrome google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser /snap/bin/chromium /opt/google/chrome/chrome; do
              [ -n "$candidate" ] || continue
              resolved=""
              if [ -x "$candidate" ]; then
                resolved="$candidate"
              elif resolved="$(command -v "$candidate" 2>/dev/null)"; then
                :
              fi
              if [ -n "$resolved" ] && "$resolved" --version >/dev/null 2>&1; then
                printf '%s\n' "$resolved"
                return 0
              fi
            done
            return 1
          }

          install_google_chrome() {
            arch="$(dpkg --print-architecture)"
            if [ "$arch" != "amd64" ]; then
              echo "::error::No supported non-snap browser installer is configured for architecture $arch"
              return 1
            fi
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
              -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
              ca-certificates curl gnupg
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
              | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/google-linux-signing-keyring.gpg
            sudo chmod 0644 /etc/apt/keyrings/google-linux-signing-keyring.gpg
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-linux-signing-keyring.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
              -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
              google-chrome-stable
          }

          if ! chrome_bin="$(resolve_chrome)"; then
            if ! install_google_chrome; then
              echo "::error::Unable to install a runnable browser for bittensor-ts browser tests"
              exit 1
            fi
            if ! chrome_bin="$(resolve_chrome)"; then
              echo "::error::Browser install completed but no runnable executable was found"
              exit 1
            fi
          fi

          "$chrome_bin" --version
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"

      - name: Install wasm-pack
        run: |
          cargo install --locked --version 0.13.1 --root "$RUNNER_TEMP/wasm-pack" --force wasm-pack
          echo "$RUNNER_TEMP/wasm-pack/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/wasm-pack/bin/wasm-pack" --version

      - name: Build and test bittensor-ts
        run: |
          npm --prefix sdk/bittensor-ts ci
          npm --prefix sdk/bittensor-ts run check

      - name: Upload bittensor-ts build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bittensor-ts
          path: |
            sdk/bittensor-ts/dist
            sdk/bittensor-ts/native.cjs
            sdk/bittensor-ts/native.generated.d.ts
            sdk/bittensor-ts/*.node
          if-no-files-found: error

  test-bittensor-ts-node-min:
    name: bittensor-ts package test (Node 22)
    runs-on: ubuntu-latest
    needs: [trusted-pr, typescript-formatting, changes, build-bittensor-ts]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 15
    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install bittensor-ts dependencies
        run: npm --prefix sdk/bittensor-ts ci

      - name: Download bittensor-ts build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bittensor-ts
          path: sdk/bittensor-ts

      - name: Test package on minimum supported Node
        run: |
          node --version
          node -e "if (typeof globalThis.WebSocket !== 'function') throw new Error('globalThis.WebSocket is required by the default WSS client path')"
          node --test sdk/bittensor-ts/test/*.test.cjs

  # Build the node binary in both variants and share as artifacts for Moonwall.
  build:
    name: Build node-subtensor (${{ matrix.variant }})
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: sccache-writer
      deployment: false
    needs: [trusted-pr, typescript-formatting, changes]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - variant: release
            flags: "--features metadata-hash"
          - variant: fast
            flags: "--features fast-runtime,metadata-hash"
    env:
      RUST_BACKTRACE: full
    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang curl git make libssl-dev llvm libudev-dev protobuf-compiler pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Shared R2 compiler cache
        uses: ./.github/actions/sccache-setup
        with:
          credential-mode: auto
          writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}

      - name: Cache Cargo registry and git data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: e2e-${{ matrix.variant }}
          cache-on-failure: true
          cache-targets: false

      - name: Build node-subtensor (${{ matrix.variant }})
        run: cargo build --profile release ${{ matrix.flags }} -p node-subtensor

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-subtensor-${{ matrix.variant }}
          path: target/release/node-subtensor
          if-no-files-found: error

  run-e2e-tests:
    needs: [trusted-pr, build, build-bittensor-ts]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - test: dev
            binary: release
          - test: zombienet_shield
            binary: release
          - test: zombienet_staking
            binary: fast
          - test: zombienet_coldkey_swap
            binary: fast
          - test: zombienet_subnets
            binary: fast
          - test: zombienet_evm
            binary: fast

    name: "bittensor-ts-e2e-${{ matrix.test }}"

    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-subtensor-${{ matrix.binary }}
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/node-subtensor

      - name: Download bittensor-ts build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bittensor-ts
          path: sdk/bittensor-ts

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ts-tests/.nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install e2e dependencies
        working-directory: ts-tests
        run: pnpm install --frozen-lockfile

      - name: Install lsof (dev foundation RPC port discovery)
        if: matrix.test == 'dev'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends lsof

      - name: Run tests
        run: |
          cd ts-tests
          pnpm moonwall test ${{ matrix.test }}
