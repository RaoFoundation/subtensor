# .github/workflows/run-benchmarks.yml
name: Validate-Benchmarks

# Path-filtered: validate-benchmarks is not a required merge check, so a
# workflow-level `paths:` filter is safe. If it is ever made required, this
# filter MUST move to job-level `if:` gating (a required check whose workflow
# never triggers is stuck "Expected" and blocks the merge).
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      # Anything that changes what the node/runtime compiles to (and thus
      # measured extrinsic weights).
      - "common/**"
      - "node/**"
      - "pallets/**"
      - "precompiles/**"
      - "primitives/**"
      - "runtime/**"
      - "sdk/bittensor-core/**"
      - "sdk/bittensor-core-py/**"
      - "support/**"
      - "chain-extensions/**"
      - "src/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      # Workflow definition and helper scripts used by this run.
      - ".github/workflows/run-benchmarks.yml"
      - ".github/scripts/**"
  workflow_dispatch:

# This workflow only builds the node and validates benchmark weights; it never
# pushes commits or edits the PR. The apply-benchmark-patch workflow is what
# writes results back, so the validate job runs with a read-only token to keep
# the persistent `Benchmarking` runner from holding a write-capable token while
# it compiles PR-controlled code (arbitrary build.rs).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: run-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  validate-benchmarks:
    needs: trusted-pr
    runs-on: Benchmarking

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          # Fall back to the current repo/ref so workflow_dispatch runs work too.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" gh

      - name: Check for skip-validate-benchmarks label
        id: skip-label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/check-skip-label.sh ${{ github.event.pull_request.number }}

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang curl libssl-dev llvm libudev-dev protobuf-compiler pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ hashFiles('**/Cargo.lock') }}
          cache-on-failure: true

      - name: Build node with benchmarks + weight tools
        if: steps.skip-label.outputs.skip != 'true'
        run: |
          cargo build --profile production -p node-subtensor --features runtime-benchmarks
          cargo build --profile production -p subtensor-weight-tools --bin weight-compare

      - name: Run & validate benchmarks
        if: steps.skip-label.outputs.skip != 'true'
        timeout-minutes: 180
        run: |
          mkdir -p .bench_patch
          chmod +x scripts/benchmark_action.sh
          scripts/benchmark_action.sh

      - name: Archive bench patch
        if: always()
        run: |
          if [ -d ".bench_patch" ]; then
            tar -czf bench-patch.tgz .bench_patch
          fi

      - name: Upload patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-patch
          path: bench-patch.tgz
          if-no-files-found: warn
