# .github/workflows/run-benchmarks.yml
name: Validate-Benchmarks

# The gate lives in a cheap `decide` job on a free GitHub runner so the one
# persistent Benchmarking machine is only ever occupied by runs that matter:
#   - PRs touching benchmark-relevant paths run automatically (no "someone
#     forgot the label and weights drifted into main" hole);
#   - PRs whose diff stays inside pallets/ benchmark only the changed pallets
#     (PALLET_DIRS); anything wider runs the full suite;
#   - `run-benchmarks` label forces a full run, `skip-validate-benchmarks`
#     forces a skip;
#   - the nightly schedule reruns the full suite against the default branch as
#     the drift backstop (a dependency bump that changes codegen surfaces
#     within a day; on failure, apply the bench-patch artifact via the
#     apply-benchmark-patch label on a fix PR).
# validate-benchmarks is not a required merge check today. If that changes,
# this decide-job shape keeps working (the workflow always triggers and the
# skipped job satisfies branch protection), unlike a `paths:` trigger filter.

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
  schedule:
    - cron: "0 3 * * *" # nightly full-suite drift check on the default branch
  workflow_dispatch:

# This workflow only builds the node and validates benchmark weights; it never
# pushes commits or edits the PR. The apply-benchmark-patch workflow is what
# writes results back, so the validate job runs with a read-only token to keep
# the persistent `Benchmarking` runner from holding a write-capable token while
# it compiles PR-controlled code (arbitrary build.rs).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: run-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  decide:
    name: decide whether to benchmark
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      pallet_dirs: ${{ steps.gate.outputs.pallet_dirs }}
    steps:
      - name: Gate on event, labels, and changed paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          run=""
          dirs=""
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "$GITHUB_EVENT_NAME event: full run"
            run=true
          else
            labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
            if grep -qx 'skip-validate-benchmarks' <<< "$labels"; then
              echo "skip-validate-benchmarks label present: skipping"
              run=false
            elif grep -qx 'run-benchmarks' <<< "$labels"; then
              echo "run-benchmarks label present: forcing full run"
              run=true
            else
              files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                --paginate --jq '.[].filename')
              relevant=$(grep -E '^(pallets|runtime|node|primitives|precompiles|common|support|chain-extensions|src|vendor)/|^Cargo\.(toml|lock)$|^build\.rs$|^rust-toolchain\.toml$|^\.maintain/|^scripts/(benchmark_action|discover_pallets)\.sh$|^\.github/workflows/run-benchmarks\.yml$' \
                <<< "$files" || true)
              if [[ -z "$relevant" ]]; then
                echo "no benchmark-relevant paths changed: skipping"
                run=false
              else
                run=true
                nonpallet=$(grep -vE '^pallets/' <<< "$relevant" || true)
                if [[ -z "$nonpallet" ]]; then
                  # Weights can also shift via runtime/ or dependency changes,
                  # but those hit the non-pallet branch; pallet-only diffs are
                  # safe to benchmark selectively. Nightly covers the rest.
                  dirs=$(grep -oE '^pallets/[^/]+' <<< "$relevant" | sort -u \
                    | sed 's|^pallets/||' | tr '\n' ' ')
                  echo "pallet-only change: restricting to: $dirs"
                else
                  echo "change reaches outside pallets/: full run"
                fi
              fi
            fi
          fi
          {
            echo "run=$run"
            echo "pallet_dirs=$dirs"
          } >> "$GITHUB_OUTPUT"

  validate-benchmarks:
    needs: [trusted-pr, decide]
    if: needs.decide.outputs.run == 'true'
    runs-on: Benchmarking

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          # Fall back to the current repo/ref so workflow_dispatch and
          # scheduled runs work too.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang curl libssl-dev llvm libudev-dev protobuf-compiler pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ hashFiles('**/Cargo.lock') }}
          cache-on-failure: true

      - name: Build node with benchmarks + weight tools
        run: |
          cargo build --profile production -p node-subtensor --features runtime-benchmarks
          cargo build --profile production -p subtensor-weight-tools --bin weight-compare

      - name: Run & validate benchmarks
        timeout-minutes: 180
        env:
          PALLET_DIRS: ${{ needs.decide.outputs.pallet_dirs }}
        run: |
          mkdir -p .bench_patch
          chmod +x scripts/benchmark_action.sh
          scripts/benchmark_action.sh

      - name: Archive bench patch
        if: always()
        run: |
          if [ -d ".bench_patch" ]; then
            tar -czf bench-patch.tgz .bench_patch
          fi

      - name: Upload patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-patch
          path: bench-patch.tgz
          if-no-files-found: warn
