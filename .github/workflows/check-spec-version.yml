name: Spec Version Check

# Runtime-affecting PRs must carry a spec_version newer than what mainnet is
# running — otherwise the release train will build the merge and then no-op
# at every deploy guard. Label a PR `no-spec-version-bump` when the change
# deliberately ships without a runtime release.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened]
    paths:
      - "runtime/**"
      - "pallets/**"
      - "node/**"
      - "primitives/**"
      - "precompiles/**"
      - "common/**"
      - "Cargo.lock"

concurrency:
  group: check-spec-version-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MAINNET_WS: wss://entrypoint-finney.opentensor.ai:443

jobs:
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  check-spec-version:
    name: spec_version newer than mainnet
    needs: trusted-pr
    runs-on: [self-hosted, fireactions-tryruntime-finney]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-spec-version-bump') }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: spec-version

      - name: Install substrate-spec-version
        run: cargo install substrate-spec-version

      - name: Compare against mainnet
        run: |
          chain_spec=$(PATH=$PATH:$HOME/.cargo/.bin substrate-spec-version ${{ env.MAINNET_WS }} | tr -d '\n')
          : ${chain_spec:?could not fetch mainnet spec_version}
          local_spec=$(cargo run -p subtensor-tools --bin spec-version | tr -d '\n')
          echo "mainnet spec_version: $chain_spec"
          echo "local spec_version:   $local_spec"
          if [ "$local_spec" -le "$chain_spec" ]; then
            echo "spec_version must be bumped above mainnet's, or label the PR 'no-spec-version-bump'."
            exit 1
          fi
