name: Update Chainspecs

# Manual: rebuild all chainspecs and commit any changes back to the branch
# the workflow was dispatched on.

on:
  workflow_dispatch:

concurrency:
  group: update-chainspec-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  update-chainspecs:
    runs-on: [self-hosted, fireactions-heavy]
    permissions:
      contents: write
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: chainspecs

      - name: Build chainspecs
        run: ./scripts/build_all_chainspecs.sh

      - name: Commit any updated chainspecs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update chainspecs
