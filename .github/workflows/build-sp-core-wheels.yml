name: Build py-sp-core wheels

# Reusable wheel matrix for the py-sp-core PyPI package. The crate builds as
# an abi3-py310 extension, so one wheel per platform covers every supported
# CPython; the matrix below matches the platform coverage the ecosystem's
# incumbent packages (bittensor-wallet, bittensor-drand) ship:
#
#   manylinux x86_64 + aarch64 (self-hosted, aarch64 cross-built in the
#   maturin-action docker image), macOS arm64 + x86_64 (GitHub-hosted
#   macos-14; x86_64 is cross-compiled — Xcode carries both SDKs), plus an
#   sdist fallback for everything else (requires a Rust toolchain to build).
#
# Callers: release-train.yml (rc channel) and watch-mainnet-release.yml
# (stable). Each job uploads its output as an sp-core-dist-* artifact; the
# caller's publish job downloads them next to the SDK wheel and pushes
# everything in one `uv publish`.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (empty = the caller's commit)
        type: string
        default: ""
      version:
        description: >-
          Version to stamp into py-sp-core/pyproject.toml before building
          (empty = build the committed version)
        type: string
        default: ""

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: [self-hosted, fireactions-heavy]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Stamp version
        if: inputs.version != ''
        env:
          CORE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path
          version = os.environ["CORE_VERSION"]
          path = Path("py-sp-core/pyproject.toml")
          text, count = re.subn(
              r'^version = ".*"$', f'version = "{version}"', path.read_text(), count=1, flags=re.M
          )
          assert count == 1, "version line not found in py-sp-core/pyproject.toml"
          path.write_text(text)
          print(f"py-sp-core version stamped to {version}")
          EOF

      - name: Build wheel (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: py-sp-core
          command: build
          args: --release --out ../dist
          target: ${{ matrix.target }}
          manylinux: auto

      # The sdist is the fallback for platforms without a wheel; build it
      # once, alongside the x86_64 wheel.
      - name: Build sdist
        if: matrix.target == 'x86_64'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: py-sp-core
          command: sdist
          args: --out ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: sp-core-dist-linux-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.target }}
    # GitHub-hosted: the fireactions fleet is Linux-only, and macOS minutes
    # are free on public repos. macos-14 is arm64; the x86_64 wheel is
    # cross-compiled from the same runner.
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Stamp version
        if: inputs.version != ''
        env:
          CORE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path
          version = os.environ["CORE_VERSION"]
          path = Path("py-sp-core/pyproject.toml")
          text, count = re.subn(
              r'^version = ".*"$', f'version = "{version}"', path.read_text(), count=1, flags=re.M
          )
          assert count == 1, "version line not found in py-sp-core/pyproject.toml"
          path.write_text(text)
          print(f"py-sp-core version stamped to {version}")
          EOF

      # Hosted macOS images ship without Rust; rust-toolchain.toml pins the
      # toolchain once rustup is present.
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install # reads rust-toolchain.toml
          rustup target add ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: py-sp-core
          command: build
          args: --release --out ../dist
          target: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: sp-core-dist-macos-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
