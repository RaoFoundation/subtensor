name: Scheduled Smoke Tests

# Read-only smoke suites against the live networks, every 6 hours. The same
# suites gate promotion in release-train.yml; this catches drift between
# trains.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke-e2e-${{ matrix.test }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: smoke_devnet
            runner: [self-hosted, fireactions-turbo-8]
          - test: smoke_testnet
            runner: [self-hosted, fireactions-turbo-8]
          - test: smoke_mainnet
            runner: [self-hosted, fireactions-turbo-8]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ts-tests/.nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run smoke test
        working-directory: ts-tests
        run: |
          pnpm install --frozen-lockfile
          pnpm moonwall test ${{ matrix.test }}
