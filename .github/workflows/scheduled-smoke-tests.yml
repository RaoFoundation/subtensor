name: Scheduled Smoke Tests

# Read-only smoke suites against the live networks, daily at 12:00 UTC. The same
# suites gate promotion in release-train.yml; this catches drift between
# trains.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke-e2e-${{ matrix.test }}
    # Periodic monitoring must not compete with state-heavy PR checks for the
    # small try-runtime runner pool. This public repository can use standard
    # GitHub-hosted Linux runners for these read-only public-RPC suites.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: [smoke_devnet, smoke_testnet, smoke_mainnet]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ts-tests/.nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run smoke test
        working-directory: ts-tests
        run: |
          pnpm install --frozen-lockfile
          pnpm moonwall test ${{ matrix.test }}
