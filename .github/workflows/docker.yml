name: Publish Docker Image

# Node images publish whenever main or a network mirror moves, on runtime
# releases, and on demand. Main advances both :main and :latest so every
# successful merge publishes the default production image without waiting for
# a runtime release. Release-version and other branch tags never move :latest.

on:
  release:
    types: [published]
  push:
    branches: [main, devnet, testnet]
  workflow_dispatch:
    inputs:
      tag:
        description: "Ref to build and Docker tag to publish (defaults to the dispatching ref)"
        required: false
        default: ""

concurrency:
  group: docker-${{ github.ref }}
  # Main publications run serially so an older push cannot finish after a
  # newer one and roll :latest backward. Other refs keep the fast-cancel path.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Push/release events carry the immutable promoted commit. Manual
          # dispatches may override it with a branch or tag.
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Resolve immutable source revision
        id: ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  binary:
    name: production binary (${{ matrix.platform.arch }})
    needs: setup
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - uses: ./.github/actions/build-production-binary
        with:
          arch: ${{ matrix.platform.arch }}
          target: ${{ matrix.platform.target }}
          cache-key: docker-production-${{ matrix.platform.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: production-node-${{ matrix.platform.arch }}
          path: build/ci_target/${{ matrix.platform.arch }}/node-subtensor
          if-no-files-found: error

  image:
    name: validate image (${{ matrix.arch }}, no push)
    needs: [setup, binary]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - uses: actions/download-artifact@v5
        with:
          name: production-node-${{ matrix.arch }}
          path: build/ci_target/${{ matrix.arch }}

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          platforms: linux/${{ matrix.arch }}
          tags: subtensor-release-check:${{ matrix.arch }}
          load: true
          push: false

      - name: Verify image architecture and executable
        run: |
          set -euo pipefail
          actual=$(docker image inspect subtensor-release-check:${{ matrix.arch }} --format '{{.Architecture}}')
          test "$actual" = "${{ matrix.arch }}"
          docker run --rm --platform linux/${{ matrix.arch }} \
            subtensor-release-check:${{ matrix.arch }} --help > /dev/null

  publish:
    needs: [setup, binary, image]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Determine tag and image name
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SOURCE_REF: ${{ github.ref }}
        run: ./.github/scripts/resolve-node-image.sh

      - name: Download AMD64 production binary
        uses: actions/download-artifact@v5
        with:
          name: production-node-amd64
          path: build/ci_target/amd64

      - name: Download ARM64 production binary
        uses: actions/download-artifact@v5
        with:
          name: production-node-arm64
          path: build/ci_target/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify current main revision
        if: env.latest_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ needs.setup.outputs.sha }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [ "$BUILT_SHA" = "$current_main" ] || {
            echo "Refusing to move :latest from stale main revision $BUILT_SHA; current main is $current_main" >&2
            exit 1
          }

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.image }}:${{ env.tag }}
            ${{ env.latest_tag == 'true' && format('{0}:latest', env.image) || '' }}
