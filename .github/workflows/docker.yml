name: Publish Docker Image

# Node images publish whenever main or a network mirror moves, and on demand.
# Each branch publishes its moving tag (:main, :devnet, :testnet, :mainnet).
# The mainnet mirror moves only after watch-mainnet-release.yml verifies that
# the runtime executed on chain, so its build also publishes the immutable
# :v<spec_version> release tag and :latest. :latest is therefore always the
# code running on mainnet. Dispatch with tag=mainnet to republish the current
# mainnet release.

on:
  push:
    branches: [main, devnet, testnet, mainnet]
  workflow_dispatch:
    inputs:
      tag:
        description: "Ref to build and Docker tag to publish (defaults to the dispatching ref)"
        required: false
        default: ""

concurrency:
  group: docker-${{ github.ref }}
  # Main and mainnet publications run serially so an older push cannot finish
  # after a newer one and roll a moving tag backward. Other refs keep the
  # fast-cancel path.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/mainnet' }}

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tags: ${{ steps.tags.outputs.tags }}
      mainnet_release: ${{ steps.tags.outputs.mainnet_release }}
    steps:
      # Publication policy belongs to the workflow revision, not the selected
      # source: a manual run may build an older ref whose copy of these
      # scripts predates the current policy.
      - name: Check out publication tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          # Push events carry the immutable promoted commit. Manual
          # dispatches may override it with a branch or tag.
          ref: ${{ github.event.inputs.tag || github.sha }}
          path: source

      - name: Resolve immutable source revision
        id: source
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve mainnet release
        id: release
        if: env.INPUT_TAG == 'mainnet'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/resolve-mainnet-release.sh source

      - name: Resolve image tags
        id: tags
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: ./.github/scripts/resolve-node-image.sh

  binary:
    name: production binary (${{ matrix.platform.arch }})
    needs: setup
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - uses: ./.github/actions/build-production-binary
        with:
          arch: ${{ matrix.platform.arch }}
          target: ${{ matrix.platform.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: production-node-${{ matrix.platform.arch }}
          path: build/ci_target/${{ matrix.platform.arch }}/node-subtensor
          if-no-files-found: error

  image:
    name: validate image (${{ matrix.arch }}, no push)
    needs: [setup, binary]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - uses: actions/download-artifact@v5
        with:
          name: production-node-${{ matrix.arch }}
          path: build/ci_target/${{ matrix.arch }}

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          platforms: linux/${{ matrix.arch }}
          tags: subtensor-release-check:${{ matrix.arch }}
          load: true
          push: false

      - name: Verify image architecture and executable
        run: |
          set -euo pipefail
          actual=$(docker image inspect subtensor-release-check:${{ matrix.arch }} --format '{{.Architecture}}')
          test "$actual" = "${{ matrix.arch }}"
          docker run --rm --platform linux/${{ matrix.arch }} \
            subtensor-release-check:${{ matrix.arch }} --help > /dev/null

  publish:
    needs: [setup, binary, image]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Download AMD64 production binary
        uses: actions/download-artifact@v5
        with:
          name: production-node-amd64
          path: build/ci_target/amd64

      - name: Download ARM64 production binary
        uses: actions/download-artifact@v5
        with:
          name: production-node-arm64
          path: build/ci_target/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A newer mainnet release may have moved the mirror while this image
      # was building.
      - name: Verify current mainnet revision
        if: needs.setup.outputs.mainnet_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ needs.setup.outputs.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/mainnet" --jq '.object.sha')
          [ "$BUILT_SHA" = "$current" ] || {
            echo "Refusing to move :mainnet and :latest from stale revision $BUILT_SHA; the mainnet mirror is now $current" >&2
            exit 1
          }

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.setup.outputs.tags }}
