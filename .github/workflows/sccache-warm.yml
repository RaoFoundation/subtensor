name: Warm R2 sccache

# Normal same-repository PR and main CI writes through while it compiles. This
# workflow is maintenance only: refresh deployed-state branches when they move,
# repair expired/missing main entries once daily, or recover manually.

on:
  push:
    branches:
      - devnet
      - testnet
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Trusted branch to warm"
        required: true
        default: main
        type: choice
        options:
          - main
          - devnet
          - testnet

permissions:
  contents: read

concurrency:
  group: sccache-warm-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native:
    name: Populate native compiler cache
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/devnet' || github.ref == 'refs/heads/testnet')) ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: sccache-writer
      deployment: false
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 120
    env:
      SKIP_WASM_BUILD: 1
      CAPTURE_HOST_WARM_SET: >-
        ${{ github.ref == 'refs/heads/main' &&
            (github.event_name == 'schedule' ||
             (github.event_name == 'workflow_dispatch' && inputs.source_ref == 'main')) &&
            'true' || 'false' }}
    steps:
      - name: Check out trusted cache source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Enable exact compiler-key capture
        if: env.CAPTURE_HOST_WARM_SET == 'true'
        shell: bash
        run: |
          echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-warm-native.log" >> "$GITHUB_ENV"
          echo "SCCACHE_LOG=sccache::compiler::compiler=debug" >> "$GITHUB_ENV"

      - name: Install Rust and enable trusted R2 writer
        uses: ./.github/actions/rust-setup
        with:
          cache-key: sccache-warm-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
          components: clippy
          sccache-credential-mode: writer
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}
          # This maintenance run must observe durable R2 directly. A local hit
          # must not hide an origin object that has expired or gone missing.
          sccache-local-tier: disabled

      - name: Require protected writer activation
        shell: bash
        run: |
          if [[ "${SCCACHE_ENABLED:-}" != true ||
                "${SCCACHE_BACKEND:-}" != r2 ||
                "${RUSTC_WRAPPER:-}" != sccache ]]; then
            echo "::error::protected R2 writer did not activate"
            exit 1
          fi

      - name: Warm native Rust compiler cache
        uses: ./.github/actions/warm-native-cache

      - name: Extract exact native compiler object keys
        if: env.CAPTURE_HOST_WARM_SET == 'true'
        run: >-
          .github/scripts/r2-sccache-warmset.py extract
          "$SCCACHE_ERROR_LOG"
          "$RUNNER_TEMP/sccache-warm-keys/native.keys"

      - name: Upload native compiler object keys
        if: env.CAPTURE_HOST_WARM_SET == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sccache-warm-keys-native-${{ github.run_id }}
          path: ${{ runner.temp }}/sccache-warm-keys/native.keys
          if-no-files-found: error
          retention-days: 1

  production-amd64:
    name: Populate amd64 production cache
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/devnet' || github.ref == 'refs/heads/testnet')) ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: sccache-writer
      deployment: false
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 120
    env:
      CAPTURE_HOST_WARM_SET: >-
        ${{ github.ref == 'refs/heads/main' &&
            (github.event_name == 'schedule' ||
             (github.event_name == 'workflow_dispatch' && inputs.source_ref == 'main')) &&
            'true' || 'false' }}
    steps:
      - name: Check out trusted cache source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Enable exact compiler-key capture
        if: env.CAPTURE_HOST_WARM_SET == 'true'
        shell: bash
        run: |
          echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-warm-production.log" >> "$GITHUB_ENV"
          echo "SCCACHE_LOG=sccache::compiler::compiler=debug" >> "$GITHUB_ENV"

      - name: Warm amd64 production binary artifacts
        uses: ./.github/actions/build-production-binary
        with:
          arch: amd64
          target: x86_64-unknown-linux-gnu
          cache-key: sccache-warm-production-amd64
          sccache-credential-mode: writer
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}
          sccache-local-tier: disabled

      - name: Extract exact production compiler object keys
        if: env.CAPTURE_HOST_WARM_SET == 'true'
        run: >-
          .github/scripts/r2-sccache-warmset.py extract
          "$SCCACHE_ERROR_LOG"
          "$RUNNER_TEMP/sccache-warm-keys/production.keys"

      - name: Upload production compiler object keys
        if: env.CAPTURE_HOST_WARM_SET == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sccache-warm-keys-production-${{ github.run_id }}
          path: ${{ runner.temp }}/sccache-warm-keys/production.keys
          if-no-files-found: error
          retention-days: 1

  publish-host-warm-set:
    name: Publish bounded host warm set
    needs: [native, production-amd64]
    if: >-
      always() &&
      needs.native.result == 'success' &&
      needs.production-amd64.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.source_ref == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: sccache-writer
      deployment: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download production compiler keys
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sccache-warm-keys-production-${{ github.run_id }}
          path: ${{ runner.temp }}/sccache-warm-keys/production

      - name: Download native compiler keys
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sccache-warm-keys-native-${{ github.run_id }}
          path: ${{ runner.temp }}/sccache-warm-keys/native

      # Production keys are passed first so the node binary remains in the
      # bounded set even if every native variant together exceeds 6 GiB.
      - name: Publish the latest generation-stamped warm-set manifest
        env:
          SCCACHE_BUCKET: subtensor-ci-sccache
          SCCACHE_ENDPOINT: https://3dc4cebb791314d78848969042fb3382.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}
        run: >-
          .github/scripts/r2-sccache-warmset.py publish
          "$RUNNER_TEMP/sccache-warm-keys/production/production.keys"
          "$RUNNER_TEMP/sccache-warm-keys/native/native.keys"
