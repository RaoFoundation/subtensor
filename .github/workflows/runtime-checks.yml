name: Runtime Checks

# Build-artifacts-once, fan-out gate for every PR: independent jobs compile the
# runtime wasm and release node in parallel, then try-runtime
# (devnet/testnet/mainnet), the spec-version comparison, and the mainnet
# clone-upgrade suite consume the artifacts instead of rebuilding. Consolidates the former try-runtime.yml,
# check-spec-version.yml, and check-clone-upgrade.yml (artifacts are scoped to
# a single workflow run, so the fan-out jobs must live in one file).

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened]
  workflow_dispatch:
    inputs:
      fresh_state:
        description: "Bypass cached try-runtime snapshots and scrape all networks live"
        type: boolean
        default: false
      try_runtime_only:
        description: "Run only the try-runtime build and cached network checks"
        type: boolean
        default: false
concurrency:
  group: runtime-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WS_ENDPOINT: ws://127.0.0.1:9944
  MAINNET_RPC: https://entrypoint-finney.opentensor.ai
  TRY_RUNTIME_VERSION: "0.10.1"

jobs:
  # Fork PRs must not run on self-hosted runners — checkout executes untrusted
  # code from the fork head (RCE risk on persistent org hardware).
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  # "Sudo-upgrade mainnet clone and test" and "Docs and website build" are
  # required merge checks, so this workflow must always trigger (a required
  # check whose workflow never runs is stuck "Expected" and blocks the merge).
  # Jobs skip themselves when the PR touches nothing they exercise; a
  # `skipped` conclusion satisfies branch protection.
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      docs: ${{ steps.filter.outputs.docs }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      sdk_drift: ${{ steps.filter.outputs.sdk_drift }}
      snapshot_ci: ${{ steps.filter.outputs.snapshot_ci }}
    steps:
      - name: Checkout trusted path classifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts/classify-runtime-changes.sh
          sparse-checkout-cone-mode: false
          path: .trusted-runtime-filter
          persist-credentials: false

      # Plain gh-api file listing instead of a marketplace action: the org's
      # Actions allowlist rejects unlisted third-party actions (startup_failure).
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          enable_all() {
            {
              echo "runtime=true"
              echo "docs=true"
              echo "python_sdk=true"
              echo "sdk_drift=true"
              echo "snapshot_ci=true"
            } >> "$GITHUB_OUTPUT"
          }
          publish_classification() {
            local classification=$1 key value
            if [[ "$(wc -l < "$classification" | tr -d '[:space:]')" != 5 ]]; then
              return 1
            fi
            for key in runtime docs python_sdk sdk_drift snapshot_ci; do
              value=$(sed -n "s/^${key}=//p" "$classification")
              [[ "$value" == true || "$value" == false ]] || return 1
              [[ "$(grep -c "^${key}=" "$classification")" == 1 ]] || return 1
            done
            cat "$classification" >> "$GITHUB_OUTPUT"
          }
          classifier=.trusted-runtime-filter/.github/scripts/classify-runtime-changes.sh
          if [[ ! -f "$classifier" ]]; then
            echo "::warning::Trusted base predates the path classifier; enabling every check."
            enable_all
            exit 0
          fi
          if ! pages=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --slurp); then
            echo "::warning::PR file listing failed; enabling every check."
            enable_all
            exit 0
          fi
          fetched_files=$(jq '[.[][]] | length' <<< "$pages")
          if [[ "$fetched_files" -ne "$CHANGED_FILES" ]]; then
            echo "::warning::PR file listing was incomplete ($fetched_files/$CHANGED_FILES); enabling every check."
            enable_all
            exit 0
          fi
          # A rename can move a runtime file outside a matched directory, so
          # classify both the current and previous paths.
          classification=$(mktemp)
          trap 'rm -f "$classification"' EXIT
          if ! jq -r '.[][] | .filename, (.previous_filename // empty)' <<< "$pages" \
              | bash "$classifier" "$classification" ||
             ! publish_classification "$classification"; then
            echo "::warning::Runtime classifier failed or emitted invalid outputs; enabling every check."
            enable_all
          fi

  snapshot-artifact-tests:
    name: snapshot artifact contract tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.snapshot_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/test-snapshot-artifact.sh
      - run: .github/scripts/test-download-artifact.sh
      - run: .github/scripts/test-select-shared-release-artifact.sh
      - run: .github/scripts/test-runtime-change-filter.sh
      - run: .github/scripts/test-clone-regression-phase.sh

  # Build the try-runtime wasm independently so its consumers do not wait for
  # the unrelated release node build. The source check also makes the
  # --disable-mbm-checks optimization self-disabling when MBMs are introduced.
  build-try-runtime:
    name: build try-runtime wasm
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true'
    runs-on: [self-hosted, fireactions-turbo-16]
    outputs:
      mbm_args: ${{ steps.mbm.outputs.args }}
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'sccache-reader' || 'sccache-writer' }}
      deployment: false
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: runtime-checks
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}

      - name: Add wasm target and rust-src
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src

      - name: Detect multi-block migration configuration
        id: mbm
        run: |
          set -euo pipefail
          definitions=$(grep -cE '^[[:space:]]*type MultiBlockMigrator[[:space:]]*=' runtime/src/lib.rs || true)
          if [ "$definitions" -ne 1 ]; then
            echo "::error::expected exactly one MultiBlockMigrator definition, found $definitions"
            exit 1
          fi
          if grep -qE '^[[:space:]]*type MultiBlockMigrator[[:space:]]*=[[:space:]]*\(\)[[:space:]]*;' runtime/src/lib.rs; then
            echo "args=--disable-mbm-checks" >> "$GITHUB_OUTPUT"
            echo "No multi-block migrator configured; duplicate MBM state loading will be disabled."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Multi-block migrator configured; retaining the full MBM execution path."
          fi

      - name: Build runtime wasm (production, try-runtime feature)
        run: cargo build --profile production -p node-subtensor-runtime --features try-runtime -q --locked

      - name: Report try-runtime compiler cache
        if: always()
        run: .github/scripts/sccache-report.sh "Try-runtime wasm compiler cache"

      - name: Upload try-runtime wasm
        uses: actions/upload-artifact@v4
        with:
          name: try-runtime-wasm
          path: target/production/wbuild/node-subtensor-runtime/node_subtensor_runtime.compact.compressed.wasm
          if-no-files-found: error
          retention-days: 3

  # Release node + its wbuild runtime wasm, used only by clone-upgrade.
  # start-local-clone.sh expects the binary at target/release/node-subtensor;
  # update-runtime-with-alice.ts expects the wasm under target/release/wbuild.
  build-node-release:
    name: build release node
    needs: [trusted-pr, changes]
    if: >-
      (github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true') &&
      !(github.event_name == 'workflow_dispatch' && inputs.try_runtime_only)
    # Turbo runners probe the host-local tier and fail open to direct R2.
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'sccache-reader' || 'sccache-writer' }}
      deployment: false
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: runtime-checks-node
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}

      - name: Add wasm target and rust-src
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src

      - name: Build node-subtensor (release)
        run: |
          set -euo pipefail
          sccache --zero-stats
          started=$(date -u +%s)
          cargo build --release -p node-subtensor
          seconds=$(($(date -u +%s) - started))
          {
            echo "### Release node compile"
            echo "- Wall time: ${seconds}s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report release-node compiler cache
        if: always()
        run: .github/scripts/sccache-report.sh "Release node compiler cache"

      - name: Validate release node artifact
        run: |
          test -s target/release/node-subtensor
          test -s target/release/wbuild/node-subtensor-runtime/node_subtensor_runtime.compact.compressed.wasm
          chmod +x target/release/node-subtensor

      - name: Upload release node + runtime wasm
        uses: actions/upload-artifact@v4
        with:
          # The exact merge SHA lets TypeScript E2E prove this artifact was
          # built from the same source while clone consumers reuse it in-run.
          name: node-subtensor-release-${{ github.sha }}
          path: |
            target/release/node-subtensor
            target/release/wbuild/node-subtensor-runtime/node_subtensor_runtime.compact.compressed.wasm
          if-no-files-found: error
          retention-days: 3

  # For every PR: run try-runtime's on-runtime-upgrade checks against a recent,
  # finalized snapshot of each network. Live state is an explicit diagnostic
  # bypass only; cached jobs never contact a network endpoint.
  try-runtime:
    name: try-runtime ${{ matrix.network.name }}
    needs: build-try-runtime
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 90
    permissions:
      contents: read
      # Cross-run artifact download (the nightly try-runtime state snapshot).
      actions: read
    strategy:
      fail-fast: false
      matrix:
        network:
          # NOTE: the hostnames are misleading — archive.dev.opentensor.ai
          # serves the TESTNET archive on :8443 and the MAINNET archive on
          # :443 (verified by genesis hash; try-runtime wants archive nodes,
          # which is why we don't use the entrypoint hostnames). The
          # "Verify endpoint" step below enforces each URI's identity.
          - name: devnet
            uri: wss://dev.chain.opentensor.ai:443
            genesis: "0x077899043eb684c5277b6814a39161f4ce072b45e782e12c81a521c63fb4f3e5"
          - name: testnet
            uri: wss://archive.dev.opentensor.ai:8443
            genesis: "0x8f9cf856bf558a14440e75569c9e58594757048d7b3a84b5d25f6bd978263105"
          - name: mainnet
            uri: wss://archive.dev.opentensor.ai:443
            genesis: "0x2f0555cc76fc2840a25a6ea3b9637146806f1f44b090c175ffde2a7e5ab36c03"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve cached or fresh state mode
        id: state-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MANUAL_FRESH: ${{ inputs.fresh_state || false }}
        run: |
          .github/scripts/snapshot-artifact.sh mode \
            "$EVENT_NAME" "$LABELS_JSON" "$MANUAL_FRESH" "$GITHUB_OUTPUT"

      - name: Verify endpoint serves the expected network
        if: steps.state-mode.outputs.fresh-state == 'true'
        run: |
          http_uri="${{ matrix.network.uri }}"
          http_uri="${http_uri/wss:/https:}"
          genesis=$(curl -sS -m 30 -H 'Content-Type: application/json' \
            -d '{"id":1,"jsonrpc":"2.0","method":"chain_getBlockHash","params":[0]}' \
            "$http_uri" | sed -n 's/.*"result":"\(0x[0-9a-f]*\)".*/\1/p')
          echo "endpoint genesis: $genesis"
          if [ "$genesis" != "${{ matrix.network.genesis }}" ]; then
            echo "::error::${{ matrix.network.name }} endpoint $http_uri serves genesis $genesis, expected ${{ matrix.network.genesis }}"
            exit 1
          fi

      - name: Download runtime wasm
        uses: actions/download-artifact@v4
        with:
          name: try-runtime-wasm
          path: runtime-blob

      - name: Download try-runtime-cli v${{ env.TRY_RUNTIME_VERSION }}
        run: |
          TRY_RUNTIME_BIN="$RUNNER_TEMP/try-runtime"
          curl --fail --silent --show-error --location \
            "https://github.com/paritytech/try-runtime-cli/releases/download/v${TRY_RUNTIME_VERSION}/try-runtime-x86_64-unknown-linux-musl" \
            --output "$TRY_RUNTIME_BIN"
          chmod +x "$TRY_RUNTIME_BIN"
          echo "TRY_RUNTIME_BIN=$TRY_RUNTIME_BIN" >> "$GITHUB_ENV"

      # State scraping dominates this job's wall clock (30-40 min for mainnet).
      # The nightly refresh-mainnet-snapshot workflow publishes a .snap per
      # network; replaying against it is minutes instead. Same trust rule as
      # the clone snapshot: only artifacts produced on the default branch.
      # The .snap format is coupled to the try-runtime-cli release, so the
      # producer and this job must pin the same version.
      - name: Select try-runtime state snapshot
        id: snapshot
        if: steps.state-mode.outputs.fresh-state != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .github/scripts/snapshot-artifact.sh select \
            "try-runtime-snap-v${TRY_RUNTIME_VERSION}-${{ matrix.network.name }}" \
            "${{ github.event.repository.default_branch }}" \
            "${{ github.repository_id }}" \
            .github/workflows/refresh-mainnet-snapshot.yml \
            72 "$GITHUB_OUTPUT" required

      - name: Mark snapshot restore start
        if: steps.state-mode.outputs.fresh-state != 'true'
        run: echo "SNAPSHOT_RESTORE_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Download selected try-runtime state snapshot
        id: download-snapshot
        if: steps.state-mode.outputs.fresh-state != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          .github/scripts/download-artifact.sh \
            "${{ steps.snapshot.outputs.artifact-id }}" \
            "try-runtime-snap-v${TRY_RUNTIME_VERSION}-${{ matrix.network.name }}" \
            "${{ steps.snapshot.outputs.artifact-digest }}" \
            "${{ steps.snapshot.outputs.artifact-size-bytes }}" \
            snap "$GITHUB_OUTPUT"

      - name: Validate try-runtime state snapshot
        if: steps.state-mode.outputs.fresh-state != 'true'
        run: |
          set -euo pipefail
          snapshot="snap/${{ matrix.network.name }}.snap"
          manifest="snap/${{ matrix.network.name }}.manifest.json"
          .github/scripts/snapshot-artifact.sh validate \
            "$manifest" "$snapshot" \
            "${{ matrix.network.name }}" "${{ matrix.network.genesis }}" \
            "$TRY_RUNTIME_VERSION" "${{ steps.snapshot.outputs.producer-sha }}"
          echo "TRY_RUNTIME_SNAP=$snapshot" >> "$GITHUB_ENV"
          restore_seconds=$(($(date -u +%s) - SNAPSHOT_RESTORE_STARTED))
          block=$(jq -er '.finalized_block_number' "$manifest")
          spec=$(jq -er '.source_spec_name + "/" + (.source_spec_version | tostring)' "$manifest")
          {
            echo "### ${{ matrix.network.name }} cached state"
            echo "- Artifact: ${{ steps.snapshot.outputs.artifact-id }} (run ${{ steps.snapshot.outputs.run-id }})"
            echo "- Download source: ${{ steps.download-snapshot.outputs.source }}"
            echo "- Age: ${{ steps.snapshot.outputs.age-hours }}h"
            echo "- Finalized block: $block"
            echo "- Runtime: $spec"
            echo "- Restore and validation: ${restore_seconds}s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check migrations
        env:
          NODE_URI: ${{ matrix.network.uri }}
          FRESH_STATE: ${{ steps.state-mode.outputs.fresh-state }}
          MBM_ARGS: ${{ needs.build-try-runtime.outputs.mbm_args }}
        run: |
          set -euo pipefail
          export RUST_LOG=remote-ext=debug,runtime=debug
          if [ "$FRESH_STATE" = true ]; then
            state=(live --uri "$NODE_URI")
            state_mode=live
          else
            : "${TRY_RUNTIME_SNAP:?cached execution requires a validated snapshot}"
            state=(snap --path "$TRY_RUNTIME_SNAP")
            state_mode=cached
          fi
          mbm=()
          [ -z "$MBM_ARGS" ] || mbm+=("$MBM_ARGS")
          started=$(date -u +%s)
          "$TRY_RUNTIME_BIN" \
            --runtime runtime-blob/node_subtensor_runtime.compact.compressed.wasm \
            on-runtime-upgrade \
            --checks=all \
            --blocktime 12000 \
            --disable-spec-version-check --no-weight-warnings \
            "${mbm[@]}" \
            "${state[@]}"
          elapsed=$(($(date -u +%s) - started))
          echo "- Replay mode: $state_mode (${elapsed}s)" >> "$GITHUB_STEP_SUMMARY"

  # Runtime-affecting PRs must carry a spec_version newer than what mainnet is
  # running — otherwise the release train will build the merge and then no-op
  # at every deploy guard. Label a PR `no-spec-version-bump` when the change
  # deliberately ships without a runtime release. No compilation: the local
  # value is the literal in runtime/src/lib.rs (grep fails loudly unless it
  # matches exactly once) and mainnet's comes from one RPC call.
  spec-version:
    name: spec_version newer than mainnet
    needs: [trusted-pr, changes]
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no-spec-version-bump') &&
      (github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true') &&
      !(github.event_name == 'workflow_dispatch' && inputs.try_runtime_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare against mainnet
        run: |
          set -euo pipefail
          matches=$(grep -cE '^\s*spec_version: [0-9]+,' runtime/src/lib.rs)
          if [ "$matches" -ne 1 ]; then
            echo "::error::expected exactly one 'spec_version: <n>,' literal in runtime/src/lib.rs, found $matches"
            exit 1
          fi
          local_spec=$(grep -oE '^\s*spec_version: [0-9]+,' runtime/src/lib.rs | grep -oE '[0-9]+')
          chain_spec=$(curl -sS -m 30 -H 'Content-Type: application/json' \
            -d '{"id":1,"jsonrpc":"2.0","method":"state_getRuntimeVersion","params":[]}' \
            "$MAINNET_RPC" | jq -er '.result.specVersion')
          echo "mainnet spec_version: $chain_spec"
          echo "local spec_version:   $local_spec"
          if [ "$local_spec" -le "$chain_spec" ]; then
            echo "spec_version must be bumped above mainnet's, or label the PR 'no-spec-version-bump'."
            exit 1
          fi

  # Ruff, ty, pytest, and the codegen checks need no chain and no Rust
  # artifact; running them inside clone-upgrade serialized minutes of Python
  # checks behind a multi-GB chainspec genesis init. The docs drift gate that
  # also lived there is covered by docs-website (its path filter includes
  # sdk/python/, the only input that can move the generated pages).
  sdk-checks:
    name: SDK offline checks
    needs: [trusted-pr, changes]
    if: >-
      (github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.python_sdk == 'true') &&
      !(github.event_name == 'workflow_dispatch' && inputs.try_runtime_only)
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: SDK offline checks (same as just check)
        working-directory: sdk/python
        run: |
          python3 ../../.github/scripts/test_prepare_sdk_dist.py
          uv sync --locked --all-extras --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check --exit-zero-on-warning bittensor
          uv run pytest
          uv run python -m codegen.check --coverage
          uv run python -m codegen.check --names

  # Decide whether the clone regressions can fan out over the immutable
  # snapshot. Fresh-state diagnostics and a missing trusted snapshot retain
  # the single-job live-scrape path, avoiding duplicate archive RPC load.
  # Execute the selector from the trusted base revision so a PR cannot choose
  # the smaller matrix by modifying its own routing helper.
  clone-plan:
    name: plan clone regression execution
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      use_snapshot: ${{ steps.plan.outputs.use_snapshot }}
      artifact_id: ${{ steps.plan.outputs.artifact_id }}
      run_id: ${{ steps.plan.outputs.run_id }}
    steps:
      - name: Check out trusted snapshot selector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts/snapshot-artifact.sh
          sparse-checkout-cone-mode: false
          path: .trusted-clone-plan
          persist-credentials: false

      - name: Select parallel or combined execution
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RELEVANT: ${{ needs.changes.outputs.runtime }}
          FRESH_CLONE: ${{ contains(github.event.pull_request.labels.*.name, 'fresh-mainnet-clone') }}
        run: |
          set -euo pipefail
          combined() {
            echo 'matrix={"phase":["combined"]}' >> "$GITHUB_OUTPUT"
            echo 'use_snapshot=false' >> "$GITHUB_OUTPUT"
          }

          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$RUNTIME_RELEVANT" != true ]]; then
            combined
            exit 0
          fi
          if [[ "$FRESH_CLONE" == true ]]; then
            echo "fresh-mainnet-clone requested; retaining one live scrape"
            combined
            exit 0
          fi

          selector=.trusted-clone-plan/.github/scripts/snapshot-artifact.sh
          if [[ ! -x "$selector" ]]; then
            echo "trusted snapshot selector unavailable; retaining one live scrape"
            combined
            exit 0
          fi

          selection=$(mktemp)
          trap 'rm -f "$selection"' EXIT
          if "$selector" select \
              mainnet-snapshot \
              "${{ github.event.repository.default_branch }}" \
              "${{ github.repository_id }}" \
              .github/workflows/refresh-mainnet-snapshot.yml \
              168 "$selection" optional &&
             grep -qx 'found=true' "$selection"; then
            echo 'matrix={"phase":["pristine","remaining"]}' >> "$GITHUB_OUTPUT"
            echo 'use_snapshot=true' >> "$GITHUB_OUTPUT"
            sed -n \
              -e 's/^artifact-id=/artifact_id=/p' \
              -e 's/^run-id=/run_id=/p' \
              "$selection" >> "$GITHUB_OUTPUT"
            echo "trusted snapshot available; pinning one artifact for parallel clone phases"
          else
            echo "trusted snapshot unavailable; retaining one live scrape"
            combined
          fi

  # For every PR: sudo-upgrade a local clone of mainnet with the proposed
  # runtime, then run the clone regression suite and the SDK metadata drift
  # gate against the upgraded chain. (Chain-facing SDK e2e coverage lives in
  # the Rust suite under check-bittensor-e2e-tests.yml.) Consumes the
  # exact-merge release artifact instead of building, and restores the nightly
  # mainnet-snapshot artifact instead of re-scraping mainnet state (falls back
  # to a live scrape when no snapshot exists or the `fresh-mainnet-clone`
  # label is set). Auto-skips (via the `build-node-release` need) when the PR touches
  # nothing runtime-relevant.
  #
  # Interval sealing advances runtime time by one 12-second slot every 250ms.
  # With a trusted snapshot available, the pristine issuance invariant and
  # the state-mutating remaining regressions restore independent copies and
  # run in parallel. A live scrape retains the combined sequential path.
  clone-upgrade:
    name: clone-upgrade (${{ matrix.phase }})
    needs: [trusted-pr, changes, clone-plan, build-node-release]
    runs-on: [self-hosted, fireactions-turbo-8]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-clone-upgrade') }}
    timeout-minutes: 90
    permissions:
      contents: read
      # Cross-run artifact download (the nightly mainnet snapshot).
      actions: read
    strategy:
      fail-fast: false
      # Missing planner output falls back to the complete sequential suite;
      # it must never create an empty matrix that silently skips coverage.
      matrix: ${{ fromJSON(needs.clone-plan.outputs.matrix || '{"phase":["combined"]}') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release node + runtime wasm
        uses: actions/download-artifact@v4
        with:
          name: node-subtensor-release-${{ github.sha }}
          path: target/release

      - name: Make node binary executable
        run: chmod +x target/release/node-subtensor

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The trusted base selector pins provenance and the immutable artifact
      # ID. Read integrity metadata for that exact ID here so rollout remains
      # compatible with base revisions that predate digest/size outputs.
      - name: Validate pinned mainnet snapshot metadata
        if: needs.clone-plan.outputs.use_snapshot == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.clone-plan.outputs.artifact_id }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/pinned-mainnet-snapshot.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$metadata"
          jq -e --arg id "$ARTIFACT_ID" '
            (.id | tostring) == $id and
            .name == "mainnet-snapshot" and
            .expired == false and
            (.size_in_bytes | type) == "number" and .size_in_bytes > 0 and
            (.digest | type) == "string" and
            (.digest | test("^sha256:[0-9a-f]{64}$"))
          ' "$metadata" > /dev/null

      - name: Download selected mainnet clone snapshot
        id: download-clone-snapshot
        if: needs.clone-plan.outputs.use_snapshot == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ARTIFACT_ID: ${{ needs.clone-plan.outputs.artifact_id }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/pinned-mainnet-snapshot.json"
          .github/scripts/download-artifact.sh \
            "$ARTIFACT_ID" \
            mainnet-snapshot \
            "$(jq -er '.digest' "$metadata")" \
            "$(jq -er '.size_in_bytes' "$metadata")" \
            /tmp/mainnet-snapshot "$GITHUB_OUTPUT"

      - name: Restore mainnet clone snapshot
        id: restore-clone-snapshot
        if: needs.clone-plan.outputs.use_snapshot == 'true'
        run: |
          set -euo pipefail
          checkpoint=/tmp/mainnet-snapshot/mainnet-snapshot.tar.gz
          ./clones/scripts/local-clone-checkpoint.sh restore "$checkpoint"
          echo "Restored artifact ${{ needs.clone-plan.outputs.artifact_id }} from run ${{ needs.clone-plan.outputs.run_id }}."
          {
            echo "### Mainnet clone snapshot"
            echo "- Download source: ${{ steps.download-clone-snapshot.outputs.source }}"
            echo "- Download and extraction: ${{ steps.download-clone-snapshot.outputs.seconds }}s"
            echo "- Artifact: ${{ needs.clone-plan.outputs.artifact_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Tells start-local-clone.sh to keep the pre-initialized database
          # instead of wiping it and re-running genesis init.
          echo "KEEP_CLONE_DATA=1" >> "$GITHUB_ENV"
          echo "CLONE_CHECKPOINT=$checkpoint" >> "$GITHUB_ENV"

      - name: Create mainnet clone
        if: needs.clone-plan.outputs.use_snapshot != 'true'
        # No-op when the snapshot restored the chainspec; otherwise scrapes
        # mainnet state live (first run, expired snapshot, or the
        # fresh-mainnet-clone label). The live scrape's warp sync sometimes
        # wedges downloading finality proofs (stuck at 0.00 MiB for an hour+,
        # observed repeatedly); a healthy scrape finishes in ~15 minutes, so
        # kill and retry — a fresh node picks new peers and unsticks. The
        # script self-cleans partial state when the chainspec is missing.
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=30 1200 ./clones/scripts/clone-mainnet.sh; then
              exit 0
            fi
            echo "::warning::mainnet scrape attempt ${attempt} timed out or failed; retrying"
            # timeout only signals the script; reap its orphaned sync node so
            # the retry can rebind ports and reuse the base path.
            pkill -9 -f build-patched-spec || true
            sleep 10
          done
          exit 1

      - name: Prepare a reusable checkpoint after live fallback
        if: needs.clone-plan.outputs.use_snapshot != 'true'
        run: |
          set -euo pipefail
          ./clones/scripts/start-local-clone-and-wait.sh manual
          checkpoint=/tmp/mainnet-clone-pristine.tar
          ./clones/scripts/local-clone-checkpoint.sh create "$checkpoint"
          echo "KEEP_CLONE_DATA=1" >> "$GITHUB_ENV"
          echo "CLONE_CHECKPOINT=$checkpoint" >> "$GITHUB_ENV"

      - name: Install clone test dependencies
        working-directory: clones/js-tests
        run: npm ci

      - name: Run clone regression phase
        env:
          # The harness owns the phase lifecycle and cleanup. YAML only decides
          # which independent phase runs and whether SDK drift is relevant.
          RUN_SDK_DRIFT: ${{ github.event_name != 'pull_request' || needs.changes.outputs.sdk_drift == 'true' }}
        run: ./clones/scripts/run-clone-regression-phase.sh "${{ matrix.phase }}"

      - name: Dump clone node and harness logs
        if: failure()
        run: |
          echo "===== clone-node.log (last 200 lines) ====="
          tail -n 200 clone-node.log 2>/dev/null || echo "(missing)"
          for f in clones/js-tests/temp/*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done

  # Branch protection requires a check named exactly "Sudo-upgrade mainnet
  # clone and test"; this fan-in preserves the required-check name. It passes
  # when the clone job succeeded, or when the whole suite legitimately skipped
  # (docs-only PR or the skip-clone-upgrade label). Anything else — including
  # a build failure cascading into a skipped clone job — fails.
  clone-upgrade-gate:
    name: Sudo-upgrade mainnet clone and test
    needs: [changes, build-node-release, clone-upgrade]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate clone result
        env:
          CHANGES: ${{ needs.changes.result }}
          CLONE: ${{ needs.clone-upgrade.result }}
          BUILD: ${{ needs.build-node-release.result }}
          RUNTIME_RELEVANT: ${{ needs.changes.outputs.runtime }}
          LABEL_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-clone-upgrade') }}
        run: |
          echo "changes=$CHANGES clone=$CLONE build=$BUILD runtime=$RUNTIME_RELEVANT label-skip=$LABEL_SKIP"
          # A failed path-filter job must not read as "nothing runtime-related
          # changed" — that would let build+clone skip and the gate pass.
          if [ "$CHANGES" != "success" ]; then
            exit 1
          fi
          if [ "$CLONE" = "success" ]; then
            exit 0
          fi
          if [ "$CLONE" = "skipped" ] && [ "$LABEL_SKIP" = "true" ]; then
            exit 0
          fi
          case "$RUNTIME_RELEVANT" in
            true|false) ;;
            *) echo "invalid runtime selection: '$RUNTIME_RELEVANT'" >&2; exit 1 ;;
          esac
          if [ "$CLONE" = "skipped" ] && [ "$BUILD" = "skipped" ] && [ "$RUNTIME_RELEVANT" = "false" ]; then
            exit 0
          fi
          exit 1

  docs-website:
    name: Docs and website build
    needs: [trusted-pr, changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: [self-hosted, fireactions-turbo-8]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Docs drift gate (generated tx/query/errors pages)
        working-directory: sdk/python
        run: |
          uv sync --locked --all-extras --dev
          uv run python ../../website/apps/bittensor-website/scripts/generate.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Build docs site
        working-directory: website
        run: |
          yarn install --immutable
          yarn turbo run build --filter=@raofoundation/bittensor-website
