name: Runtime Checks

# Build-once, fan-out gate for every PR: one job compiles the runtime wasm and
# the release node binary, then try-runtime (devnet/testnet/mainnet), the
# spec-version comparison, and the mainnet clone-upgrade suite all consume the
# artifacts instead of rebuilding. Consolidates the former try-runtime.yml,
# check-spec-version.yml, and check-clone-upgrade.yml (artifacts are scoped to
# a single workflow run, so the fan-out jobs must live in one file).

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened]
  workflow_dispatch:

concurrency:
  group: runtime-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WS_ENDPOINT: ws://127.0.0.1:9944
  MAINNET_RPC: https://entrypoint-finney.opentensor.ai

jobs:
  # Fork PRs must not run on self-hosted runners — checkout executes untrusted
  # code from the fork head (RCE risk on persistent org hardware).
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  # "Sudo-upgrade mainnet clone and test" and "Docs and website build" are
  # required merge checks, so this workflow must always trigger (a required
  # check whose workflow never runs is stuck "Expected" and blocks the merge).
  # Jobs skip themselves when the PR touches nothing they exercise; a
  # `skipped` conclusion satisfies branch protection.
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # Plain gh-api file listing instead of a marketplace action: the org's
      # Actions allowlist rejects unlisted third-party actions (startup_failure).
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          runtime_pattern='^(common|node|pallets|precompiles|primitives|runtime|support|chain-extensions|src|vendor|clones|sdk)/|^(Cargo\.(toml|lock)|build\.rs|rust-toolchain\.toml)$|^website/apps/bittensor-website/scripts/|^\.github/(workflows/runtime-checks\.yml|actions/(rust-setup|sccache-setup)/|scripts/sccache-configure\.sh$)'
          docs_pattern='^website/|^sdk/python/|^\.github/workflows/runtime-checks\.yml$'
          runtime=false; docs=false
          grep -qE "$runtime_pattern" <<< "$files" && runtime=true
          grep -qE "$docs_pattern" <<< "$files" && docs=true
          echo "runtime=$runtime, docs=$docs"
          {
            echo "runtime=$runtime"
            echo "docs=$docs"
          } >> "$GITHUB_OUTPUT"

  # The single compile of this workflow. Two artifacts:
  #   try-runtime-wasm — production profile + try-runtime feature, used by the
  #     three try-runtime network checks.
  #   node-release — release node binary + its wbuild runtime wasm, used by
  #     the clone-upgrade suite (start-local-clone.sh expects the binary at
  #     target/release/node-subtensor; update-runtime-with-alice.ts expects the
  #     wasm at target/release/wbuild/node-subtensor-runtime/).
  build:
    name: build runtime artifacts
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true'
    # Keep this build on the reserved 16-core turbo lane: it gates every
    # try-runtime check and clone shard. General and background work uses the
    # 8-core pool so it cannot consume this critical-path capacity.
    runs-on: [self-hosted, fireactions-turbo]
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: runtime-checks

      - name: Add wasm target and rust-src
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src

      - name: Build runtime wasm (production, try-runtime feature)
        run: cargo build --profile production -p node-subtensor-runtime --features try-runtime -q --locked

      - name: Build node-subtensor (release)
        run: cargo build --release -p node-subtensor

      - name: Upload try-runtime wasm
        uses: actions/upload-artifact@v4
        with:
          name: try-runtime-wasm
          path: target/production/wbuild/node-subtensor-runtime/node_subtensor_runtime.compact.compressed.wasm
          if-no-files-found: error
          retention-days: 3

      - name: Upload release node + runtime wasm
        uses: actions/upload-artifact@v4
        with:
          name: node-release
          path: |
            target/release/node-subtensor
            target/release/wbuild/node-subtensor-runtime/node_subtensor_runtime.compact.compressed.wasm
          if-no-files-found: error
          retention-days: 3

  # For every PR: run try-runtime's on-runtime-upgrade checks against the
  # current state of each live network, using the shared wasm artifact and the
  # prebuilt try-runtime-cli — no Rust toolchain on these runners.
  try-runtime:
    name: try-runtime ${{ matrix.network.name }}
    needs: build
    runs-on: ${{ matrix.network.runner }}
    permissions:
      contents: read
      # Cross-run artifact download (the nightly try-runtime state snapshot).
      actions: read
    strategy:
      fail-fast: false
      matrix:
        network:
          # NOTE: the hostnames are misleading — archive.dev.opentensor.ai
          # serves the TESTNET archive on :8443 and the MAINNET archive on
          # :443 (verified by genesis hash; try-runtime wants archive nodes,
          # which is why we don't use the entrypoint hostnames). The
          # "Verify endpoint" step below enforces each URI's identity.
          - name: devnet
            uri: wss://dev.chain.opentensor.ai:443
            genesis: "0x077899043eb684c5277b6814a39161f4ce072b45e782e12c81a521c63fb4f3e5"
            runner: [self-hosted, fireactions-tryruntime]
          - name: testnet
            uri: wss://archive.dev.opentensor.ai:8443
            genesis: "0x8f9cf856bf558a14440e75569c9e58594757048d7b3a84b5d25f6bd978263105"
            runner: [self-hosted, fireactions-tryruntime]
          # Keep endpoint-heavy checks near the archive RPCs. Measurements
          # from BHS showed materially higher per-request latency, which
          # compounds during try-runtime's state traversal.
          - name: mainnet
            uri: wss://archive.dev.opentensor.ai:443
            genesis: "0x2f0555cc76fc2840a25a6ea3b9637146806f1f44b090c175ffde2a7e5ab36c03"
            runner: [self-hosted, fireactions-tryruntime]
    steps:
      - name: Verify endpoint serves the expected network
        run: |
          http_uri="${{ matrix.network.uri }}"
          http_uri="${http_uri/wss:/https:}"
          genesis=$(curl -sS -m 30 -H 'Content-Type: application/json' \
            -d '{"id":1,"jsonrpc":"2.0","method":"chain_getBlockHash","params":[0]}' \
            "$http_uri" | sed -n 's/.*"result":"\(0x[0-9a-f]*\)".*/\1/p')
          echo "endpoint genesis: $genesis"
          if [ "$genesis" != "${{ matrix.network.genesis }}" ]; then
            echo "::error::${{ matrix.network.name }} endpoint $http_uri serves genesis $genesis, expected ${{ matrix.network.genesis }}"
            exit 1
          fi

      - name: Download runtime wasm
        uses: actions/download-artifact@v4
        with:
          name: try-runtime-wasm
          path: runtime-blob

      - name: Download try-runtime-cli v0.10.1
        run: |
          TRY_RUNTIME_BIN="$RUNNER_TEMP/try-runtime"
          curl --fail --silent --show-error --location \
            "https://github.com/paritytech/try-runtime-cli/releases/download/v0.10.1/try-runtime-x86_64-unknown-linux-musl" \
            --output "$TRY_RUNTIME_BIN"
          chmod +x "$TRY_RUNTIME_BIN"
          echo "TRY_RUNTIME_BIN=$TRY_RUNTIME_BIN" >> "$GITHUB_ENV"

      # State scraping dominates this job's wall clock (30-40 min for mainnet).
      # The nightly refresh-mainnet-snapshot workflow publishes a .snap per
      # network; replaying against it is minutes instead. Same trust rule as
      # the clone snapshot: only artifacts produced on the default branch.
      # The .snap format is coupled to the try-runtime-cli release, so the
      # producer and this job must pin the same version.
      - name: Restore try-runtime state snapshot
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'fresh-try-runtime-state') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh api prints the JSON error body to stdout on 404, so validate
          # the id shape rather than trusting non-empty output.
          run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-mainnet-snapshot.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No snapshot run available; falling back to a live scrape."
            exit 0
          fi
          # No checkout in this job, so gh cannot infer the repository.
          if ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n "try-runtime-snap-${{ matrix.network.name }}" -D snap; then
            echo "Snapshot download failed (expired or that network's scrape failed); falling back to a live scrape."
            exit 0
          fi
          echo "Restored ${{ matrix.network.name }}.snap from run $run_id."
          echo "TRY_RUNTIME_SNAP=snap/${{ matrix.network.name }}.snap" >> "$GITHUB_ENV"

      - name: Check migrations
        env:
          NODE_URI: ${{ matrix.network.uri }}
        run: |
          export RUST_LOG=remote-ext=debug,runtime=debug
          if [ -n "${TRY_RUNTIME_SNAP:-}" ]; then
            state=(snap --path "$TRY_RUNTIME_SNAP")
          else
            state=(live --uri "$NODE_URI")
          fi
          "$TRY_RUNTIME_BIN" \
            --runtime runtime-blob/node_subtensor_runtime.compact.compressed.wasm \
            on-runtime-upgrade \
            --checks=all \
            --blocktime 12000 \
            --disable-spec-version-check --no-weight-warnings \
            "${state[@]}"

  # Runtime-affecting PRs must carry a spec_version newer than what mainnet is
  # running — otherwise the release train will build the merge and then no-op
  # at every deploy guard. Label a PR `no-spec-version-bump` when the change
  # deliberately ships without a runtime release. No compilation: the local
  # value is the literal in runtime/src/lib.rs (grep fails loudly unless it
  # matches exactly once) and mainnet's comes from one RPC call.
  spec-version:
    name: spec_version newer than mainnet
    needs: [trusted-pr, changes]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-spec-version-bump') && (github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare against mainnet
        run: |
          set -euo pipefail
          matches=$(grep -cE '^\s*spec_version: [0-9]+,' runtime/src/lib.rs)
          if [ "$matches" -ne 1 ]; then
            echo "::error::expected exactly one 'spec_version: <n>,' literal in runtime/src/lib.rs, found $matches"
            exit 1
          fi
          local_spec=$(grep -oE '^\s*spec_version: [0-9]+,' runtime/src/lib.rs | grep -oE '[0-9]+')
          chain_spec=$(curl -sS -m 30 -H 'Content-Type: application/json' \
            -d '{"id":1,"jsonrpc":"2.0","method":"state_getRuntimeVersion","params":[]}' \
            "$MAINNET_RPC" | jq -er '.result.specVersion')
          echo "mainnet spec_version: $chain_spec"
          echo "local spec_version:   $local_spec"
          if [ "$local_spec" -le "$chain_spec" ]; then
            echo "spec_version must be bumped above mainnet's, or label the PR 'no-spec-version-bump'."
            exit 1
          fi

  # Ruff, ty, pytest, and the codegen checks need no chain and no Rust
  # artifact; running them inside clone-upgrade serialized minutes of Python
  # checks behind a multi-GB chainspec genesis init. The docs drift gate that
  # also lived there is covered by docs-website (its path filter includes
  # sdk/python/, the only input that can move the generated pages).
  sdk-checks:
    name: SDK offline checks
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true'
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: SDK offline checks (same as just check)
        working-directory: sdk/python
        run: |
          uv sync --locked --all-extras --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check --exit-zero-on-warning bittensor
          uv run pytest
          uv run python -m codegen.check --coverage
          uv run python -m codegen.check --names

  # For every PR: sudo-upgrade a local clone of mainnet with the proposed
  # runtime, then run the clone regression suite, the SDK metadata drift gate,
  # and the SDK e2e suite against the upgraded chain. Consumes the
  # node-release artifact instead of building, and restores the nightly
  # mainnet-snapshot artifact instead of re-scraping mainnet state (falls back
  # to a live scrape when no snapshot exists or the `fresh-mainnet-clone`
  # label is set). Auto-skips (via the `build` need) when the PR touches
  # nothing runtime-relevant.
  #
  # The regression tests are wall-clock-bound (they wait on 12-second blocks)
  # and mutate chain state, so they can't share one node concurrently.
  # Instead each shard boots its own clone from the snapshot and runs a
  # subset, preserving the suite's original relative order within each shard.
  clone-upgrade:
    name: clone-upgrade (${{ matrix.shard.name }})
    needs: [trusted-pr, changes, build]
    runs-on: [self-hosted, fireactions-turbo-8]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-clone-upgrade') }}
    timeout-minutes: 90
    permissions:
      contents: read
      # Cross-run artifact download (the nightly mainnet snapshot).
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: balancer
            tests: >-
              test-balancer-operation.ts
              test-balancer-edge-emission-issuance.ts
            sdk: false
          - name: locks
            tests: >-
              test-locks-conviction.ts
              test-lock-dust-cleanup.ts
              test-proxy-filter-security-regressions.ts
            sdk: false
          - name: stake-sdk
            tests: >-
              test-hotkey-swap-and-proxy-stake.ts
              test-net-tao-flow-emission-allocation.ts
              test-total-issuance-trackers.ts
              test-alpha-deprecated-stake-histogram.ts
            sdk: true
    steps:
      - uses: actions/checkout@v4

      - name: Download release node + runtime wasm
        uses: actions/download-artifact@v4
        with:
          name: node-release
          path: target/release

      - name: Make node binary executable
        run: chmod +x target/release/node-subtensor

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore mainnet snapshot
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'fresh-mainnet-clone') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only trust snapshots produced on the default branch — schedule and
          # dispatch runs of refresh-mainnet-snapshot execute main's code, so
          # a PR can never poison the snapshot another PR consumes.
          # gh api prints the JSON error body to stdout on 404 (e.g. before
          # the snapshot workflow ever ran on main), so validate the id shape
          # rather than trusting non-empty output.
          run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-mainnet-snapshot.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No snapshot available; falling back to a live mainnet scrape."
            exit 0
          fi
          if ! gh run download "$run_id" -n mainnet-snapshot -D /tmp/mainnet-snapshot; then
            echo "Snapshot download failed (likely expired); falling back to a live scrape."
            exit 0
          fi
          tar -xzf /tmp/mainnet-snapshot/mainnet-snapshot.tar.gz
          rm -rf /tmp/mainnet-snapshot
          echo "Restored snapshot from run $run_id."
          # Tells start-local-clone.sh to keep the pre-initialized database
          # instead of wiping it and re-running genesis init.
          echo "KEEP_CLONE_DATA=1" >> "$GITHUB_ENV"

      - name: Create mainnet clone
        # No-op when the snapshot restored the chainspec; otherwise scrapes
        # mainnet state live (first run, expired snapshot, or the
        # fresh-mainnet-clone label). The live scrape's warp sync sometimes
        # wedges downloading finality proofs (stuck at 0.00 MiB for an hour+,
        # observed repeatedly); a healthy scrape finishes in ~15 minutes, so
        # kill and retry — a fresh node picks new peers and unsticks. The
        # script self-cleans partial state when the chainspec is missing.
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=30 1200 ./clones/scripts/clone-mainnet.sh; then
              exit 0
            fi
            echo "::warning::mainnet scrape attempt ${attempt} timed out or failed; retrying"
            # timeout only signals the script; reap its orphaned sync node so
            # the retry can rebind ports and reuse the base path.
            pkill -9 -f build-patched-spec || true
            sleep 10
          done
          exit 1

      - name: Start local clone
        run: |
          nohup ./clones/scripts/start-local-clone.sh > clone-node.log 2>&1 &
          # Genesis init from the ~2 GB mainnet-clone chainspec takes several
          # minutes before the RPC server comes up, so allow up to 15 minutes.
          # (With a restored snapshot the db is pre-initialized and this is
          # nearly instant.)
          for i in $(seq 1 450); do
            if curl -sf -H "Content-Type: application/json" \
              -d '{"id":1,"jsonrpc":"2.0","method":"system_health","params":[]}' \
              http://127.0.0.1:9944 > /dev/null; then
              echo "Clone node is up."
              exit 0
            fi
            sleep 2
          done
          echo "Clone node failed to start:"
          cat clone-node.log
          exit 1

      - name: Sudo-upgrade clone with proposed runtime
        working-directory: clones/js-tests
        run: |
          npm ci
          # Right after genesis the node occasionally rejects the first
          # extrinsic with "bad signature" (observed: 1 of 3 shards failed at
          # +8s while the identical tx succeeded on the others seconds later).
          # Setting the same runtime code twice is idempotent, so retry once.
          npm run runtime:update:alice || { sleep 15; npm run runtime:update:alice; }

      - name: Run clone smoke tests
        working-directory: clones/js-tests
        run: npm test

      - name: Run clone regression tests (shard subset)
        working-directory: clones/js-tests
        env:
          CLONE_REGRESSION_TESTS: ${{ matrix.shard.tests }}
          # test-total-issuance-trackers legitimately waits minutes for the
          # queued replacement registration: register_network at the subnet
          # limit prunes a subnet and only emits NetworkAdded from on_idle
          # after the pruned subnet's chunked storage cleanup finishes
          # (~6 min on mainnet-scale state).
          CLONE_REGRESSION_TIMEOUT_MS: ${{ matrix.shard.name == 'stake-sdk' && '1800000' || '900000' }}
        run: npm run test:clone-regressions

      - name: Install uv
        if: ${{ matrix.shard.sdk }}
        run: |
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync SDK environment
        if: ${{ matrix.shard.sdk }}
        working-directory: sdk/python
        run: uv sync --locked --all-extras --dev

      - name: Metadata drift gate (committed _generated vs upgraded clone)
        if: ${{ matrix.shard.sdk }}
        working-directory: sdk/python
        run: uv run python -m codegen.check --drift ${{ env.WS_ENDPOINT }}

      - name: Prepare clone for the localnet-tuned e2e suite
        # Sudo-neutralize the mainnet-state assumptions the e2e suite trips
        # over (network rate limit, subnet limit, lock-cost doubling, unfunded
        # //Bob); see the script docstring for the full rationale.
        if: ${{ matrix.shard.sdk }}
        working-directory: sdk/python
        run: uv run python scripts/prepare_clone_for_e2e.py ${{ env.WS_ENDPOINT }}

      - name: SDK e2e tests against upgraded clone
        if: ${{ matrix.shard.sdk }}
        working-directory: sdk/python
        env:
          E2E_ENDPOINT: ws://127.0.0.1:9944
        # Deliberately a subset: reads, error decoding, and the intent sweep
        # (every registered intent plans against the live upgraded runtime).
        # The full write-path suite already runs on localnet in the Bittensor
        # E2E workflow; on the clone's production runtime each write waits for
        # 12-second-block finalization, which would blow the job timeout.
        run: >-
          uv run pytest -m e2e
          tests/e2e/test_reads.py
          tests/e2e/test_errors.py
          tests/e2e/test_intent_sweep.py

      - name: Dump clone node and harness logs
        if: failure()
        run: |
          echo "===== clone-node.log (last 200 lines) ====="
          tail -n 200 clone-node.log 2>/dev/null || echo "(missing)"
          for f in clones/js-tests/temp/*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done

      - name: Stop local clone
        if: always()
        run: ./clones/scripts/stop-local-clone.sh

  # Branch protection requires a check named exactly "Sudo-upgrade mainnet
  # clone and test"; the shard matrix above produces differently-named jobs,
  # so this fan-in preserves the required-check name. Passes when every shard
  # succeeded, or when the whole suite legitimately skipped (docs-only PR or
  # the skip-clone-upgrade label). Anything else — including a build failure
  # cascading into skipped shards — fails.
  clone-upgrade-gate:
    name: Sudo-upgrade mainnet clone and test
    needs: [changes, build, clone-upgrade]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate shard results
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.clone-upgrade.result }}
          BUILD: ${{ needs.build.result }}
          LABEL_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-clone-upgrade') }}
        run: |
          echo "changes=$CHANGES shards=$SHARDS build=$BUILD label-skip=$LABEL_SKIP"
          # A failed path-filter job must not read as "nothing runtime-related
          # changed" — that would let build+shards skip and the gate pass.
          if [ "$CHANGES" != "success" ]; then
            exit 1
          fi
          if [ "$SHARDS" = "success" ]; then
            exit 0
          fi
          if [ "$SHARDS" = "skipped" ] && { [ "$LABEL_SKIP" = "true" ] || [ "$BUILD" = "skipped" ]; }; then
            exit 0
          fi
          exit 1

  docs-website:
    name: Docs and website build
    needs: [trusted-pr, changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: [self-hosted, fireactions-turbo-8]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Docs drift gate (generated tx/query/errors pages)
        working-directory: sdk/python
        run: |
          uv sync --locked --all-extras --dev
          uv run python ../../website/apps/bittensor-website/scripts/generate.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Build docs site
        working-directory: website
        run: |
          yarn install --immutable
          yarn turbo run build --filter=@raofoundation/bittensor-website
