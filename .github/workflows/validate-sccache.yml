name: Validate sccache integration

on:
  pull_request:
    paths:
      - ".github/actions/rust-setup/**"
      - ".github/actions/sccache-setup/**"
      - ".github/scripts/sccache-configure.sh"
      - ".github/scripts/test-sccache-configure.sh"
      - ".github/scripts/download-artifact.sh"
      - ".github/scripts/test-download-artifact.sh"
      - ".github/scripts/prewarm-exact-runtime.sh"
      - ".github/scripts/test-prewarm-exact-runtime.sh"
      - ".github/scripts/benchmark-sccache-paired.sh"
      - ".github/scripts/benchmark-artifact-cache.sh"
      - ".github/scripts/r2-artifact-mirror.py"
      - ".github/scripts/publish-artifact-mirror.sh"
      - ".github/scripts/test-r2-artifact-mirror.py"
      - ".github/scripts/snapshot-artifact.sh"
      - ".github/scripts/test-snapshot-artifact.sh"
      - ".github/workflows/check-bittensor-e2e-tests.yml"
      - ".github/workflows/check-node-compat.yml"
      - ".github/workflows/mainnet-clone-preview.yml"
      - ".github/workflows/runtime-checks.yml"
      - ".github/workflows/sccache-warm.yml"
      - ".github/workflows/typescript-e2e.yml"
      - ".github/workflows/validate-sccache.yml"
  workflow_dispatch:
    inputs:
      benchmark_host_cache:
        description: "Run paired cache benchmarks on the turbo-8 production pool"
        type: boolean
        default: false
      benchmark_artifact_cache:
        description: "Include the large GitHub artifact comparison"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test-config-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Test fail-open and writer event gates
        run: .github/scripts/test-sccache-configure.sh

      - name: Test immutable artifact selection and download boundary
        run: |
          .github/scripts/test-snapshot-artifact.sh
          .github/scripts/test-download-artifact.sh
          .github/scripts/test-r2-artifact-mirror.py

      - name: Check benchmark and prewarm script syntax
        run: |
          .github/scripts/test-prewarm-exact-runtime.sh
          bash -n .github/scripts/benchmark-sccache-paired.sh
          bash -n .github/scripts/benchmark-artifact-cache.sh

  prewarm-exact-runtime:
    name: prewarm exact Rust keys
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: sccache-writer
      deployment: false
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure protected direct-R2 writer
        uses: ./.github/actions/rust-setup
        with:
          cache-key: exact-runtime-prewarm
          sccache-credential-mode: writer
          sccache-local-tier: disabled
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}

      - name: Populate exact keys and verify the second clean check hits R2
        run: .github/scripts/prewarm-exact-runtime.sh

  benchmark-sccache-paired:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark_host_cache
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure direct R2 sccache baseline
        uses: ./.github/actions/rust-setup
        with:
          cache-key: host-cache-benchmark-paired
          sccache-local-tier: disabled

      - name: Measure paired origin and warm-local reads in one VM
        env:
          SKIP_WASM_BUILD: 1
        run: .github/scripts/benchmark-sccache-paired.sh

  benchmark-artifact-cache:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.benchmark_host_cache &&
      inputs.benchmark_artifact_cache
    needs: benchmark-sccache-paired
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select latest trusted mainnet clone snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/snapshot-artifact.sh select \
            mainnet-snapshot main "${{ github.repository_id }}" \
            .github/workflows/refresh-mainnet-snapshot.yml 168 \
            "$GITHUB_OUTPUT" required

      - name: Measure direct, local-cold, and local-warm artifact downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ARTIFACT_ID: ${{ steps.snapshot.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.snapshot.outputs.artifact-digest }}
          ARTIFACT_SIZE: ${{ steps.snapshot.outputs.artifact-size-bytes }}
        run: .github/scripts/benchmark-artifact-cache.sh
