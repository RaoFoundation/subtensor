name: Typescript E2E Tests

on:
  pull_request:

concurrency:
  group: typescript-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  automation-approved:
    uses: ./.github/workflows/dependabot-ci-approval.yml

  trusted-pr:
    name: Trusted PR source (non-fork)
    needs: automation-approved
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  # typescript-formatting is a required merge check, so the workflow must
  # always trigger and that job always runs (it is cheap). The expensive node
  # builds and zombienet suites skip themselves when the PR touches nothing
  # they exercise; `skipped` satisfies branch protection.
  changes:
    name: detect e2e-relevant changes
    needs: automation-approved
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # Plain gh-api file listing instead of a marketplace action: the org's
      # Actions allowlist rejects unlisted third-party actions (startup_failure).
      - name: Filter changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          # SDK-only lockfile movement is covered by SDK checks; do not run
          # zombienet unless chain/runtime or ts-tests inputs changed.
          pattern='^(ts-tests|common|node|pallets|precompiles|primitives|runtime|support|chain-extensions|src|vendor)/|^(Cargo\.toml|build\.rs|rust-toolchain\.toml)$|^\.github/(workflows/typescript-e2e\.yml|actions/(run-typescript-e2e|rust-setup|sccache-setup)/|scripts/sccache-configure\.sh$)'
          if grep -qE "$pattern" <<< "$files"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "no e2e-relevant paths changed"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  typescript-formatting:
    needs: automation-approved
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `typescript-formatting` is required on main. Keep it red while the
      # reusable approval job is blocked; otherwise GitHub treats a job
      # skipped through `needs` as satisfying branch protection.
      - name: Enforce automated-PR approval
        if: needs.automation-approved.result != 'success'
        run: |
          echo "::error::Automated PR CI has not been approved."
          exit 1

      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ts-tests/.nvmrc

      - name: Validate E2E configuration
        run: node ts-tests/scripts/validate-e2e-config.mjs

      - name: Install e2e dependencies
        working-directory: ts-tests
        run: pnpm install --frozen-lockfile

      - name: Formatting check
        run: |
          cd ts-tests
          pnpm run fmt

  # Build the node binary in both variants and share as artifacts.
  build:
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: sccache-writer
      deployment: false
    needs: [trusted-pr, changes]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - variant: release
            flags: ""
          - variant: fast
            flags: "--features fast-runtime"
    env:
      RUST_BACKTRACE: full
    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Rust build environment
        uses: ./.github/actions/rust-setup
        with:
          cache-key: e2e-${{ matrix.variant }}
          fast-linker: "false"
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}

      - name: Build node-subtensor (${{ matrix.variant }})
        run: cargo build --profile release ${{ matrix.flags }} -p node-subtensor

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-subtensor-${{ matrix.variant }}
          path: target/release/node-subtensor
          if-no-files-found: error

  # State-focused suites do not exercise multi-validator consensus. They use a
  # single immediately-finalized node; Shield retains the production-like
  # multi-node topology below. Two workers here plus three Shield workers peak
  # at five self-hosted runners while the E2E phase is active.
  run-e2e-tests:
    needs: [trusted-pr, build]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - test: zombienet_evm
            binary: fast
          - test: zombienet_staking
            binary: fast
          - test: zombienet_coldkey_swap
            binary: fast
          - test: dev
            binary: release
          - test: zombienet_subnets
            binary: fast

    name: "typescript-e2e-${{ matrix.test }}"

    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run E2E suite
        uses: ./.github/actions/run-typescript-e2e
        with:
          binary: ${{ matrix.binary }}
          test: ${{ matrix.test }}

  # Shield validates consensus, key rotation, timing, and transaction
  # mortality, so preserve its six-node release topology and parallelize only
  # by running measured-time-balanced file groups on independent networks.
  run-shield-tests:
    needs: [trusted-pr, build]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: [zombienet_shield_a, zombienet_shield_b, zombienet_shield_c]
    name: "typescript-e2e-${{ matrix.test }}"
    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Shield shard
        uses: ./.github/actions/run-typescript-e2e
        with:
          binary: release
          test: ${{ matrix.test }}

  shield-result:
    name: typescript-e2e-zombienet_shield
    if: always()
    needs: [build, run-shield-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check Shield shard results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SHIELD_RESULT: ${{ needs.run-shield-tests.result }}
        run: |
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" || \
                "$SHIELD_RESULT" == "failure" || "$SHIELD_RESULT" == "cancelled" ]]; then
            echo "Shield E2E prerequisites failed: build=$BUILD_RESULT shards=$SHIELD_RESULT" >&2
            exit 1
          fi
