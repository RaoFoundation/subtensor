name: Typescript E2E Tests

on:
  pull_request:

concurrency:
  group: typescript-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  # typescript-formatting is a required merge check, so the workflow must
  # always trigger and that job always runs (it is cheap). The expensive node
  # builds and zombienet suites skip themselves when the PR touches nothing
  # they exercise; `skipped` satisfies branch protection.
  changes:
    name: detect e2e-relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # Plain gh-api file listing instead of a marketplace action: the org's
      # Actions allowlist rejects unlisted third-party actions (startup_failure).
      - name: Filter changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          # SDK-only lockfile movement is covered by SDK checks; do not run
          # zombienet unless chain/runtime or ts-tests inputs changed.
          pattern='^(ts-tests|common|node|pallets|precompiles|primitives|runtime|support|chain-extensions|src|vendor)/|^(Cargo\.toml|build\.rs|rust-toolchain\.toml)$|^\.github/workflows/typescript-e2e\.yml$'
          if grep -qE "$pattern" <<< "$files"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "no e2e-relevant paths changed"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  typescript-formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ts-tests/.nvmrc

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang curl git make libssl-dev llvm libudev-dev protobuf-compiler pkg-config

      - name: Install e2e dependencies
        working-directory: ts-tests
        run: pnpm install --frozen-lockfile

      - name: Formatting check
        run: |
          cd ts-tests
          pnpm run fmt

  # Build the node binary in both variants and share as artifacts.
  build:
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: sccache-writer
      deployment: false
    needs: [trusted-pr, typescript-formatting, changes]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - variant: release 
            flags: ""
          - variant: fast
            flags: "--features fast-runtime"
    env:
      RUST_BACKTRACE: full
    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang curl git make libssl-dev llvm libudev-dev protobuf-compiler pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Shared R2 compiler cache
        uses: ./.github/actions/sccache-setup
        with:
          credential-mode: auto
          writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}

      - name: Cache Cargo registry and git data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: e2e-${{ matrix.variant }}
          cache-on-failure: true
          cache-targets: false

      - name: Build node-subtensor (${{ matrix.variant }})
        run: cargo build --profile release ${{ matrix.flags }} -p node-subtensor

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-subtensor-${{ matrix.variant }}
          path: target/release/node-subtensor
          if-no-files-found: error

  run-e2e-tests:
    needs: [trusted-pr, build]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - test: dev
            binary: release
          - test: zombienet_shield
            binary: release
          - test: zombienet_staking
            binary: fast
          - test: zombienet_coldkey_swap
            binary: fast
          - test: zombienet_subnets
            binary: fast
          - test: zombienet_evm
            binary: fast

    name: "typescript-e2e-${{ matrix.test }}"

    steps:
      - name: Check-out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-subtensor-${{ matrix.binary }}
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/node-subtensor

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ts-tests/.nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install e2e dependencies
        working-directory: ts-tests
        run: pnpm install --frozen-lockfile

      - name: Install lsof (dev foundation RPC port discovery)
        if: matrix.test == 'dev'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends lsof

      - name: Run tests
        run: |
          cd ts-tests
          pnpm moonwall test ${{ matrix.test }}
