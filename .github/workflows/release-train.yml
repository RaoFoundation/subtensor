name: Release Train

# Build-once promotion pipeline. One deterministic srtool build is promoted
# through the networks, gated by live smoke checks and environment approvals:
#
#   push to main
#     ├─ build wasm once (srtool)
#     │    └─ deploy devnet ── smoke-check devnet
#     │         └─ deploy testnet ── smoke-check testnet ── publish SDK rc
#     └─ (after the srtool build) plan stable Python ── build stable dist
#
#   one `mainnet` approval starts three jobs together:
#     ├─ propose mainnet upgrade (CI half of the deployment multisig)
#     ├─ wait until mainnet runs this wasm ── publish stable Python to PyPI
#     └─ wait until mainnet runs this wasm ── deploy production docs
#
# Branch mirrors: after each successful deploy the `devnet`/`testnet` branch
# is force-updated to the deployed commit, so those branches always contain
# the code running on the respective chain. The `mainnet` branch is updated
# by watch-mainnet-release.yml once the multisig executes on chain.
# Moving a network mirror triggers both Docker publishers, updating the
# matching tags in the regular `subtensor` and `subtensor-localnet` packages.
# Those branches are locked by the "network-branch-mirrors (CI only)"
# repository ruleset; the only bypass actor is the network-branch-mirror-ci
# deploy key (secret MIRROR_DEPLOY_KEY), so the mirror pushes go over SSH.
#
# Properties:
#   - the runtime is built exactly once per train; promotion is a setCode
#     extrinsic + a smoke suite, not a rebuild
#   - the ship lever is the spec_version bump: merges without a bump build
#     and then no-op at every deploy guard
#   - human gates live in environment settings, not in this file: `devnet`
#     has no required reviewers (automatic), `testnet`/`mainnet` gates are
#     whatever reviewers are configured on those environments
#   - trains queue (no cancel): a stale train no-ops at each deploy because
#     of the spec_version guard
#
# One mainnet approval. GitHub asks for a new approval for every job that
# reaches a protected environment after the click, so everything that needs
# `mainnet` credentials is a job that becomes ready at the same moment as
# propose-mainnet: they share one `needs` list and one approval releases them
# together. The stable Python dist is built beside devnet/testnet, in jobs
# with no environment and no id-token, and is not a dependency of the
# proposal, so a Python failure neither blocks nor re-runs propose-mainnet.
# The two publishing jobs wait inside the approved job until the triumvirate
# executes the multisig and the finalized runtime is this train's exact wasm
# under the immutable v<spec> tag (await-mainnet-enactment.sh). They stop
# without publishing when mainnet moves past this spec or main carries a
# newer one, and fail after 20 hours so a stuck release is visible.
#
# A late upgrade never makes publishing impossible. When the runtime goes
# live and these jobs are no longer on it (they gave up, stopped for a newer
# spec, or failed), the scheduled watch-mainnet-release.yml run that
# finalizes the release asks for the PyPI and docs approval itself, exactly
# as before this train published. Also, once the runtime is live:
#   - dispatch watch-mainnet-release.yml: rebuilds from the v<spec> tag and
#     publishes, for as long as that runtime is the one on mainnet; or
#   - re-run this run's failed jobs: within GitHub's 30-day re-run window
#     (the stable dist is kept as long), when no newer train is running.
# Each asks for one fresh `mainnet` approval; re-run publishing jobs start
# together, so one click covers PyPI and docs.
#
# The whole run, including the wait, holds the release-train concurrency
# group, so a newer train queues until this runtime is live. That is why the
# wait gives up as soon as main carries a newer spec_version.
#
# After the multisig executes on chain, watch-mainnet-release.yml cuts the
# release without another approval: mainnet mirror (and with it the mainnet
# Docker images) and GitHub release.
#
# Discord (secret DISCORD_WEBHOOK_URL on mainnet and mainnet-release only):
# one post when this train's propose job submits a mainnet upgrade, one from
# the watcher when that upgrade is live, and one from this train when stable
# PyPI succeeds. ANNOUNCE_OPENAI_API_KEY, on those same two environments,
# may rewrite only the prose section from the committed summary. Versions,
# hashes, install commands, and links stay in the template. A rejected or
# failed rewrite posts the human summary. There is no post for devnet,
# testnet, rc, or TestPyPI. A missing notes file blocks propose-mainnet.
# Spec 492 and the Python versions committed with it are grandfathered
# because they have no release page.

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "pallets/**"
      - "node/**"
      - "primitives/**"
      - "precompiles/**"
      - "common/**"
      - "Cargo.lock"
  # Restarting a train mid-way = re-run failed jobs on the existing run
  # (the artifact is still attached); workflow_dispatch starts a fresh train.
  workflow_dispatch:

concurrency:
  group: release-train
  cancel-in-progress: false # trains queue; guards make stale trains no-op

env:
  DEVNET_WS: wss://dev.chain.opentensor.ai:443
  TESTNET_WS: wss://test.finney.opentensor.ai:443
  MAINNET_WS: wss://entrypoint-finney.opentensor.ai:443
  MAINNET_HTTP: https://entrypoint-finney.opentensor.ai:443

jobs:
  # ------------------------------------------------------------------
  # Stage 0: build the runtime once, deterministically.
  # ------------------------------------------------------------------
  build:
    name: Srtool build (once per train)
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 120
    outputs:
      spec_version: ${{ steps.spec.outputs.spec_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read spec_version
        id: spec
        run: |
          spec=$(grep -Eo 'spec_version: *[0-9]+' runtime/src/lib.rs | head -n 1 | grep -Eo '[0-9]+')
          : ${spec:?could not parse spec_version}
          echo "spec_version=$spec" >> $GITHUB_OUTPUT

      - name: Build srtool image
        run: ./scripts/srtool/build-srtool-image.sh

      - name: Srtool build (deterministic, metadata-hash)
        run: |
          cd runtime && [ -L node-subtensor ] || ln -s . node-subtensor && cd ..
          docker run --rm --user root --platform=linux/amd64 \
            -e PACKAGE=node-subtensor-runtime \
            -e BUILD_OPTS="--features=metadata-hash" \
            -e PROFILE=production \
            -e CONST_RANDOM_SEED=subtensor-runtime \
            -v "$HOME/.cargo":/cargo-home \
            -v "$(pwd)":/build \
            srtool bash -c "git config --global --add safe.directory /build && \
              /srtool/build --app > /build/runtime/node-subtensor/srtool-output.log; \
              code=\$?; [ \$code -ne 0 ] && cat /build/runtime/node-subtensor/srtool-output.log && exit \$code; \
              tail -n 1 /build/runtime/node-subtensor/srtool-output.log > /build/runtime/node-subtensor/subtensor-digest.json"

      - name: Collect artifact
        run: |
          mkdir -p wasm
          wasm_path=$(find runtime -name 'node_subtensor_runtime.compact.compressed.wasm' -path '*srtool*' | head -n 1)
          : ${wasm_path:?srtool wasm not found}
          cp -v "$wasm_path" wasm/subtensor.wasm
          cp -v runtime/subtensor-digest.json wasm/subtensor-digest.json

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ steps.spec.outputs.spec_version }}
          path: wasm/
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------
  # Stage 1: devnet — automatic.
  # ------------------------------------------------------------------
  deploy-devnet:
    name: Deploy devnet
    needs: build
    runs-on: [self-hosted, fireactions-turbo-8]
    environment: devnet # no required reviewers → automatic
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ needs.build.outputs.spec_version }}
          path: wasm

      # Guard: skip (successfully) if the chain already runs >= this spec.
      # This is what makes queued/stale trains no-op instead of failing.
      - name: Check whether an upgrade is needed
        id: guard
        run: |
          chain=$(curl -sf -H "Content-Type: application/json" \
            -d '{"id":1,"jsonrpc":"2.0","method":"state_getRuntimeVersion","params":[]}' \
            "https://dev.chain.opentensor.ai" | jq -r '.result.specVersion')
          : ${chain:?could not fetch devnet spec_version}
          if [ "${{ needs.build.outputs.spec_version }}" -gt "$chain" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "devnet already on $chain; skipping."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install without the deploy seed in scope and with install scripts
      # disabled, so a malicious transitive dependency cannot run an install
      # hook that reads the sudo-capable chain key.
      - name: Install deploy deps
        if: steps.guard.outputs.should_deploy == 'true'
        working-directory: .github/scripts/deploy
        run: npm ci --ignore-scripts

      - name: Deploy
        if: steps.guard.outputs.should_deploy == 'true'
        working-directory: .github/scripts/deploy
        env:
          # Sudo-capable devnet deploy key, stored in the devnet environment.
          DEPLOY_SEED: ${{ secrets.DEVNET_DEPLOY_SEED }}
        run: |
          node deploy-wasm.js ${{ env.DEVNET_WS }} "$GITHUB_WORKSPACE/wasm/subtensor.wasm"

      - name: Verify on-chain spec_version
        if: steps.guard.outputs.should_deploy == 'true'
        run: |
          sleep 30
          chain=$(curl -sf -H "Content-Type: application/json" \
            -d '{"id":1,"jsonrpc":"2.0","method":"state_getRuntimeVersion","params":[]}' \
            "https://dev.chain.opentensor.ai" | jq -r '.result.specVersion')
          [ "$chain" = "${{ needs.build.outputs.spec_version }}" ] || { echo "devnet still on $chain"; exit 1; }

      # Mirror: the devnet branch always points at the code now running on
      # devnet. Its push event publishes both regular and localnet :devnet
      # images from this exact commit. The branch is ruleset-locked; only the
      # mirror deploy key may update it, so the push goes over SSH. Force push
      # because deploys are not fast-forwards of the previous mirror.
      - name: Point devnet branch at deployed commit
        if: steps.guard.outputs.should_deploy == 'true'
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          key_file=$(mktemp)
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > "$key_file"
          GIT_SSH_COMMAND="ssh -i $key_file -o StrictHostKeyChecking=accept-new" \
            git push --force "git@github.com:${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA:refs/heads/devnet"
          rm -f "$key_file"

  check-devnet:
    name: Smoke-check devnet
    needs: deploy-devnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ts-tests/.nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - name: Run devnet smoke suite
        working-directory: ts-tests
        run: |
          pnpm install --frozen-lockfile
          pnpm moonwall test smoke_devnet

  # ------------------------------------------------------------------
  # Stage 2: testnet — automatic once devnet is green.
  # ------------------------------------------------------------------
  deploy-testnet:
    name: Deploy testnet
    needs: [build, check-devnet]
    runs-on: [self-hosted, fireactions-turbo-8]
    # Gate is configured on the environment: required reviewers = one-click
    # promotion; no reviewers = automatic after devnet checks.
    environment: testnet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ needs.build.outputs.spec_version }}
          path: wasm
      - name: Check whether an upgrade is needed
        id: guard
        run: |
          chain=$(curl -sf -H "Content-Type: application/json" \
            -d '{"id":1,"jsonrpc":"2.0","method":"state_getRuntimeVersion","params":[]}' \
            "https://test.finney.opentensor.ai" | jq -r '.result.specVersion')
          : ${chain:?could not fetch testnet spec_version}
          if [ "${{ needs.build.outputs.spec_version }}" -gt "$chain" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "testnet already on $chain; skipping."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Node.js
        if: steps.guard.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deploy deps
        if: steps.guard.outputs.should_deploy == 'true'
        working-directory: .github/scripts/deploy
        run: npm ci --ignore-scripts

      - name: Deploy
        if: steps.guard.outputs.should_deploy == 'true'
        working-directory: .github/scripts/deploy
        env:
          DEPLOY_SEED: ${{ secrets.TESTNET_DEPLOY_SEED }}
        run: |
          node deploy-wasm.js ${{ env.TESTNET_WS }} "$GITHUB_WORKSPACE/wasm/subtensor.wasm"
      - name: Verify on-chain spec_version
        if: steps.guard.outputs.should_deploy == 'true'
        run: |
          sleep 30
          chain=$(curl -sf -H "Content-Type: application/json" \
            -d '{"id":1,"jsonrpc":"2.0","method":"state_getRuntimeVersion","params":[]}' \
            "https://test.finney.opentensor.ai" | jq -r '.result.specVersion')
          [ "$chain" = "${{ needs.build.outputs.spec_version }}" ] || { echo "testnet still on $chain"; exit 1; }

      - name: Point testnet branch at deployed commit
        if: steps.guard.outputs.should_deploy == 'true'
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          key_file=$(mktemp)
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > "$key_file"
          GIT_SSH_COMMAND="ssh -i $key_file -o StrictHostKeyChecking=accept-new" \
            git push --force "git@github.com:${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA:refs/heads/testnet"
          rm -f "$key_file"

  check-testnet:
    name: Smoke-check testnet
    needs: deploy-testnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ts-tests/.nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - name: Run testnet smoke suite
        working-directory: ts-tests
        run: |
          pnpm install --frozen-lockfile
          pnpm moonwall test smoke_testnet

  # Notes are required only when this build would propose a new mainnet spec.
  # A missing file stops the tag, the multisig, and the pre-release.
  check-runtime-notes:
    name: Check runtime release notes
    needs: [build, check-testnet]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require notes before a mainnet proposal
        env:
          SPEC: ${{ needs.build.outputs.spec_version }}
        run: |
          set -euo pipefail
          chain=$(curl -sf --connect-timeout 10 --max-time 30 \
            -H "Content-Type: application/json" \
            -d '{"id":1,"jsonrpc":"2.0","method":"state_getRuntimeVersion","params":[]}' \
            "https://entrypoint-finney.opentensor.ai" | jq -er '.result.specVersion')
          echo "built spec $SPEC; mainnet spec $chain"
          if [ "$SPEC" -gt "$chain" ]; then
            python3 .github/scripts/check-release-notes.py runtime --spec "$SPEC"
          else
            echo "built spec is not newer than mainnet; notes are not required."
          fi

  # SDK rc channel rides the train: publish after testnet is green
  # (replaces the publish-sdk-rc job in deploy-testnet.yml).
  #
  # Both packages get the same rcN suffix, computed once here so the wheel
  # matrix and the publish job stamp identical versions. The rc SDK pins
  # bittensor-core exactly (==<rc>): an rc pre-release can never win version
  # resolution against a published final (0.1.1rcN < 0.1.1), so a floor
  # constraint would silently resolve to the previous stable build.
  rc-versions:
    name: Compute rc versions
    needs: check-testnet
    runs-on: [self-hosted, fireactions-turbo-8]
    outputs:
      sdk: ${{ steps.versions.outputs.sdk }}
      core: ${{ steps.versions.outputs.core }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse base versions and append rc suffix
        id: versions
        run: |
          base=$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' sdk/python/pyproject.toml | head -n 1)
          : ${base:?could not parse base version from sdk/python/pyproject.toml}
          core_base=$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' sdk/bittensor-core-py/pyproject.toml | head -n 1)
          : ${core_base:?could not parse base version from sdk/bittensor-core-py/pyproject.toml}

          # PyPI versions are immutable. Reject an already-published stable
          # base before producing more release candidates that can never be
          # promoted to a final release.
          for package_version in "bittensor:${base}" "bittensor-core:${core_base}"; do
            package=${package_version%%:*}
            version=${package_version#*:}
            status=$(curl -sS --connect-timeout 10 --max-time 30 \
              -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/${package}/${version}/json")
            case "$status" in
              404) ;;
              200)
                echo "${package} ${version} is already published; bump the base version."
                exit 1
                ;;
              *)
                echo "PyPI availability check for ${package} ${version} returned HTTP ${status}."
                exit 1
                ;;
            esac
          done

          echo "sdk=${base}rc${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "core=${core_base}rc${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

  # The rc string is not a notes key. The check uses the stable base versions.
  # This does not post to Discord and does not block propose-mainnet.
  check-python-notes:
    name: Check Python release notes
    needs: rc-versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require notes for the stable versions behind this rc
        run: |
          set -euo pipefail
          versions=$(python3 .github/scripts/release-python-versions.py \
            sdk/python/pyproject.toml sdk/bittensor-core-py/pyproject.toml)
          python3 .github/scripts/check-release-notes.py python \
            --sdk "$(jq -er .sdk <<<"$versions")" \
            --core "$(jq -er .core <<<"$versions")"

  build-core-rc:
    name: Build bittensor-core rc wheels
    needs: rc-versions
    uses: ./.github/workflows/build-core-wheels.yml
    with:
      version: ${{ needs.rc-versions.outputs.core }}

  publish-sdk-rc:
    name: Publish SDK rc to PyPI
    needs: [rc-versions, build-core-rc, check-python-notes]
    runs-on: [self-hosted, fireactions-turbo-8]
    environment: testnet
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Set rc versions and pin native packages
        run: |
          sdk_version="${{ needs.rc-versions.outputs.sdk }}"
          core_version="${{ needs.rc-versions.outputs.core }}"
          sed -i "0,/^version = \".*\"/s//version = \"${sdk_version}\"/" sdk/python/pyproject.toml
          sed -i "s/\"bittensor-core>=[^\"]*\"/\"bittensor-core==${core_version}\"/" sdk/python/pyproject.toml
          grep -q "bittensor-core==${core_version}" sdk/python/pyproject.toml \
            || { echo "failed to pin bittensor-core in sdk/python/pyproject.toml"; exit 1; }
          echo "Publishing bittensor-core ${core_version} and bittensor ${sdk_version} to PyPI"
      - name: Download bittensor-core wheels
        uses: actions/download-artifact@v4
        with:
          pattern: core-dist-*
          path: dist
          merge-multiple: true
      - name: Build SDK wheel and sdist
        working-directory: sdk/python
        run: uv build --out-dir ../../dist
      # The pinned rc core must export every native helper sp_core needs,
      # both installed fresh and as an upgrade over an older published core.
      - name: Check SDK against its minimum bittensor-core
        run: .github/scripts/check-sdk-core-floor.sh dist
      # PEP 740 provenance: sign every dist with this job's OIDC identity
      # (must match the trusted publisher, so it runs here rather than in
      # build-core-wheels.yml). uv publish uploads the resulting
      # *.publish.attestation files alongside each dist.
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      # --check-url makes a re-run after a partial upload idempotent: files
      # already on the index are skipped instead of failing with a 400
      # duplicate (e.g. the SDK wheel landed but bittensor-core didn't).
      - name: Publish to PyPI
        run: |
          ls -la dist
          uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/ dist/*

  # ------------------------------------------------------------------
  # Stable Python for this runtime, built before the mainnet gate.
  # Runs beside devnet/testnet, in jobs with no environment and no
  # id-token, so code from this commit never runs where it could mint a
  # PyPI token. publish-python-on-enactment uploads the result once mainnet
  # runs this train's wasm. None of these jobs is a dependency of
  # propose-mainnet: a Python failure never blocks or re-runs the proposal.
  # ------------------------------------------------------------------
  stable-python-plan:
    name: Plan stable Python for this runtime
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      sdk: ${{ steps.plan.outputs.sdk }}
      core: ${{ steps.plan.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decide whether this runtime ships new stable packages
        id: plan
        env:
          SPEC: ${{ needs.build.outputs.spec_version }}
        run: |
          set -euo pipefail
          versions=$(python3 .github/scripts/release-python-versions.py \
            sdk/python/pyproject.toml sdk/bittensor-core-py/pyproject.toml)
          sdk=$(jq -er '.sdk' <<<"$versions")
          core=$(jq -er '.core' <<<"$versions")
          runtime=$(.github/scripts/mainnet-finalized-runtime.sh)
          chain=$(sed -n 's/^spec_version=//p' <<<"$runtime")
          : "${chain:?could not read the mainnet spec_version}"
          needed=false
          if [ "$SPEC" -le "$chain" ]; then
            echo "spec $SPEC is not newer than mainnet's $chain; this train publishes no stable Python."
          elif python3 .github/scripts/check-python-release.py \
              --sdk-version "$sdk" \
              --core-version "$core" \
              --repository "$GITHUB_REPOSITORY"; then
            echo "::warning::bittensor $sdk and bittensor-core $core are already on PyPI, so spec $SPEC ships no new stable Python. Bump the SDK base version."
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
            needed=true
          fi
          echo "spec $SPEC: stable bittensor $sdk, bittensor-core $core, needed=$needed"
          {
            echo "needed=$needed"
            echo "sdk=$sdk"
            echo "core=$core"
          } >> "$GITHUB_OUTPUT"
      - name: Require notes for the stable versions
        if: steps.plan.outputs.needed == 'true'
        env:
          SDK_VERSION: ${{ steps.plan.outputs.sdk }}
          CORE_VERSION: ${{ steps.plan.outputs.core }}
        run: |
          python3 .github/scripts/check-release-notes.py python \
            --sdk "$SDK_VERSION" --core "$CORE_VERSION"

  build-core-stable:
    name: Build bittensor-core stable wheels
    needs: stable-python-plan
    if: needs.stable-python-plan.outputs.needed == 'true'
    uses: ./.github/workflows/build-core-wheels.yml
    with:
      # build-core-rc already uploads core-dist-* in this run.
      artifact-prefix: core-stable-dist

  # publish-python-on-enactment looks this job up by name.
  build-sdk-stable:
    name: Build the stable SDK distribution
    needs: [stable-python-plan, build-core-stable]
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv 0.11.28
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ] || { echo "this job only installs the pinned x86_64 uv"; exit 1; }
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/uv"
          curl -fsSL -o "$RUNNER_TEMP/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.11.28/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP/uv"
          install -m 755 "$RUNNER_TEMP/uv/uv-x86_64-unknown-linux-gnu/uv" "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download bittensor-core wheels
        uses: actions/download-artifact@v4
        with:
          pattern: core-stable-dist-*
          path: dist
          merge-multiple: true

      - name: Prepare stable SDK distribution
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: python3 .github/scripts/prepare-sdk-dist.py

      - name: Build SDK wheel and sdist
        working-directory: sdk/python
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: uv build --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Verify stable artifacts
        env:
          EXPECTED_SDK_VERSION: ${{ needs.stable-python-plan.outputs.sdk }}
          EXPECTED_CORE_VERSION: ${{ needs.stable-python-plan.outputs.core }}
        run: |
          set -euo pipefail
          sdk_version=$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/python/pyproject.toml | head -n 1)
          core_version=$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/bittensor-core-py/pyproject.toml | head -n 1)
          : "${sdk_version:?could not parse stable SDK version}"
          : "${core_version:?could not parse stable core version}"
          [[ "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "SDK version is not stable: $sdk_version"; exit 1; }
          [[ "$core_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "core version is not stable: $core_version"; exit 1; }
          [ "$sdk_version" = "$EXPECTED_SDK_VERSION" ] \
            || { echo "SDK version $sdk_version != expected $EXPECTED_SDK_VERSION"; exit 1; }
          [ "$core_version" = "$EXPECTED_CORE_VERSION" ] \
            || { echo "core version $core_version != expected $EXPECTED_CORE_VERSION"; exit 1; }
          ls -la dist
          test -f "dist/bittensor-${sdk_version}-py3-none-any.whl"
          test -f "dist/bittensor-${sdk_version}.tar.gz"
          compgen -G "dist/bittensor_core-${core_version}-*.whl" >/dev/null
          test -f "dist/bittensor_core-${core_version}.tar.gz"

      - name: Check SDK against its minimum bittensor-core
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: .github/scripts/check-sdk-core-floor.sh dist

      # The publish job may start up to 20 hours later, once mainnet runs this
      # wasm, or on a re-run within GitHub's 30-day re-run window.
      - name: Upload the distribution
        uses: actions/upload-artifact@v4
        with:
          name: stable-python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # Stage 3: mainnet — the human gate, approved once.
  # Environment `mainnet` required reviewers = the "ok, deploy to mainnet"
  # click. The job then submits the CI half of the 2-of-2 deployment
  # multisig; the triumvirate approves out-of-band, and
  # watch-mainnet-release.yml cuts the release once it executes.
  # publish-python-on-enactment and deploy-docs-on-enactment below have the
  # same `needs`, so they wait for the same click; keep the three lists equal.
  # ------------------------------------------------------------------
  propose-mainnet:
    name: Propose mainnet upgrade (multisig)
    needs: [build, check-testnet, check-runtime-notes]
    runs-on: [self-hosted, fireactions-turbo-8]
    environment: mainnet
    timeout-minutes: 30
    permissions:
      contents: write # publish the proposal pre-release + tag
    outputs:
      should_propose: ${{ steps.guard.outputs.should_propose }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ needs.build.outputs.spec_version }}
          path: wasm
      - name: Check whether an upgrade is needed
        id: guard
        run: |
          chain=$(curl -sf -H "Content-Type: application/json" \
            -d '{"id":1,"jsonrpc":"2.0","method":"state_getRuntimeVersion","params":[]}' \
            "https://entrypoint-finney.opentensor.ai" | jq -r '.result.specVersion')
          : ${chain:?could not fetch mainnet spec_version}
          if [ "${{ needs.build.outputs.spec_version }}" -gt "$chain" ]; then
            echo "should_propose=true" >> $GITHUB_OUTPUT
          else
            echo "mainnet already on $chain; skipping."
            echo "should_propose=false" >> $GITHUB_OUTPUT
          fi
      - name: Install uv
        if: steps.guard.outputs.should_propose == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Verify Finney EVM association cap (spec 426 migration)
        if: steps.guard.outputs.should_propose == 'true'
        working-directory: sdk/python
        run: |
          spec="${{ needs.build.outputs.spec_version }}"
          if [ "$spec" -lt 426 ]; then
            echo "spec $spec < 426; skipping EVM association cap verification"
            exit 0
          fi
          uv sync --frozen
          uv run python scripts/verify_finney_evm_association_cap.py \
            "${FINNEY_WS:-wss://entrypoint-finney.opentensor.ai:443}" \
            --max-per-address 32
      - name: Set up Node.js
        if: steps.guard.outputs.should_propose == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deploy deps
        if: steps.guard.outputs.should_propose == 'true'
        working-directory: .github/scripts/deploy
        run: npm ci --ignore-scripts

      # Reserve the release identity before any on-chain side effect. Tag
      # rules make v<spec> immutable; a retry from the same commit is safe,
      # while changed code must bump spec_version rather than retargeting a
      # proposal that signers may already be reviewing.
      - name: Reserve immutable release tag
        if: steps.guard.outputs.should_propose == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.build.outputs.spec_version }}"
          tag_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"

          if tag_json=$(gh api "$tag_ref" 2>/dev/null); then
            tag_type=$(jq -er '.object.type' <<<"$tag_json")
            [ "$tag_type" = commit ] \
              || { echo "release tag $tag must be a lightweight Git tag, found $tag_type"; exit 1; }
            tag_sha=$(jq -er '.object.sha' <<<"$tag_json")
            echo "release tag $tag already exists at $tag_sha"
          else
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null; then
              echo "reserved release tag $tag"
            else
              # Handle a concurrent same-commit reservation without making
              # tag creation racy. Any other failure remains fatal here.
              echo "tag creation raced; verifying the exact tag ref"
            fi
            tag_json=$(gh api "$tag_ref")
            tag_type=$(jq -er '.object.type' <<<"$tag_json")
            [ "$tag_type" = commit ] \
              || { echo "release tag $tag must be a lightweight Git tag, found $tag_type"; exit 1; }
            tag_sha=$(jq -er '.object.sha' <<<"$tag_json")
          fi
          [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "tag $tag did not resolve to a Git commit"; exit 1; }
          [ "$tag_sha" = "$GITHUB_SHA" ] \
            || { echo "tag $tag is reserved for $tag_sha, not $GITHUB_SHA; bump spec_version"; exit 1; }

      - name: Submit multisig proposal (CI half of deployment multisig)
        if: steps.guard.outputs.should_propose == 'true'
        working-directory: .github/scripts/deploy
        env:
          CI_SEED: ${{ secrets.MAINNET_CI_SEED }}
        run: |
          node propose-upgrade-multisig.js ${{ env.MAINNET_WS }} \
            "$GITHUB_WORKSPACE/wasm/subtensor.wasm" \
            "$GITHUB_WORKSPACE/wasm/proxy_proxy_blob.hex"

      # The triumvirate's first-signer procedure (scripts/deploy/README.md)
      # downloads this artifact to verify the wasm and sign the call data.
      - name: Record pending release
        if: steps.guard.outputs.should_propose == 'true'
        run: |
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg spec "${{ needs.build.outputs.spec_version }}" \
            --slurpfile proposal .github/scripts/deploy/pending-release.json \
            '{commit: $sha, expected_spec_version: ($spec | tonumber), proposal: $proposal[0]}' \
            > wasm/pending-release.json
          cat wasm/pending-release.json

      # Everything a signer (or btcli) needs to locate, verify, and sign the
      # proposal, in one machine-readable file. `btcli upgrade check/sign`
      # consumes it via the release asset URL.
      - name: Build upgrade manifest
        if: steps.guard.outputs.should_propose == 'true'
        run: |
          spec="${{ needs.build.outputs.spec_version }}"
          tag="v${spec}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$tag" \
            --arg base "$base" \
            --arg network "finney" \
            --slurpfile pending wasm/pending-release.json \
            --slurpfile digest wasm/subtensor-digest.json \
            --slurpfile sudo .github/scripts/deploy/sudo-signatories.json \
            '{
              kind: "runtime-upgrade-proposal",
              network: $network,
              repo: $repo,
              tag: $tag,
              spec_version: $pending[0].expected_spec_version,
              commit: $pending[0].commit,
              call_hash: $pending[0].proposal.callHash,
              proposal: $pending[0].proposal,
              ci_address: $pending[0].proposal.ciAddress,
              deployment_multisig: $pending[0].proposal.multisigAddress,
              sudo_key: $pending[0].proposal.sudoKey,
              sudo: {signatories: $sudo[0].signatories, threshold: $sudo[0].threshold},
              wasm_sha256: $digest[0].sha256,
              srtool_rustc: ($digest[0].rustc // null),
              max_weight: {ref_time: 50000000000, proof_size: 0},
              assets: {
                wasm: ($base + "/subtensor.wasm"),
                digest: ($base + "/subtensor-digest.json"),
                call_data: ($base + "/proxy_proxy_blob.hex"),
                pending_release: ($base + "/pending-release.json"),
                manifest: ($base + "/upgrade-manifest.json")
              }
            }' > wasm/upgrade-manifest.json
          cat wasm/upgrade-manifest.json

      - name: Upload runtime + call data artifacts
        if: steps.guard.outputs.should_propose == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-upgrade-${{ needs.build.outputs.spec_version }}
          path: |
            wasm/subtensor.wasm
            wasm/subtensor-digest.json
            wasm/proxy_proxy_blob.hex
            wasm/pending-release.json
            wasm/upgrade-manifest.json
          if-no-files-found: error
          retention-days: 90

      # The single URL to share with the other signers. A *pre-release* at the
      # deployed commit: the release page carries the signer instructions and
      # the artifacts as stable-URL assets; watch-mainnet-release.yml promotes
      # it to a final release once the upgrade executes on chain.
      - name: Publish proposal pre-release
        if: steps.guard.outputs.should_propose == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spec="${{ needs.build.outputs.spec_version }}"
          tag="v${spec}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

          commit=$(jq -r '.commit' wasm/pending-release.json)
          tag_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          tag_type=$(jq -er '.object.type' <<<"$tag_json")
          [ "$tag_type" = commit ] \
            || { echo "release tag $tag must be a lightweight Git tag, found $tag_type"; exit 1; }
          tag_sha=$(jq -er '.object.sha' <<<"$tag_json")
          [ "$tag_sha" = "$commit" ] \
            || { echo "immutable tag $tag points at $tag_sha, expected $commit"; exit 1; }
          call_hash=$(jq -r '.proposal.callHash' wasm/pending-release.json)
          height=$(jq -r '.proposal.blockHeight' wasm/pending-release.json)
          index=$(jq -r '.proposal.extrinsicIndex' wasm/pending-release.json)
          ci_address=$(jq -r '.proposal.ciAddress' wasm/pending-release.json)
          deploy_ms=$(jq -r '.proposal.multisigAddress' wasm/pending-release.json)
          sha256=$(jq -r '.sha256' wasm/subtensor-digest.json)

          cat > release-body.md <<EOF
          ## Proposed runtime upgrade to spec ${spec} (awaiting signatures)

          CI has submitted its half of the 2-of-2 deployment multisig for this
          upgrade on finney. It executes once the sudo multisig (triumvirate)
          produces the second approval. This tag is the exact code being
          deployed.

          ### Sign it

          Each triumvirate member runs:

          \`\`\`
          btcli upgrade sign --url ${url} -w <your-wallet>
          \`\`\`

          btcli verifies the call data against the chain (structure, sudo key,
          on-chain call hash) before submitting, and picks the right approval
          (first / interior / final) from chain state automatically.

          ### Verify it independently (recommended)

          Build the runtime from this tag with srtool and compare byte-for-byte
          (see \`.github/scripts/deploy/README.md\` for the full recipe):

          \`\`\`
          git fetch origin && git checkout ${tag}
          # srtool build, then:
          btcli upgrade check --url ${url} --wasm <path/to/your-build.wasm>
          \`\`\`

          Without \`--wasm\`, \`btcli upgrade check --url ${url}\` still verifies
          the published artifacts against each other and the chain, but trusts
          the released wasm; a local srtool build closes that gap.

          ### Proposal details

          | | |
          | --- | --- |
          | spec_version | \`${spec}\` |
          | commit | \`${commit}\` |
          | call hash | \`${call_hash}\` |
          | deployment timepoint | \`${height}:${index}\` |
          | CI key | \`${ci_address}\` |
          | deployment multisig | \`${deploy_ms}\` |
          | wasm sha256 | \`${sha256}\` |
          EOF

          assets=(
            wasm/subtensor.wasm
            wasm/subtensor-digest.json
            wasm/proxy_proxy_blob.hex
            wasm/pending-release.json
            wasm/upgrade-manifest.json
          )
          if release_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null); then
            is_prerelease=$(jq -er \
              '.prerelease | if type == "boolean" then tostring else error("prerelease must be boolean") end' \
              <<<"$release_json")
            [ "$is_prerelease" = true ] \
              || { echo "release $tag is already final; refusing to overwrite it"; exit 1; }
            target_sha=$(jq -er \
              '.target_commitish | strings | select(test("^[0-9a-f]{40}$"))' \
              <<<"$release_json")
            [ "$target_sha" = "$commit" ] \
              || { echo "pre-release target $target_sha does not match $commit"; exit 1; }
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Runtime ${spec} (proposed)" \
              --notes-file release-body.md \
              --prerelease
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$commit" \
              --prerelease \
              --title "Runtime ${spec} (proposed)" \
              --notes-file release-body.md \
              "${assets[@]}"
          fi

          {
            echo "## Share this with the other signers"
            echo ""
            echo "**${url}**"
            echo ""
            echo '```'
            echo "btcli upgrade sign --url ${url} -w <your-wallet>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate from propose-mainnet so a Discord failure does not submit
  # another multisig. mainnet-release holds the webhook and has no reviewers,
  # so this does not ask for a second mainnet approval.
  announce-proposed:
    name: Announce proposed runtime upgrade
    needs: [build, propose-mainnet]
    if: needs.propose-mainnet.outputs.should_propose == 'true'
    runs-on: ubuntu-latest
    environment: mainnet-release
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Require the main branch
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "Discord announcements only run from main"
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ needs.build.outputs.spec_version }}
          path: wasm
      - name: Read release facts
        id: facts
        run: |
          set -euo pipefail
          sha256=$(jq -er '.sha256' wasm/subtensor-digest.json | tr '[:upper:]' '[:lower:]')
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "wasm sha256 is not 64 hex characters"; exit 1; }
          versions=$(python3 .github/scripts/release-python-versions.py \
            sdk/python/pyproject.toml sdk/bittensor-core-py/pyproject.toml)
          spec="${{ needs.build.outputs.spec_version }}"
          {
            echo "sha256=$sha256"
            echo "sdk=$(jq -er .sdk <<<"$versions")"
            echo "core=$(jq -er .core <<<"$versions")"
          } >> "$GITHUB_OUTPUT"
          if [ -f ".github/release-notes/runtime/${spec}.json" ]; then
            echo "notes=.github/release-notes/runtime/${spec}.json" >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi
      - name: Post to Discord
        uses: ./.github/actions/announce-release
        with:
          kind: runtime-proposed
          spec: ${{ needs.build.outputs.spec_version }}
          sdk-version: ${{ steps.facts.outputs.sdk }}
          core-version: ${{ steps.facts.outputs.core }}
          sha: ${{ github.sha }}
          sha256: ${{ steps.facts.outputs.sha256 }}
          notes-file: ${{ steps.facts.outputs.notes }}
          allow-missing-notes: "true"
          dry-run: "false"
          status-context: announce/runtime-proposed
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          openai-api-key: ${{ secrets.ANNOUNCE_OPENAI_API_KEY }}

  # ------------------------------------------------------------------
  # Published once mainnet runs this upgrade, under the same click.
  # Both jobs have exactly propose-mainnet's `needs`, so all three wait for
  # `mainnet` at the same moment and one approval starts them together. A job
  # that reached the environment later would ask again. They wait for the
  # triumvirate inside the approved job; await-mainnet-enactment.sh returns
  # live=true only when the finalized runtime is this train's wasm and v<spec>
  # names this commit.
  # ------------------------------------------------------------------
  publish-python-on-enactment:
    name: Publish stable Python once mainnet runs this upgrade
    needs: [build, check-testnet, check-runtime-notes]
    runs-on: [self-hosted, fireactions-turbo-8]
    # PyPI trusted publishing (OIDC). `bittensor` and bittensor-core need a
    # trusted-publisher row for release-train.yml on the mainnet environment.
    environment: mainnet
    # Waits up to 20 hours (WAIT_MINUTES) for the upgrade to execute; the
    # slowest so far took under two hours. The job's GITHUB_TOKEN can only be
    # refreshed for 24 hours, so the wait plus publishing must stay below
    # that; the job timeout is the backstop for a hung network call.
    timeout-minutes: 1380
    # No stable-python-pypi concurrency group: it would be held for the whole
    # wait, and a job queued behind it would ask for a second approval later.
    # check-python-release.py runs right before the upload and
    # `uv publish --check-url` skips files that are already on the index.
    permissions:
      id-token: write
      contents: read
      # Read this run's jobs while waiting; dispatch the watcher if the
      # upload fails after the upgrade is live.
      actions: write
    outputs:
      uploaded: ${{ steps.state.outputs.should_upload }}
      sdk: ${{ steps.state.outputs.sdk }}
      core: ${{ steps.state.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ needs.build.outputs.spec_version }}
          path: wasm

      - name: Wait until mainnet runs this runtime
        id: wait
        env:
          SPEC: ${{ needs.build.outputs.spec_version }}
          WASM: wasm/subtensor.wasm
          RELEASE_SHA: ${{ github.sha }}
          WAIT_MINUTES: "1200"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/await-mainnet-enactment.sh

      - name: Decide whether to upload
        id: state
        if: steps.wait.outputs.live == 'true'
        run: |
          set -euo pipefail
          versions=$(python3 .github/scripts/release-python-versions.py \
            sdk/python/pyproject.toml sdk/bittensor-core-py/pyproject.toml)
          sdk=$(jq -er '.sdk' <<<"$versions")
          core=$(jq -er '.core' <<<"$versions")
          should_upload=true
          if python3 .github/scripts/check-python-release.py \
              --sdk-version "$sdk" \
              --core-version "$core" \
              --repository "$GITHUB_REPOSITORY"; then
            echo "bittensor $sdk and bittensor-core $core are already complete on PyPI."
            should_upload=false
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
          fi
          {
            echo "should_upload=$should_upload"
            echo "sdk=$sdk"
            echo "core=$core"
          } >> "$GITHUB_OUTPUT"

      - name: Require the stable Python build from this run
        if: steps.state.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_JOB: Build the stable SDK distribution
        run: |
          set -euo pipefail
          # A re-run may rebuild the plan, the full core wheel matrix (macOS
          # included) and the SDK next to this already-approved job.
          for attempt in $(seq 1 150); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
              | jq -r --arg name "$BUILD_JOB" \
                'first(.jobs[] | select(.name == $name) | "\(.status) \(.conclusion // "")") // ""') \
              || state=""
            case "$state" in
              "completed success")
                echo "$BUILD_JOB succeeded."
                exit 0
                ;;
              completed*)
                echo "::error::$BUILD_JOB finished as '${state#completed }', so there is nothing to upload. Re-run the failed jobs if it was flaky (this job then asks for one more mainnet approval); a code fix needs a new commit, so dispatch watch-mainnet-release.yml instead."
                exit 1
                ;;
            esac
            echo "$BUILD_JOB is '${state:-not listed}'; waiting ($attempt/150)."
            sleep 60
          done
          echo "::error::$BUILD_JOB did not finish within 150 minutes."
          exit 1

      - name: Install uv 0.11.28
        if: steps.state.outputs.should_upload == 'true'
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ] || { echo "this job only installs the pinned x86_64 uv"; exit 1; }
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/uv"
          curl -fsSL -o "$RUNNER_TEMP/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.11.28/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP/uv"
          install -m 755 "$RUNNER_TEMP/uv/uv-x86_64-unknown-linux-gnu/uv" "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download the built distribution
        if: steps.state.outputs.should_upload == 'true'
        uses: actions/download-artifact@v4
        with:
          name: stable-python-dist
          path: dist

      - name: Keep only the expected distribution files
        if: steps.state.outputs.should_upload == 'true'
        env:
          SDK_VERSION: ${{ steps.state.outputs.sdk }}
          CORE_VERSION: ${{ steps.state.outputs.core }}
        run: python3 .github/scripts/select-stable-dist.py "$SDK_VERSION" "$CORE_VERSION" dist

      - name: Generate PEP 740 attestations
        if: steps.state.outputs.should_upload == 'true'
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      # The build steps above can take minutes; never upload for a runtime
      # mainnet replaced in the meantime.
      - name: Recheck that mainnet still runs this runtime
        if: steps.state.outputs.should_upload == 'true'
        env:
          EXPECTED_SPEC: ${{ needs.build.outputs.spec_version }}
          EXPECTED_CODE_HASH: ${{ steps.wait.outputs.code_hash }}
        run: .github/scripts/mainnet-finalized-runtime.sh

      - name: Publish to PyPI
        if: steps.state.outputs.should_upload == 'true'
        run: |
          ls -la dist
          uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/ dist/*

      - name: Verify complete publication on PyPI
        if: steps.state.outputs.should_upload == 'true'
        env:
          SDK_VERSION: ${{ steps.state.outputs.sdk }}
          CORE_VERSION: ${{ steps.state.outputs.core }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status=0
            python3 .github/scripts/check-python-release.py \
              --sdk-version "$SDK_VERSION" \
              --core-version "$CORE_VERSION" \
              --repository "$GITHUB_REPOSITORY" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "PyPI state not authoritative yet (attempt $attempt/12); retrying."
              sleep 10
            fi
          done
          echo "PyPI did not expose the complete attested release within two minutes."
          exit 1

      # Once the upgrade is live, a failure here (stable build missing, PyPI
      # rejecting the upload, a network error) must leave a pending approval,
      # as the watcher did before the train published: the watcher's
      # finalizing run may already have seen this job in progress and left
      # PyPI to it. The dispatched run rebuilds from the v<spec> tag.
      - name: Hand the upload to the release watcher
        if: failure() && steps.wait.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run watch-mainnet-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "::error::The stable Python upload failed after spec ${{ needs.build.outputs.spec_version }} went live. Dispatched watch-mainnet-release.yml, which asks for one mainnet approval to publish it."

  deploy-docs-on-enactment:
    name: Deploy production docs once mainnet runs this upgrade
    needs: [build, check-testnet, check-runtime-notes]
    runs-on: [self-hosted, fireactions-turbo-8]
    # The production Vercel credentials live in the mainnet environment.
    # deploy-docs.yml can redeploy production manually if this is missed.
    environment: mainnet
    timeout-minutes: 1380
    permissions:
      contents: read
      actions: read # read this run's jobs while waiting
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ needs.build.outputs.spec_version }}
          path: wasm

      - name: Wait until mainnet runs this runtime
        id: wait
        env:
          SPEC: ${{ needs.build.outputs.spec_version }}
          WASM: wasm/subtensor.wasm
          RELEASE_SHA: ${{ github.sha }}
          WAIT_MINUTES: "1200"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/await-mainnet-enactment.sh

      - name: Set up Node.js
        if: steps.wait.outputs.live == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (yarn 4)
        if: steps.wait.outputs.live == 'true'
        run: corepack enable

      - name: Build production docs
        if: steps.wait.outputs.live == 'true'
        # Repo root, not website/: the Vercel root directory is resolved
        # against the cwd (see deploy-docs.yml).
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        run: |
          npx --yes vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel build --prod --token "$VERCEL_TOKEN"

      # The build can take a while; never promote docs for a runtime mainnet
      # replaced in the meantime.
      - name: Recheck that mainnet still runs this runtime
        if: steps.wait.outputs.live == 'true'
        env:
          EXPECTED_SPEC: ${{ needs.build.outputs.spec_version }}
          EXPECTED_CODE_HASH: ${{ steps.wait.outputs.code_hash }}
        run: .github/scripts/mainnet-finalized-runtime.sh

      - name: Deploy to Vercel (production)
        if: steps.wait.outputs.live == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        run: |
          # --archive=tgz: the prebuilt output exceeds Vercel's 15k-file
          # upload limit (the generated docs tree alone is >30k files).
          npx --yes vercel deploy --prebuilt --prod --archive=tgz --token "$VERCEL_TOKEN"

  # Separate from the upload so a Discord failure never re-runs it.
  # mainnet-release has no reviewers, so this does not ask for an approval.
  announce-python:
    name: Announce stable Python release
    needs: publish-python-on-enactment
    if: needs.publish-python-on-enactment.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    environment: mainnet-release
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Require the main branch
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "Discord announcements only run from main"
            exit 1
          }
      - uses: actions/checkout@v4
      - name: Find Python release notes
        id: facts
        env:
          SDK_VERSION: ${{ needs.publish-python-on-enactment.outputs.sdk }}
        run: |
          set -euo pipefail
          if [ -f ".github/release-notes/python/${SDK_VERSION}.json" ]; then
            echo "notes=.github/release-notes/python/${SDK_VERSION}.json" >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi
      - name: Post to Discord
        uses: ./.github/actions/announce-release
        with:
          kind: python-stable
          sdk-version: ${{ needs.publish-python-on-enactment.outputs.sdk }}
          core-version: ${{ needs.publish-python-on-enactment.outputs.core }}
          sha: ${{ github.sha }}
          revision: ${{ github.sha }}
          notes-file: ${{ steps.facts.outputs.notes }}
          allow-missing-notes: "true"
          dry-run: "false"
          status-context: announce/python-stable
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          openai-api-key: ${{ secrets.ANNOUNCE_OPENAI_API_KEY }}
