name: Check Rust

# Lint + test gate for every PR into main. Each job is independent so a
# formatting failure doesn't hide a test failure.

on:
  pull_request:
  # Main pushes retain post-merge validation and populate R2 while compiling;
  # legacy non-MMDS pools keep the GitHub Actions backend as a fallback.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # Fork PRs must not run on self-hosted runners — checkout executes untrusted
  # code from the fork head (RCE risk on persistent org hardware).
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  # Every check in this workflow is a required merge check, so the workflow
  # itself must always trigger (a required check whose workflow never runs is
  # stuck "Expected" and blocks the merge). Instead, jobs skip themselves when
  # the PR touches no Rust-relevant paths; a `skipped` conclusion satisfies
  # branch protection. The filter checks out only routing code from the trusted
  # base and reads proposed paths from the API, so no PR-controlled code runs.
  changes:
    name: detect rust changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # Path ownership comes from the base revision so a PR cannot classify its
      # own new workspace area as irrelevant.
      - name: Check out trusted Rust change classifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/rust-ci-paths.txt
            .github/scripts/classify-rust-changes.sh
            .github/scripts/extract-pull-file-paths.sh
          sparse-checkout-cone-mode: false
          path: .trusted-rust-ci-paths
          persist-credentials: false

      # Plain gh-api file listing instead of a marketplace action: the org's
      # Actions allowlist rejects unlisted third-party actions (startup_failure).
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          classifier=.trusted-rust-ci-paths/.github/scripts/classify-rust-changes.sh
          extractor=.trusted-rust-ci-paths/.github/scripts/extract-pull-file-paths.sh

          select_rust() {
            echo "rust=true" >> "$GITHUB_OUTPUT"
          }

          publish_classification() {
            local classification=$1
            if [[ "$(wc -l < "$classification" | tr -d '[:space:]')" == 1 ]] &&
               grep -qxE 'rust=(true|false)' "$classification"; then
              cat "$classification" >> "$GITHUB_OUTPUT"
              return 0
            fi
            return 1
          }

          # This branch introduces the trusted classifier. Until it lands,
          # absence on the base revision runs every Rust check rather than
          # executing proposed routing code or maintaining a second policy.
          if [[ ! -x "$classifier" || ! -x "$extractor" ]]; then
            echo "trusted Rust classifier unavailable; running all Rust checks" >&2
            select_rust
            exit 0
          fi

          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate); then
            echo "changed-file lookup failed; running all Rust checks" >&2
            select_rust
            exit 0
          fi
          if ! paths=$(printf '%s\n' "$files" | "$extractor" "$EXPECTED_CHANGED_FILES"); then
            echo "changed-file response invalid; running all Rust checks" >&2
            select_rust
            exit 0
          fi
          classification=$(mktemp)
          trap 'rm -f "$classification"' EXIT
          if ! printf '%s\n' "$paths" | "$classifier" "$classification" ||
             ! publish_classification "$classification"; then
            echo "trusted Rust classifier failed or emitted an invalid selection; running all Rust checks" >&2
            select_rust
          fi

  fmt:
    name: cargo fmt
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, fireactions-turbo-8]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-fmt
          components: rustfmt
      - name: Validate Rust CI path ownership
        run: .github/scripts/test-rust-ci-paths.sh
      - name: cargo fmt --check
        run: |
          set -euo pipefail
          output=$(cargo fmt --check --all 2>&1) || { echo "$output"; exit 1; }
          # rustfmt ICEs can exit 0; treat any panic in the output as failure.
          if echo "$output" | grep -qiE "panicked at|internal compiler error"; then
            echo "$output"
            exit 1
          fi

  clippy:
    name: cargo clippy (${{ matrix.features.name }})
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    # Compile-bound; the shared 8-core pool avoids the legacy 2-core cold-cache
    # path without consuming the 16-core critical-path lane.
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'sccache-reader' || 'sccache-writer' }}
      deployment: false
    env:
      SKIP_WASM_BUILD: 1
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            flags: ""
          - name: all
            flags: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: clippy-${{ matrix.features.name }}
          components: clippy
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features.flags }} -- -D warnings
      - name: Report clippy compiler cache
        if: always()
        run: .github/scripts/sccache-report.sh "Clippy ${{ matrix.features.name }} compiler cache"

  # GitHub evaluates a matrix job's job-level `if` before expanding the
  # matrix. On a non-Rust PR, the skipped `clippy` job above therefore reports
  # one literal context named `cargo clippy (${{ matrix.features.name }})`
  # instead of the two concrete contexts required by branch protection. Emit
  # those exact contexts from cheap hosted jobs without checking out or
  # executing PR-controlled code. These conditions are mutually exclusive
  # with the real Clippy matrix above, so Rust-relevant PRs retain full lint
  # coverage and never receive a no-op success in its place.
  clippy-not-required:
    name: cargo clippy (${{ matrix.features.name }})
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'false'
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
          - name: all
    steps:
      - name: Clippy not required
        run: echo "No Rust-relevant paths changed; Clippy is not required."

  warnings:
    name: no cargo check warnings
    needs: [trusted-pr, changes]
    # Clippy already denies warnings across the workspace and all targets on
    # PRs. Retain this narrower cargo-check policy gate on main and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'sccache-reader' || 'sccache-writer' }}
      deployment: false
    env:
      RUSTFLAGS: -D warnings
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: lints
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}
      - name: cargo check (fail on warnings)
        run: |
          set -euo pipefail
          # RUSTFLAGS: -D warnings promotes warnings to errors, so cargo's
          # exit code alone fails the job on any warning.
          cargo check
      - name: Report warnings-check compiler cache
        if: always()
        run: .github/scripts/sccache-report.sh "Warnings check compiler cache"

  test:
    name: cargo test
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    # Longest job in this workflow; retain the reserved 16-core turbo lane.
    runs-on: [self-hosted, fireactions-turbo-16]
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'sccache-reader' || 'sccache-writer' }}
      deployment: false
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-test
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}
      - name: Install cargo-nextest
        run: |
          contract=/etc/fireactions-runner-image/image-contract.env
          system_bin=/usr/local/bin/cargo-nextest
          if [[ -r "$contract" ]] && \
              grep -Fxq 'CARGO_NEXTEST_VERSION=0.9.140' "$contract" && \
              [[ -x "$system_bin" ]] && \
              "$system_bin" --version 2>/dev/null | grep -Fq 'cargo-nextest 0.9.140 '; then
            install -m 0755 "$system_bin" "$HOME/.cargo/bin/cargo-nextest"
          else
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "$HOME/.cargo/bin"
          fi
          cargo nextest --version
      # nextest runs each test in its own process with better scheduling than
      # libtest's per-binary threading — typically 2-3x faster on suites this
      # size. It doesn't execute doctests, so those keep running via cargo
      # test --doc (cheap: it reuses the build nextest just did).
      - name: cargo nextest run --workspace --all-features
        run: cargo nextest run --workspace --all-features
      - name: cargo test --doc --workspace --all-features
        run: cargo test --doc --workspace --all-features
      - name: Report test compiler cache
        if: always()
        run: .github/scripts/sccache-report.sh "Cargo test compiler cache"

  # The browser seam: bittensor-core without its `host` feature must keep
  # compiling for wasm32 (the future wasm-bindgen/TS binding target). This
  # check is what keeps "browser-compatible" an invariant instead of an
  # intention — any new dependency that assumes an OS, threads, or C
  # toolchain fails here instead of surfacing when the wasm binding lands.
  core-wasm:
    name: bittensor-core wasm32 seam
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'sccache-reader' || 'sccache-writer' }}
      deployment: false
    # No RUSTFLAGS deny here: it would apply to dependencies too, and the
    # vendored w3f-bls fork carries warnings in this feature combination.
    # This job asserts the seam compiles; warning hygiene stays with the
    # `warnings` job.
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: core-wasm
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: cargo check bittensor-core (portable core, wasm32)
        run: cargo check -p bittensor-core --no-default-features --target wasm32-unknown-unknown
      # The wasm-bindgen binding crate itself (npm packaging happens via
      # wasm-pack at release time; this asserts it keeps compiling).
      - name: cargo check bittensor-core-wasm (wasm32)
        run: cargo check -p bittensor-core-wasm --target wasm32-unknown-unknown
      # Behavioral gate for the JS marshalling seam: the smoke test replays
      # the golden fixtures (byte-exact calls, storage keys, signature
      # payloads) plus the BigInt/u256/depth boundary probes that a type
      # check can never see. Release profile, not --dev: the unoptimized
      # build overflows wasm's per-function locals limit (wasm-bindgen
      # rejects it with "too many locals"), and release is the artifact
      # that actually ships to npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        run: |
          contract=/etc/fireactions-runner-image/image-contract.env
          system_bin=/usr/local/bin/wasm-pack
          if [[ -r "$contract" ]] && \
              grep -Fxq 'WASM_PACK_VERSION=0.13.1' "$contract" && \
              [[ -x "$system_bin" ]] && \
              "$system_bin" --version 2>/dev/null | grep -Fq 'wasm-pack 0.13.1'; then
            install -m 0755 "$system_bin" "$HOME/.cargo/bin/wasm-pack"
          else
            curl -LsSf https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
              | tar zxf - --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/wasm-pack'
          fi
          wasm-pack --version
      - name: wasm smoke test (node)
        run: |
          wasm-pack build sdk/bittensor-core-wasm --target nodejs --out-dir pkg-node
          node sdk/bittensor-core-wasm/tests/smoke.mjs
      - name: Report wasm compiler cache
        if: always()
        run: .github/scripts/sccache-report.sh "Bittensor core wasm compiler cache"

  fix:
    name: cargo fix leaves no diff
    needs: [trusted-pr, changes]
    # This is a mechanical cleanup policy, not test coverage. Keep it as a
    # post-merge/manual guard without spending PR critical-path capacity.
    if: github.event_name != 'pull_request'
    # Compile-bound, same reasoning as clippy.
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'sccache-reader' || 'sccache-writer' }}
      deployment: false
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-fix
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}
      - name: cargo fix --workspace
        run: |
          cargo fix --workspace
          git diff --exit-code || { echo "'cargo fix --workspace' produced changes; apply them locally."; exit 1; }
      - name: Report cargo-fix compiler cache
        if: always()
        run: .github/scripts/sccache-report.sh "Cargo fix compiler cache"

  zepter:
    name: zepter feature propagation
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, fireactions-turbo-8]
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'sccache-reader' || 'sccache-writer' }}
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: zepter
          sccache-credential-mode: auto
          sccache-writer-access-key-id: ${{ secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID }}
          sccache-writer-secret-access-key: ${{ secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY }}
      - name: Install and run zepter
        run: |
          contract=/etc/fireactions-runner-image/image-contract.env
          system_bin=/usr/local/bin/zepter
          if [[ -r "$contract" ]] && \
              grep -Fxq 'ZEPTER_VERSION=1.88.1' "$contract" && \
              [[ -x "$system_bin" ]] && \
              "$system_bin" --version 2>/dev/null | grep -Fq '1.88.1'; then
            install -m 0755 "$system_bin" "$HOME/.cargo/bin/zepter"
          else
            cargo install --locked -q zepter
          fi
          zepter run check
