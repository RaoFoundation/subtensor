name: Check Rust

# Lint + test gate for every PR into main. Each job is independent so a
# formatting failure doesn't hide a test failure.

on:
  pull_request:
  # Runs on main serve two purposes: post-merge validation, and seeding the
  # shared sccache pool — Actions caches written on the default branch are
  # readable by every PR, while PR-written caches stay scoped to their PR.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # Fork PRs must not run on self-hosted runners — checkout executes untrusted
  # code from the fork head (RCE risk on persistent org hardware).
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  # Every check in this workflow is a required merge check, so the workflow
  # itself must always trigger (a required check whose workflow never runs is
  # stuck "Expected" and blocks the merge). Instead, jobs skip themselves when
  # the PR touches no Rust-relevant paths; a `skipped` conclusion satisfies
  # branch protection. No checkout: for pull_request events the filter reads
  # the changed-file list from the API, so no untrusted code is executed.
  changes:
    name: detect rust changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # Plain gh-api file listing instead of a marketplace action: the org's
      # Actions allowlist rejects unlisted third-party actions (startup_failure).
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          pattern='^(common|node|pallets|precompiles|primitives|runtime|support|chain-extensions|src|vendor)/|^sdk/bittensor-core(-py|-wasm)?/|^(Cargo\.(toml|lock)|build\.rs|rust-toolchain\.toml|zepter\.yaml)$|^\.github/(workflows/check-rust\.yml|actions/rust-setup/)'
          if grep -qE "$pattern" <<< "$files"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "no Rust-relevant paths changed"
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: cargo fmt
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, fireactions-light]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-fmt
          components: rustfmt
      - name: cargo fmt --check
        run: |
          set -euo pipefail
          output=$(cargo fmt --check --all 2>&1) || { echo "$output"; exit 1; }
          # rustfmt ICEs can exit 0; treat any panic in the output as failure.
          if echo "$output" | grep -qiE "panicked at|internal compiler error"; then
            echo "$output"
            exit 1
          fi

  clippy:
    name: cargo clippy (${{ matrix.features.name }})
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    # Compile-bound (~20 min on the light boxes with a cold cache); the heavy
    # pool's extra cores cut the wall time roughly in half.
    runs-on: [self-hosted, fireactions-heavy]
    env:
      SKIP_WASM_BUILD: 1
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            flags: ""
          - name: all
            flags: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: clippy-${{ matrix.features.name }}
          components: clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features.flags }} -- -D warnings

  warnings:
    name: no cargo check warnings
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, fireactions-light]
    env:
      RUSTFLAGS: -D warnings
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: lints
      - name: cargo check (fail on warnings)
        run: |
          set -euo pipefail
          # RUSTFLAGS: -D warnings promotes warnings to errors, so cargo's
          # exit code alone fails the job on any warning.
          cargo check

  test:
    name: cargo test
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    # Turbo pool: longest job in this workflow (see runtime-checks.yml for
    # the two-replica routing budget).
    runs-on: [self-hosted, fireactions-turbo]
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-test
      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "$HOME/.cargo/bin"
          cargo nextest --version
      # nextest runs each test in its own process with better scheduling than
      # libtest's per-binary threading — typically 2-3x faster on suites this
      # size. It doesn't execute doctests, so those keep running via cargo
      # test --doc (cheap: it reuses the build nextest just did).
      - name: cargo nextest run --workspace --all-features
        run: cargo nextest run --workspace --all-features
      - name: cargo test --doc --workspace --all-features
        run: cargo test --doc --workspace --all-features

  # The browser seam: bittensor-core without its `host` feature must keep
  # compiling for wasm32 (the future wasm-bindgen/TS binding target). This
  # check is what keeps "browser-compatible" an invariant instead of an
  # intention — any new dependency that assumes an OS, threads, or C
  # toolchain fails here instead of surfacing when the wasm binding lands.
  core-wasm:
    name: bittensor-core wasm32 seam
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, fireactions-light]
    # No RUSTFLAGS deny here: it would apply to dependencies too, and the
    # vendored w3f-bls fork carries warnings in this feature combination.
    # This job asserts the seam compiles; warning hygiene stays with the
    # `warnings` job.
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: core-wasm
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: cargo check bittensor-core (portable core, wasm32)
        run: cargo check -p bittensor-core --no-default-features --target wasm32-unknown-unknown
      # The wasm-bindgen binding crate itself (npm packaging happens via
      # wasm-pack at release time; this asserts it keeps compiling).
      - name: cargo check bittensor-core-wasm (wasm32)
        run: cargo check -p bittensor-core-wasm --target wasm32-unknown-unknown
      # Behavioral gate for the JS marshalling seam: the smoke test replays
      # the golden fixtures (byte-exact calls, storage keys, signature
      # payloads) plus the BigInt/u256/depth boundary probes that a type
      # check can never see. Release profile, not --dev: the unoptimized
      # build overflows wasm's per-function locals limit (wasm-bindgen
      # rejects it with "too many locals"), and release is the artifact
      # that actually ships to npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        run: |
          curl -LsSf https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            | tar zxf - --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/wasm-pack'
          wasm-pack --version
      - name: wasm smoke test (node)
        run: |
          wasm-pack build sdk/bittensor-core-wasm --target nodejs --out-dir pkg-node
          node sdk/bittensor-core-wasm/tests/smoke.mjs

  fix:
    name: cargo fix leaves no diff
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    # Compile-bound, same reasoning as clippy.
    runs-on: [self-hosted, fireactions-heavy]
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-fix
      - name: cargo fix --workspace
        run: |
          cargo fix --workspace
          git diff --exit-code || { echo "'cargo fix --workspace' produced changes; apply them locally."; exit 1; }

  zepter:
    name: zepter feature propagation
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, fireactions-light]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: zepter
      - name: Install and run zepter
        run: |
          cargo install --locked -q zepter
          zepter run check
