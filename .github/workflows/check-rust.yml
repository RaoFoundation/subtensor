name: Check Rust

# Lint + test gate for every PR into main. Each job is independent so a
# formatting failure doesn't hide a test failure.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  fmt:
    name: cargo fmt
    runs-on: [self-hosted, fireactions-light]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-fmt
          components: rustfmt
      - name: cargo fmt --check
        run: |
          set -euo pipefail
          output=$(cargo fmt --check --all 2>&1) || { echo "$output"; exit 1; }
          # rustfmt ICEs can exit 0; treat any panic in the output as failure.
          if echo "$output" | grep -qiE "panicked at|internal compiler error"; then
            echo "$output"
            exit 1
          fi

  clippy:
    name: cargo clippy (${{ matrix.features.name }})
    runs-on: [self-hosted, fireactions-light]
    env:
      SKIP_WASM_BUILD: 1
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            flags: ""
          - name: all
            flags: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: clippy-${{ matrix.features.name }}
          components: clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features.flags }} -- -D warnings

  warnings:
    name: no cargo check warnings
    runs-on: [self-hosted, fireactions-light]
    env:
      RUSTFLAGS: -D warnings
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: lints
      - name: cargo check (fail on warnings)
        run: |
          set -o pipefail
          cargo check 2>&1 | sed -r "s/\x1B\[[0-9;]*[mK]//g" | grep "warning:" && exit 1
          echo "No warnings found."

  test:
    name: cargo test
    runs-on: [self-hosted, fireactions-heavy]
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-test
      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features

  fix:
    name: cargo fix leaves no diff
    runs-on: [self-hosted, fireactions-light]
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: cargo-fix
      - name: cargo fix --workspace
        run: |
          cargo fix --workspace
          git diff --exit-code || { echo "'cargo fix --workspace' produced changes; apply them locally."; exit 1; }

  zepter:
    name: zepter feature propagation
    runs-on: [self-hosted, fireactions-light]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: zepter
      - name: Install and run zepter
        run: |
          cargo install --locked -q zepter
          zepter run check
