name: Eco Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  trusted-pr:
    name: Trusted PR source (non-fork)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Non-fork PR; self-hosted runners may execute checkout."

  # "cargo test (eco-tests)" is a required merge check, so the workflow must
  # always trigger (a required check whose workflow never runs is stuck
  # "Expected" and blocks the merge). The job skips itself when the PR touches
  # nothing the eco-tests compile against; `skipped` satisfies branch
  # protection.
  changes:
    name: detect eco-tests changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'eco-tests/**'
              - 'common/**'
              - 'node/**'
              - 'pallets/**'
              - 'precompiles/**'
              - 'primitives/**'
              - 'runtime/**'
              - 'support/**'
              - 'chain-extensions/**'
              - 'src/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'rust-toolchain.toml'
              - '.github/workflows/eco-tests.yml'
              - '.github/actions/rust-setup/**'

  eco-tests:
    name: cargo test (eco-tests)
    needs: [trusted-pr, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, fireactions-heavy]
    env:
      RUST_BACKTRACE: full
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: eco-tests

      - name: cargo test
        working-directory: eco-tests
        run: cargo test
