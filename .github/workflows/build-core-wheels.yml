name: Build bittensor-core wheels

# Reusable wheel matrix for the bittensor-core PyPI package (the PyO3 crate is
# bittensor-core-py; the module and PyPI name are bittensor_core /
# bittensor-core). The crate builds as an abi3-py310 extension, so one wheel
# per platform covers every supported CPython:
#
#   manylinux x86_64 + aarch64 (self-hosted, aarch64 cross-built in the
#   maturin-action docker image), macOS arm64 + x86_64 (GitHub-hosted
#   macos-14; x86_64 is cross-compiled — Xcode carries both SDKs), plus an
#   sdist fallback for everything else (requires a Rust toolchain to build).
#
# Callers: release-train.yml (rc channel) and watch-mainnet-release.yml
# (stable). Each job uploads its output as a core-dist-* artifact; the
# caller's publish job downloads them next to the SDK wheel and pushes
# everything in one `uv publish`.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (empty = the caller's commit)
        type: string
        default: ""
      version:
        description: >-
          Version to stamp into sdk/bittensor-core-py/pyproject.toml before
          building (empty = build the committed version)
        type: string
        default: ""

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: [self-hosted, fireactions-turbo-8]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Stamp version
        if: inputs.version != ''
        env:
          CORE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path
          version = os.environ["CORE_VERSION"]
          path = Path("sdk/bittensor-core-py/pyproject.toml")
          text, count = re.subn(
              r'^version = ".*"$', f'version = "{version}"', path.read_text(), count=1, flags=re.M
          )
          assert count == 1, "version line not found in sdk/bittensor-core-py/pyproject.toml"
          path.write_text(text)
          print(f"bittensor-core version stamped to {version}")
          EOF

      # The sdist is the fallback for platforms without a wheel; build it
      # once, alongside the x86_64 wheel. Not via maturin-action: its native
      # (non-docker) path pip-installs helpers into the system Python, which
      # the runner's PEP 668 (externally-managed) Python refuses. uv runs
      # maturin's PEP 517 sdist hook in an isolated env instead. maturin's
      # sdist hook still shells out to `cargo metadata` (no compilation), so
      # the pinned toolchain from rust-toolchain.toml is installed first.
      #
      # This step runs BEFORE the docker wheel build: the docker build runs
      # as root, and if it creates dist/ first, this host-side step cannot
      # write into it (the wheel written into a runner-owned dist/ is fine).
      - name: Build sdist
        if: matrix.target == 'x86_64'
        working-directory: sdk/bittensor-core-py
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup toolchain install
          fi
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv build --sdist --out-dir ../../dist

      # Default features include "ledger". On Linux hidapi uses its pure-Rust
      # hidraw backend (linux-native-basic-udev), which links no libudev and
      # no C, so the wheel stays manylinux-compliant with Ledger support in.
      #
      # before-script-linux: openssl-src (the vendored OpenSSL that fernet's
      # openssl-sys builds) runs its Configure with Perl modules (IPC::Cmd)
      # that the CentOS-based manylinux images strip from their minimal perl;
      # the Ubuntu-based rust-cross images used for cross targets have a full
      # perl and take the no-op branch.
      #
      # manylinux 2_28 for the aarch64 cross build: the manylinux2014-cross
      # image's gcc is too old for ring's ARMv8 assembly (#error "ARM
      # assembler must define __ARM_ARCH"); the 2_28 image carries a modern
      # gcc. x86_64 stays on auto (manylinux2014) for the wider glibc floor.
      - name: Build wheel (manylinux)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: sdk/bittensor-core-py
          command: build
          args: --release --out ../../dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.target == 'aarch64' && '2_28' || 'auto' }}
          before-script-linux: |
            if command -v yum >/dev/null && ! perl -MIPC::Cmd -e 1 2>/dev/null; then
              yum install -y perl-core
            fi

      - uses: actions/upload-artifact@v4
        with:
          name: core-dist-linux-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.target }}
    # GitHub-hosted: the fireactions fleet is Linux-only, and macOS minutes
    # are free on public repos. macos-14 is arm64; the x86_64 wheel is
    # cross-compiled from the same runner.
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Stamp version
        if: inputs.version != ''
        env:
          CORE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path
          version = os.environ["CORE_VERSION"]
          path = Path("sdk/bittensor-core-py/pyproject.toml")
          text, count = re.subn(
              r'^version = ".*"$', f'version = "{version}"', path.read_text(), count=1, flags=re.M
          )
          assert count == 1, "version line not found in sdk/bittensor-core-py/pyproject.toml"
          path.write_text(text)
          print(f"bittensor-core version stamped to {version}")
          EOF

      # Hosted macOS images ship without Rust; rust-toolchain.toml pins the
      # toolchain once rustup is present.
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install # reads rust-toolchain.toml
          rustup target add ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: sdk/bittensor-core-py
          command: build
          args: --release --out ../../dist
          target: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: core-dist-macos-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
