<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    CSP: only esm.sh (the @polkadot/extension-dapp import below) and this page's
    own inline script may run; network access is limited to the local bridge
    websocket. 'unsafe-inline' is required because the bridge script is inline.
    TODO: vendor @polkadot/extension-dapp locally (SRI cannot cover a bare ESM
    import) so the esm.sh origin can be dropped entirely.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline' https://esm.sh; connect-src 'self' ws://127.0.0.1:* ws://localhost:* https://esm.sh; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bittensor Extension Bridge</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #0e1013;
      --paper: #f8f9fa;
      --muted: #9ba1aa;
      --line: #34383f;
      --rose: #d15168;
      --cyan: #68d7ee;
      --mint: #83e6bd;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(17rem, 34rem) minmax(16rem, 30rem);
      align-items: center;
      justify-content: center;
      gap: clamp(2rem, 8vw, 8rem);
      min-height: 100vh;
      padding: clamp(2rem, 6vw, 6rem);
      position: relative;
      isolation: isolate;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: absolute;
      z-index: -1;
      background: var(--line);
      opacity: 0.34;
    }

    .shell::before {
      width: 1px;
      height: 100vh;
      left: 11vw;
      top: 0;
    }

    .shell::after {
      width: 100vw;
      height: 1px;
      left: 0;
      bottom: 13vh;
    }

    .visual {
      aspect-ratio: 1;
      position: relative;
      width: min(100%, 34rem);
    }

    .ring {
      position: absolute;
      border: 1px solid var(--line);
      border-radius: 50%;
      inset: 12%;
    }

    .ring:nth-child(2) {
      inset: 25%;
      border-color: var(--rose);
      opacity: 0.45;
    }

    .axis {
      position: absolute;
      background: var(--line);
    }

    .axis-x {
      width: 76%;
      height: 1px;
      left: 12%;
      top: 50%;
    }

    .axis-y {
      width: 1px;
      height: 76%;
      left: 50%;
      top: 12%;
    }

    .terminal {
      position: absolute;
      inset: 31% 18%;
      border: 1px solid #454a52;
      background: #16191e;
      box-shadow: 14px 14px 0 #08090b;
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      height: 2.3rem;
      padding: 0 0.8rem;
      border-bottom: 1px solid #454a52;
    }

    .terminal-bar span {
      width: 0.48rem;
      height: 0.48rem;
      border-radius: 50%;
      background: #454a52;
    }

    .terminal-bar span:first-child {
      background: var(--rose);
    }

    .terminal-lines {
      display: grid;
      gap: 0.72rem;
      padding: 1.4rem;
    }

    .terminal-lines span {
      display: block;
      height: 0.42rem;
      background: #3a3f47;
    }

    .terminal-lines span:nth-child(1) {
      width: 48%;
      background: var(--mint);
    }

    .terminal-lines span:nth-child(2) {
      width: 79%;
    }

    .terminal-lines span:nth-child(3) {
      width: 61%;
      background: var(--cyan);
    }

    .node {
      position: absolute;
      width: 0.8rem;
      height: 0.8rem;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 0 1px var(--rose);
    }

    .node-a { left: 10%; top: 48.5%; }
    .node-b { right: 10%; top: 48.5%; background: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
    .node-c { left: 48.5%; top: 10%; background: var(--mint); box-shadow: 0 0 0 1px var(--mint); }
    .node-d { left: 48.5%; bottom: 10%; }

    .pulse {
      position: absolute;
      width: 0.55rem;
      height: 0.55rem;
      left: calc(50% - 0.275rem);
      top: calc(50% - 0.275rem);
      border-radius: 50%;
      background: var(--rose);
      animation: pulse 2.4s ease-out infinite;
    }

    .copy {
      max-width: 28rem;
    }

    h1 {
      margin: 0;
      max-width: 9ch;
      font-size: clamp(3rem, 7vw, 6.5rem);
      font-weight: 560;
      line-height: 0.98;
      letter-spacing: 0;
    }

    p {
      margin: 1.7rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      letter-spacing: 0;
    }

    body[data-bridge-state="ready"] .pulse {
      background: var(--mint);
    }

    body[data-bridge-state="complete"] .pulse {
      background: var(--mint);
      animation: none;
      box-shadow: 0 0 0 0.75rem rgba(131, 230, 189, 0.16);
    }

    body[data-bridge-state="complete"] .terminal {
      border-color: var(--mint);
    }

    body[data-bridge-state="error"] .pulse,
    body[data-bridge-state="failed"] .pulse {
      background: var(--rose);
      animation-duration: 0.8s;
    }

    body[data-bridge-state="failed"] .terminal {
      border-color: var(--rose);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(209, 81, 104, 0.56); }
      70%, 100% { box-shadow: 0 0 0 2.2rem rgba(209, 81, 104, 0); }
    }

    @media (max-width: 760px) {
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(14rem, 52vh) auto;
        align-content: center;
        gap: 1.5rem;
        padding: 1.5rem 2rem 3rem;
      }

      .visual {
        width: min(78vw, 25rem);
        justify-self: center;
      }

      .copy {
        justify-self: center;
        width: min(78vw, 25rem);
      }

      h1 {
        font-size: clamp(2.8rem, 13vw, 5rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse {
        animation: none;
        box-shadow: 0 0 0 0.75rem rgba(209, 81, 104, 0.16);
      }
    }
  </style>
</head>
<body data-bridge-state="connecting">
  <main class="shell">
    <div class="visual" aria-hidden="true">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="axis axis-x"></div>
      <div class="axis axis-y"></div>
      <div class="terminal">
        <div class="terminal-bar"><span></span><span></span><span></span></div>
        <div class="terminal-lines"><span></span><span></span><span></span></div>
      </div>
      <div class="node node-a"></div>
      <div class="node node-b"></div>
      <div class="node node-c"></div>
      <div class="node node-d"></div>
      <div class="pulse"></div>
    </div>
    <div class="copy">
      <h1 id="headline">Keep this page open</h1>
      <p id="detail">Switch back to btcli.</p>
    </div>
  </main>
  <script type="module">
    import { web3Accounts, web3Enable, web3FromAddress } from "https://esm.sh/@polkadot/extension-dapp@0.46.9";

    const APP_NAME = "Bittensor SDK";
    const headlineEl = document.getElementById("headline");
    const detailEl = document.getElementById("detail");
    const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
    const bridgeSession = new URLSearchParams(location.search).get("session") || "";
    let ws;
    let extensionsEnabled = false;

    function setBridgeState(state) {
      document.body.dataset.bridgeState = state;
    }

    function showCopy(headline, detail) {
      headlineEl.textContent = headline;
      detailEl.textContent = detail;
    }

    function showError(headline, detail) {
      setBridgeState("error");
      showCopy(headline, detail);
    }

    function showWaiting() {
      setBridgeState("ready");
      showCopy("Keep this page open", "Switch back to btcli.");
    }

    function showSigning() {
      setBridgeState("authorizing");
      showCopy("Approve in your wallet", "Confirm or reject the signature request.");
    }

    function showSignError(error) {
      showError(
        "Signing failed",
        error?.message || String(error) || "Switch back to btcli for details."
      );
    }

    function showTransactionResult(success) {
      setBridgeState(success ? "complete" : "failed");
      showCopy(
        success ? "Transaction complete" : "Transaction failed",
        success ? "You can close this page." : "Switch back to btcli."
      );
    }

    async function ensureExtensions() {
      if (extensionsEnabled) {
        return;
      }
      setBridgeState("authorizing");
      const extensions = await web3Enable(APP_NAME);
      if (!extensions.length) {
        throw new Error("No compatible wallet extension found. Install Talisman or Polkadot.js in this browser.");
      }
      extensionsEnabled = true;
      setBridgeState("ready");
    }

    async function listAccounts() {
      await ensureExtensions();
      const accounts = await web3Accounts();
      return accounts.map((account) => ({
        address: account.address,
        name: account.meta?.name || account.address,
        meta: {
          name: account.meta?.name || account.address,
          source: account.meta?.source || "unknown",
        },
        source: account.meta?.source || "unknown",
        type: account.type || "sr25519",
      }));
    }

    async function signExtrinsic(params) {
      const payload = params?.payload;
      if (!payload?.address) {
        throw new Error("missing payload.address");
      }
      showSigning();
      await ensureExtensions();
      const injector = await web3FromAddress(payload.address);
      const signature = await injector.signer.signPayload(payload);
      showWaiting();
      return signature;
    }

    async function signBytes(params) {
      const address = params?.address;
      const data = params?.data;
      if (!address || !data) {
        throw new Error("missing address or data");
      }
      showSigning();
      await ensureExtensions();
      const injector = await web3FromAddress(address);
      const signature = await injector.signer.signRaw({
        address,
        data,
        type: params?.type || "bytes",
      });
      showWaiting();
      return signature;
    }

    async function handleRequest(request) {
      switch (request.method) {
        case "accounts.list":
          return { accounts: await listAccounts() };
        case "extrinsic.sign":
          return await signExtrinsic(request.params || {});
        case "bytes.sign":
          return await signBytes(request.params || {});
        case "transaction.result":
          showTransactionResult(request.params?.success === true);
          return { acknowledged: true };
        default:
          throw new Error(`unsupported method ${request.method}`);
      }
    }

    function connect() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        ws.send(JSON.stringify({ role: "bridge", session: bridgeSession }));
        setBridgeState("authorizing");
        showWaiting();
        listAccounts().catch((error) => {
          showError(
            "Authorization failed",
            error.message || String(error)
          );
        });
      };
      ws.onclose = (event) => {
        if (event.code === 1008) {
          showError(
            "Stale session",
            "This bridge tab is stale — close it and run btcli again so a fresh tab opens."
          );
          return;
        }
        setBridgeState("connecting");
        showCopy("Reconnecting", "Bridge disconnected. Reconnecting…");
        setTimeout(connect, 1500);
      };
      ws.onerror = () => {
        showError("Connection error", "WebSocket error. Check that btcli is still running.");
      };
      ws.onmessage = async (event) => {
        let request;
        try {
          request = JSON.parse(event.data);
        } catch {
          return;
        }
        if (!request?.id || !request?.method) {
          return;
        }
        try {
          const result = await handleRequest(request);
          ws.send(JSON.stringify({ id: request.id, result }));
        } catch (error) {
          // Always return the error to btcli; also surface sign/account failures
          // on this page so a wallet rejection doesn't leave "Keep this page open".
          if (request.method === "extrinsic.sign" || request.method === "bytes.sign") {
            showSignError(error);
          } else if (request.method === "accounts.list") {
            showError("Authorization failed", error.message || String(error));
          }
          ws.send(JSON.stringify({ id: request.id, error: { message: error.message || String(error) } }));
        }
      };
    }

    connect();
  </script>
</body>
</html>
