[package]
name = "bittensor-core-py"
version = "0.1.0"
edition = "2021"
publish = false
description = "PyO3 bindings for bittensor-core (PyPI package: bittensor-core, module: bittensor_core)"
license = "Apache-2.0"

[lib]
name = "bittensor_core"
crate-type = ["cdylib"]

[dependencies]
bittensor-core = { path = "../bittensor-core" }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false }
hex = "0.4.3"
pyo3 = { version = "0.23", features = ["abi3-py310"] }
rayon = "1.10"
scale-info = { version = "2.11.6", default-features = false }

[features]
default = ["ledger"]
# Ledger generic-app support (HID). Disable to build a wheel without the
# hidapi native dependency.
ledger = ["bittensor-core/ledger"]

[lints]
workspace = true
