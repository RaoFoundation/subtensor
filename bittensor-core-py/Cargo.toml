[package]
name = "bittensor-core-py"
version = "0.1.0"
edition = "2021"
publish = false
description = "PyO3 bindings for bittensor-core (PyPI package: bittensor-core, module: bittensor_core)"
license = "Apache-2.0"

[lib]
name = "bittensor_core"
crate-type = ["cdylib"]

[dependencies]
bittensor-core = { path = "../bittensor-core" }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false }
hex = "0.4.3"
pyo3 = { version = "0.23", features = ["abi3-py310"] }

[lints]
workspace = true
