[package]
name = "bittensor-drand"
version = "2.0.0"
edition = "2021"
publish = false
description = "Drand timelock encryption for Bittensor commit-reveal weights, built from the monorepo so the epoch-schedule simulation always matches the chain"
license = "MIT"

[lib]
name = "bittensor_drand"
crate-type = ["cdylib", "rlib"]

# Std client crate: most deps are direct (not workspace-inherited) because
# the workspace pins them with default-features = false for the no-std
# runtime. The root Cargo.lock still unifies the resolved versions. `tle` and
# `w3f-bls` inherit the workspace pins (the ideal-lab5 rev and the
# RaoFoundation/bls fix-no-std fork) so ciphertexts never drift from what
# pallet-drand can decrypt.
[dependencies]
ark-serialize = { version = "0.4.0", features = ["derive"], default-features = false }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive", "max-encoded-len"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# Must match py-sp-core's pyo3: pyo3-ffi links the native `python` library,
# and cargo allows only one linking version per workspace graph. abi3-py310
# gives one wheel per platform, same as py-sp-core.
pyo3 = { version = "0.23", features = ["abi3-py310", "generate-import-lib"] }
rand_core = "0.6.4"
tokio = { version = "1.38", features = ["full"] }
tle = { workspace = true, features = ["std"] }
sha2 = "0.10.8"
w3f-bls = { workspace = true, features = ["std"] }
serde = { version = "1.0.215", features = ["derive"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls-native-roots"] }
libc = "0.2.172"
# ML-KEM dependencies
ml-kem = "0.2.1"
chacha20poly1305 = "0.10"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }
